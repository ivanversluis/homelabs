apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kong-routeros
  namespace: flux-system
spec:
  interval: 10m
  path: ./services/gateway/kong/api-gateway/routeros-upstream
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kong-routeros-bootstrap
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
