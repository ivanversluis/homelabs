---
# Flux Kustomization for the Cloudflare Tunnel daemon.
# Split out of the flat services/ aggregator (applied by the root flux-system
# Kustomization, which has force: true) for consistency with the other
# services and to avoid unnecessary forced re-applies of this deployment.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-tunnel
  namespace: flux-system
spec:
  interval: 10m
  path: ./services/tunnel/cloudflare/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
