---
# Flux Kustomization for Linkding (bookmarks).
# Dedicated reconciliation is required because the workload uses ${DOMAIN}
# for OIDC issuer endpoints and the bookmarks.${DOMAIN} public URL.
# Depends on: kong (ingress + OIDC callback routes through Kong).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linkding
  namespace: flux-system
spec:
  interval: 10m
  path: ./workloads/apps/linkding
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kong
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
