apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openasm
  namespace: flux-system
spec:
  interval: 10m
  path: ./workloads/apps/openasm
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kong
    - name: longhorn
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
