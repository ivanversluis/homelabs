---
# Flux Kustomization: VM workloads (vms namespace).
# Deploys VM definitions from workloads/vms while preserving the existing
# Kustomization identity and inventory ownership.
# Depends on kubevirt (operator) and cdi (disk importer) being ready first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vms
  namespace: flux-system
spec:
  interval: 10m
  path: ./workloads/vms
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kubevirt
    - name: cdi
