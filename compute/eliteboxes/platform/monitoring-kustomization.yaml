---
# Flux Kustomization for the monitoring stack (kps, metrics-server and gatus).
# Separate from the root platform path because several manifests require postBuild substitution:
#   - platform/observability/monitoring/gatus/gatus-configmap-config.yaml → ${DOMAIN}
# Depends on: kong (Gatus ingress uses Kong IngressClass + wildcard cert).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/observability/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kong
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
