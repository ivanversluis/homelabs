---
# Establish schemas before the new operator starts; never prune CNI CRDs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: calico-crds
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./platform/networking/calico/k8s/vendor/v3.32.1/crds
  prune: false
  force: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
