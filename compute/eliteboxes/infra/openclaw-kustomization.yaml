---
# Flux Kustomization for OpenClaw.
# Split out of the flat infra/ aggregator so OpenClaw has a dedicated owner and
# its persistent state is not exposed to root-level force/prune behavior.
#
# Runtime configuration is Git/Vault authoritative:
# - Git defines the OpenClaw config template and deployment behavior.
# - Vault/External Secrets provide credentials and deployment-specific IDs.
# - The PVC stores mutable state only; openclaw.json is rendered outside it.
# DOMAIN substitution is required for the Kong AI base URL.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/openclaw
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kong
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
