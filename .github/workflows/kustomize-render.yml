name: Kustomize Render Validation

on:
  push:
    branches:
      - main
    paths:
      - "clusters/**"
      - "infra/**"
      - "platform/**"
      - "services/**"
      - "workloads/**"
      - "scripts/validate-kustomizations.sh"
      - "scripts/validate-longhorn-oauth2-selector.py"
      - "scripts/iam-patch-authentik-redirect-uris.sh"
      - "scripts/validate-mutable-images.py"
      - "scripts/mutable-image-allowlist.txt"
      - ".github/workflows/kustomize-render.yml"
  pull_request:
    paths:
      - "clusters/**"
      - "infra/**"
      - "platform/**"
      - "services/**"
      - "workloads/**"
      - "scripts/validate-kustomizations.sh"
      - "scripts/validate-longhorn-oauth2-selector.py"
      - "scripts/iam-patch-authentik-redirect-uris.sh"
      - "scripts/validate-mutable-images.py"
      - "scripts/mutable-image-allowlist.txt"
      - ".github/workflows/kustomize-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render all Kustomizations
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show renderer version
        run: kubectl version --client

      - name: Validate render script syntax
        run: bash -n scripts/validate-kustomizations.sh

      - name: Validate OIDC redirect recovery script
        run: |
          bash -n scripts/iam-patch-authentik-redirect-uris.sh
          bash scripts/iam-patch-authentik-redirect-uris.sh --self-test

      - name: Validate Longhorn oauth2-proxy migration selector
        run: |
          kubectl kustomize platform/storage/longhorn/oauth2-proxy \
            --load-restrictor=LoadRestrictionsNone > /tmp/longhorn-oauth2.yaml
          python3 scripts/validate-longhorn-oauth2-selector.py /tmp/longhorn-oauth2.yaml

      - name: Validate mutable image baseline
        run: python3 scripts/validate-mutable-images.py

      - name: Render manifests with synthetic substitutions
        run: bash scripts/validate-kustomizations.sh
