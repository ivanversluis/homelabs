# Implement security automation in CI/CD for "shifting left":
# a DevSecOps approach moving security work into earlier phases of the SDLC.
name: Secrets Scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret and Domain Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check private domain is not committed
        id: domain_scan
        shell: bash
        continue-on-error: true
        env:
          PRIVATE_PUBLIC_DOMAIN: ${{ secrets.PRIVATE_PUBLIC_DOMAIN }}
        run: |
          set -euo pipefail

          echo "status=skipped" >> "${GITHUB_OUTPUT}"
          echo "current_file_count=0" >> "${GITHUB_OUTPUT}"
          echo "history_commit_count=0" >> "${GITHUB_OUTPUT}"

          if [ -z "${PRIVATE_PUBLIC_DOMAIN}" ]; then
            echo "PRIVATE_PUBLIC_DOMAIN secret is not configured or unavailable; skipping private domain scan."
            exit 0
          fi

          echo "::add-mask::${PRIVATE_PUBLIC_DOMAIN}"

          # Current tracked files in the checked-out workspace.
          current_matches="$(git grep -l -i -F -- "${PRIVATE_PUBLIC_DOMAIN}" || true)"

          # Scan only checked-out branch history.
          # Do not use --all here, because --all scans every fetched remote branch,
          # including old feature/Renovate/Copilot branches.
          history_matches="$(git log HEAD -F -S"${PRIVATE_PUBLIC_DOMAIN}" --pretty=format:%H -- . || true)"

          current_file_count="0"
          history_commit_count="0"

          if [ -n "${current_matches}" ]; then
            current_file_count="$(printf "%s\n" "${current_matches}" | sed '/^$/d' | wc -l | tr -d ' ')"
          fi

          if [ -n "${history_matches}" ]; then
            history_commit_count="$(printf "%s\n" "${history_matches}" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')"
          fi

          {
            echo "current_file_count=${current_file_count}"
            echo "history_commit_count=${history_commit_count}"
          } >> "${GITHUB_OUTPUT}"

          if [ "${current_file_count}" != "0" ]; then
            {
              echo "current_files<<EOF"
              printf "%s\n" "${current_matches}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

          if [ "${history_commit_count}" != "0" ]; then
            {
              echo "history_commits<<EOF"
              printf "%s\n" "${history_matches}" | sort -u
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

          if [ "${current_file_count}" != "0" ] || [ "${history_commit_count}" != "0" ]; then
            echo "status=failed" >> "${GITHUB_OUTPUT}"
            echo "::error::Private domain value was found in the checked-out branch. The value itself is masked and will not be printed."
            exit 1
          fi

          echo "status=passed" >> "${GITHUB_OUTPUT}"
          echo "Private domain leak check passed."

      - name: Run TruffleHog
        id: trufflehog_scan
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          extra_args: ""

      - name: Create security scan summary
        if: always()
        shell: bash
        env:
          DOMAIN_STATUS: ${{ steps.domain_scan.outputs.status }}
          DOMAIN_CURRENT_FILE_COUNT: ${{ steps.domain_scan.outputs.current_file_count }}
          DOMAIN_HISTORY_COMMIT_COUNT: ${{ steps.domain_scan.outputs.history_commit_count }}
          DOMAIN_CURRENT_FILES: ${{ steps.domain_scan.outputs.current_files }}
          DOMAIN_HISTORY_COMMITS: ${{ steps.domain_scan.outputs.history_commits }}
          TRUFFLEHOG_OUTCOME: ${{ steps.trufflehog_scan.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          domain_status="${DOMAIN_STATUS:-skipped}"
          domain_current_file_count="${DOMAIN_CURRENT_FILE_COUNT:-0}"
          domain_history_commit_count="${DOMAIN_HISTORY_COMMIT_COUNT:-0}"
          trufflehog_outcome="${TRUFFLEHOG_OUTCOME:-unknown}"

          overall_status="passed"
          if [ "${domain_status}" = "failed" ] || [ "${trufflehog_outcome}" = "failure" ]; then
            overall_status="failed"
          fi

          {
            echo "## Secrets Scan Summary"
            echo ""
            echo "| Check | Result | Details |"
            echo "|---|---:|---|"

            if [ "${domain_status}" = "passed" ]; then
              echo "| Private domain scan | Passed | No private domain value found in current files or checked-out branch history. |"
            elif [ "${domain_status}" = "failed" ]; then
              echo "| Private domain scan | Failed | ${domain_current_file_count} tracked file(s), ${domain_history_commit_count} historical commit(s) in checked-out branch history. The domain value is masked. |"
            else
              echo "| Private domain scan | Skipped | Repository secret PRIVATE_PUBLIC_DOMAIN is not configured or unavailable. |"
            fi

            if [ "${trufflehog_outcome}" = "success" ]; then
              echo "| TruffleHog secret scan | Passed | No TruffleHog findings detected. |"
            elif [ "${trufflehog_outcome}" = "failure" ]; then
              echo "| TruffleHog secret scan | Failed | Potential or verified secret detected. Check workflow annotations and logs. |"
            else
              echo "| TruffleHog secret scan | ${trufflehog_outcome} | Check workflow logs. |"
            fi

            echo ""
            echo "**Overall result:** ${overall_status}"
            echo ""
            echo "**Workflow run:** ${RUN_URL}"
            echo ""

            if [ "${domain_status}" = "failed" ]; then
              echo "### Private domain findings"
              echo ""
              echo "The private domain value itself is not printed. Only file paths and commit SHAs are shown."
              echo "Scope: current files and checked-out branch history only."
              echo ""

              if [ -n "${DOMAIN_CURRENT_FILES:-}" ]; then
                echo "#### Current tracked files"
                echo ""
                echo '```text'
                printf "%s\n" "${DOMAIN_CURRENT_FILES}"
                echo '```'
                echo ""
              fi

              if [ -n "${DOMAIN_HISTORY_COMMITS:-}" ]; then
                echo "#### Historical commits in checked-out branch"
                echo ""
                echo '```text'
                printf "%s\n" "${DOMAIN_HISTORY_COMMITS}"
                echo '```'
                echo ""
              fi
            fi

            if [ "${trufflehog_outcome}" = "failure" ]; then
              echo "### TruffleHog findings"
              echo ""
              echo "TruffleHog detected at least one potential or verified secret. Review the workflow annotations and logs."
              echo ""
              echo "For real credentials, rotate the secret before removing it from the repository."
              echo ""
              echo "For confirmed false positives, add a targeted exclusion instead of disabling the scan."
              echo ""
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Send Discord notification
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DOMAIN_STATUS: ${{ steps.domain_scan.outputs.status }}
          DOMAIN_CURRENT_FILE_COUNT: ${{ steps.domain_scan.outputs.current_file_count }}
          DOMAIN_HISTORY_COMMIT_COUNT: ${{ steps.domain_scan.outputs.history_commit_count }}
          TRUFFLEHOG_OUTCOME: ${{ steps.trufflehog_scan.outcome }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not configured; skipping Discord notification."
            exit 0
          fi

          domain_status="${DOMAIN_STATUS:-skipped}"
          domain_current_file_count="${DOMAIN_CURRENT_FILE_COUNT:-0}"
          domain_history_commit_count="${DOMAIN_HISTORY_COMMIT_COUNT:-0}"
          trufflehog_outcome="${TRUFFLEHOG_OUTCOME:-unknown}"

          overall_status="PASSED"
          color="3066993"

          if [ "${domain_status}" = "failed" ] || [ "${trufflehog_outcome}" = "failure" ]; then
            overall_status="FAILED"
            color="15158332"
          fi

          payload="$(jq -n \
            --arg title "Secrets Scan ${overall_status}" \
            --arg repository "${REPOSITORY}" \
            --arg branch "${BRANCH}" \
            --arg event_name "${EVENT_NAME}" \
            --arg actor "${ACTOR}" \
            --arg domain_status "${domain_status}" \
            --arg domain_current_file_count "${domain_current_file_count}" \
            --arg domain_history_commit_count "${domain_history_commit_count}" \
            --arg trufflehog_outcome "${trufflehog_outcome}" \
            --arg run_url "${RUN_URL}" \
            --argjson color "${color}" \
            '{
              embeds: [
                {
                  title: $title,
                  color: $color,
                  fields: [
                    {
                      name: "Repository",
                      value: $repository,
                      inline: true
                    },
                    {
                      name: "Branch",
                      value: $branch,
                      inline: true
                    },
                    {
                      name: "Event",
                      value: $event_name,
                      inline: true
                    },
                    {
                      name: "Actor",
                      value: $actor,
                      inline: true
                    },
                    {
                      name: "Private domain scan",
                      value: $domain_status,
                      inline: true
                    },
                    {
                      name: "Private domain current files",
                      value: $domain_current_file_count,
                      inline: true
                    },
                    {
                      name: "Private domain branch-history commits",
                      value: $domain_history_commit_count,
                      inline: true
                    },
                    {
                      name: "TruffleHog scan",
                      value: $trufflehog_outcome,
                      inline: true
                    },
                    {
                      name: "Workflow run",
                      value: $run_url,
                      inline: false
                    }
                  ]
                }
              ]
            }'
          )"

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "${payload}" \
            "${DISCORD_WEBHOOK_URL}"

      - name: Fail workflow on security findings
        if: always()
        shell: bash
        env:
          DOMAIN_STATUS: ${{ steps.domain_scan.outputs.status }}
          TRUFFLEHOG_OUTCOME: ${{ steps.trufflehog_scan.outcome }}
        run: |
          set -euo pipefail

          domain_status="${DOMAIN_STATUS:-skipped}"
          trufflehog_outcome="${TRUFFLEHOG_OUTCOME:-unknown}"

          if [ "${domain_status}" = "failed" ] || [ "${trufflehog_outcome}" = "failure" ]; then
            echo "::error::Secrets scan failed. See the job summary and Discord notification for details."
            exit 1
          fi

          echo "Secrets scan passed."