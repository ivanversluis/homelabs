name: OpenClaw Diagnostic Tests
on:
  pull_request:
    paths:
      - "infra/openclaw/**"
      - ".github/workflows/openclaw-diagnostics.yml"
  push:
    branches: [main]
    paths:
      - "infra/openclaw/**"
      - ".github/workflows/openclaw-diagnostics.yml"
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Check JavaScript
        run: |
          node --check infra/openclaw/k8s-query.js
          node --check infra/openclaw/sync-agents.js
      - name: Mock Kubernetes API tests
        run: node infra/openclaw/tests/k8s-query.test.js
