name: Lifecycle Ansible Syntax

on:
  push:
    branches:
      - main
    paths:
      - "automation/ansible/**"
      - "scripts/lifecycle/**"
      - "infra/semaphoreui/semaphoreui-helmrelease.yaml"
      - "docs/lifecycle/containerd-image-prune.md"
      - "docs/lifecycle/disk-path-investigation.md"
      - ".github/workflows/lifecycle-ansible-syntax.yml"
  pull_request:
    paths:
      - "automation/ansible/**"
      - "scripts/lifecycle/**"
      - "infra/semaphoreui/semaphoreui-helmrelease.yaml"
      - "docs/lifecycle/containerd-image-prune.md"
      - "docs/lifecycle/disk-path-investigation.md"
      - ".github/workflows/lifecycle-ansible-syntax.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Validate lifecycle automation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install Ansible
        run: |
          python -m pip install --disable-pip-version-check "ansible-core>=2.18,<2.21"
          ansible-galaxy collection install -r automation/ansible/requirements.yml

      - name: Syntax-check all Ansible playbooks
        working-directory: automation/ansible
        run: |
          set -euo pipefail
          for playbook in playbooks/*.yml; do
            echo "::group::$playbook"
            ansible-playbook --syntax-check "$playbook"
            echo "::endgroup::"
          done

      - name: Validate lifecycle shell entrypoints
        run: |
          set -euo pipefail
          bash -n scripts/lifecycle/bootstrap-control-tower.sh
          bash -n scripts/lifecycle/check-vault-health.sh
          bash -n scripts/lifecycle/configure-semaphore-image-prune.sh
          bash -n automation/ansible/scripts/disk-path-investigation.sh
          bash -n scripts/lifecycle/configure-semaphore-disk-investigation.sh
          bash -n scripts/lifecycle/tests/configure-semaphore-disk-investigation.sh
          bash -n scripts/lifecycle/semaphore-control-tower-run.sh
          bash -n scripts/lifecycle/tests/configure-semaphore-image-prune.sh
          bash -n scripts/lifecycle/tests/check-vault-health.sh
          bash -n scripts/lifecycle/validate-control-tower.sh

      - name: Test Vault health classification
        run: bash scripts/lifecycle/tests/check-vault-health.sh

      - name: Test Semaphore image-prune provisioning
        run: bash scripts/lifecycle/tests/configure-semaphore-image-prune.sh

      - name: Test containerd prune accounting and failure handling
        run: python scripts/lifecycle/tests/containerd-prune-report.py

      - name: Test read-only disk investigation and Semaphore template
        run: |
          python scripts/lifecycle/tests/disk-path-investigation.py
          bash scripts/lifecycle/tests/configure-semaphore-disk-investigation.sh
