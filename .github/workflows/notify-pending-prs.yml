name: Notify Pending PRs

on:
  pull_request:
    types: [opened, reopened]
  schedule:
    - cron: "0 9 * * *" # Daily at 09:00 UTC

jobs:
  notify-on-open:
    name: Notify new PR via Discord
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification for new PR
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not configured; skipping Discord notification."
            exit 0
          fi

          payload="$(jq -n \
            --arg title "New PR: ${PR_TITLE}" \
            --arg url "${PR_URL}" \
            --arg author "${PR_AUTHOR}" \
            --arg repository "${REPOSITORY}" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                color: 3447003,
                fields: [
                  {name: "Author", value: $author, inline: true},
                  {name: "Repository", value: $repository, inline: true}
                ],
                footer: {text: "Review and merge when ready"}
              }]
            }'
          )"

          if ! curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-max-time 60 \
            --request POST \
            --header "Content-Type: application/json" \
            --data "${payload}" \
            "${DISCORD_WEBHOOK_URL}"; then
            echo "::warning::Discord notification failed after bounded retries."
          fi

  daily-summary:
    name: Daily pending PR summary
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check for open PRs and notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not configured; skipping Discord notification."
            exit 0
          fi

          # Get open PRs
          PRS=$(gh pr list --repo "${{ github.repository }}" --state open --json number,title,url,createdAt --limit 20)
          COUNT=$(echo "$PRS" | jq length)

          if [ "$COUNT" -eq 0 ]; then
            echo "No open PRs, skipping notification"
            exit 0
          fi

          # Build PR list for Discord
          PR_LIST=""
          echo "$PRS" | jq -r '.[] | "• [#\(.number)] \(.title) - \(.url)"' | while read -r line; do
            PR_LIST="${PR_LIST}${line}\n"
          done

          DESCRIPTION=$(echo "$PRS" | jq -r '.[] | "• [#\(.number) \(.title)](\(.url))"' | head -15)

          payload="$(jq -n \
            --arg title "${COUNT} PRs pending review in homelabs" \
            --arg url "https://github.com/${{ github.repository }}/pulls" \
            --arg description "${DESCRIPTION}" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $description,
                color: 15105570,
                footer: {text: "Daily summary - review and merge when ready"}
              }]
            }'
          )"

          if ! curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-max-time 60 \
            --request POST \
            --header "Content-Type: application/json" \
            --data "${payload}" \
            "${DISCORD_WEBHOOK_URL}"; then
            echo "::warning::Discord notification failed after bounded retries."
          fi
