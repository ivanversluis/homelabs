name: Public routes consistency

on:
  pull_request:
    paths:
      - "automation/infra-as-code/terraform/deployments/tunnel.tf"
      - "platform/observability/monitoring/gatus/**"
      - "workloads/apps/homepage/homepage-configmap.yaml"
      - "docs/networking/ingress-overview.md"
      - "scripts/validate-public-routes.py"
      - ".github/workflows/public-routes-consistency.yml"
  push:
    branches: [main]
    paths:
      - "automation/infra-as-code/terraform/deployments/tunnel.tf"
      - "platform/observability/monitoring/gatus/**"
      - "workloads/apps/homepage/homepage-configmap.yaml"
      - "docs/networking/ingress-overview.md"
      - "scripts/validate-public-routes.py"
      - ".github/workflows/public-routes-consistency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routes-match-gatus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Public route, monitoring, navigation and documentation are consistent
        run: python3 scripts/validate-public-routes.py
