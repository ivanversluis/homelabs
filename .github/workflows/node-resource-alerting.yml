name: Node resource alerting validation

on:
  pull_request:
    paths:
      - platform/observability/grafana/**
      - platform/observability/kustomization.yaml
      - scripts/test-node-resource-alerting.py
      - .github/workflows/node-resource-alerting.yml
  push:
    branches: [main]
    paths:
      - platform/observability/grafana/**
      - platform/observability/kustomization.yaml
      - scripts/test-node-resource-alerting.py
      - .github/workflows/node-resource-alerting.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends prometheus python3-yaml
      - name: Test dashboard wiring and resource alert semantics
        run: python3 scripts/test-node-resource-alerting.py
      - name: Render observability manifests
        run: kubectl kustomize platform/observability > /tmp/observability.yaml
