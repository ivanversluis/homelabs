# KongPlugin: AI Proxy — routes requests to Azure AI Foundry.
# Reference this plugin on any Ingress that should have LLM capabilities:
#   metadata:
#     annotations:
#       konghq.com/plugins: ai-proxy-azure
#
# The full plugin config (including the Azure API key) is stored in the
# Secret "kong-ai-proxy-config" generated by azure-ai-plugin-config-externalsecret.yaml.
# No credentials are stored in Git.
#
# Usage: POST https://ai.${DOMAIN}/v1/chat/completions
#        Authorization: Bearer <internal-token>
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: ai-proxy-azure
  namespace: kong
  annotations:
    kubernetes.io/description: "Routes LLM requests to Azure AI Foundry"
plugin: ai-proxy
# configFrom references the Secret rendered by azure-ai-plugin-config-externalsecret.yaml.
# The entire plugin config JSON lives in that Secret under the key "config".
configFrom:
  secretKeyRef:
    name: kong-ai-proxy-config
    key: config
