# ExternalSecret: generates the full ai-proxy KongPlugin config JSON from Vault.
#
# WHY this exists instead of valueFrom in the plugin config:
#   Kong OSS KIC does not support secret injection inside KongPlugin config fields.
#   The correct approach is configFrom.secretKeyRef pointing to a Secret whose
#   entire value is the JSON-encoded plugin config.
#   This ExternalSecret uses ESO's template engine to build that JSON at sync time.
#
# Prerequisites in Vault (see kong-ai-secrets.md-local):
#   vault kv put secret/infra/kong \
#     azure-openai-api-key=<key> \
#     azure-openai-instance=<resource-name> \
#     azure-openai-deployment=<deployment-id>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kong-ai-proxy-plugin-config
  namespace: kong
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kong-ai-proxy-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Kong configFrom expects the entire plugin config as a JSON string
        config: |
          {
            "route_type": "llm/v1/chat",
            "auth": {
              "header_name": "api-key",
              "header_value": "{{ .azure_api_key }}"
            },
            "model": {
              "provider": "azure",
              "name": "{{ .azure_model_name }}",
              "options": {
                "azure_api_version": "2025-01-01-preview",
                "azure_instance": "{{ .azure_instance }}",
                "azure_deployment_id": "{{ .azure_deployment_id }}",
                "max_tokens": 4096
              }
            },
            "response_streaming": "allow",
            "max_request_body_size": 65536
          }
  data:
    - secretKey: azure_api_key
      remoteRef:
        key: infra/kong
        property: azure-openai-api-key
    - secretKey: azure_instance
      remoteRef:
        key: infra/kong
        property: azure-openai-instance
    - secretKey: azure_model_name
      remoteRef:
        key: infra/kong
        property: azure-openai-model-name
    - secretKey: azure_deployment_id
      remoteRef:
        key: infra/kong
        property: azure-openai-deployment
