# ExternalSecret: pulls the Azure AI Foundry API key from Vault.
#
# Prerequisites in Vault:
#   vault kv put secret/infra/kong \
#     azure-openai-api-key=<your-key> \
#     azure-openai-instance=<your-resource-name> \
#     azure-openai-deployment=<your-deployment-id>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kong-azure-ai
  namespace: kong
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kong-azure-ai
  data:
    - secretKey: api-key
      remoteRef:
        key: infra/kong
        property: azure-openai-api-key
    - secretKey: azure-instance
      remoteRef:
        key: infra/kong
        property: azure-openai-instance
    - secretKey: azure-deployment-id
      remoteRef:
        key: infra/kong
        property: azure-openai-deployment
