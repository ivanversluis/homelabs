apiVersion: apps/v1
kind: Deployment
metadata:
  name: goodwe-prometheus-exporter
  namespace: home-exporters
  labels:
    app: goodwe-prometheus-exporter
    app.kubernetes.io/name: goodwe-prometheus-exporter
    app.kubernetes.io/part-of: homelabs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: goodwe-prometheus-exporter
  template:
    metadata:
      labels:
        app: goodwe-prometheus-exporter
        app.kubernetes.io/name: goodwe-prometheus-exporter
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/ivanversluis/iot-goodwe-prometheus-exporter:main
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: goodwe-prometheus-exporter-config
            - secretRef:
                name: goodwe-prometheus-exporter-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
