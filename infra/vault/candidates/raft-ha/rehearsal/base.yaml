# Synthetic-only experiment in an isolated namespace. NEVER load real Vault secrets.
# Apply manually as described in rehearsal/README.md; not referenced by Flux.
apiVersion: v1
kind: Namespace
metadata:
  name: vault-raft-rehearsal
  labels:
    app.kubernetes.io/part-of: vault-raft-rehearsal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-rehearsal-config
  namespace: vault-raft-rehearsal
data:
  file.hcl: |
    ui = true
    disable_mlock = true
    listener "tcp" {
      tls_disable = 1
      address = "[::]:8200"
      cluster_address = "[::]:8201"
    }
    storage "file" {
      path = "/vault/data"
    }
  migrate.hcl: |
    storage_source "file" {
      path = "/source"
    }
    storage_destination "raft" {
      path = "/destination/raft"
      node_id = "vault-0"
    }
    cluster_addr = "https://vault-0.vault-internal:8201"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-file-source
  namespace: vault-raft-rehearsal
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-worker
  resources:
    requests:
      storage: 10Gi
---
# Preseed the exact StatefulSet PVC name that chart vault v0.34.1 expects.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-vault-0
  namespace: vault-raft-rehearsal
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-worker
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: vault-file-source
  namespace: vault-raft-rehearsal
  labels:
    app: vault-file-source
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [k8s-worker01, k8s-worker02, k8s-worker03]
  containers:
    - name: vault
      image: hashicorp/vault:2.2.1
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-ec"]
      args: ["exec vault server -config=/config/file.hcl"]
      env:
        - name: VAULT_ADDR
          value: http://127.0.0.1:8200
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: data
          mountPath: /vault/data
  volumes:
    - name: config
      configMap:
        name: vault-rehearsal-config
    - name: data
      persistentVolumeClaim:
        claimName: vault-file-source
