# ExternalSecret: pulls Authentik OIDC client credentials for Open WebUI from Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-oidc
  namespace: ai
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openwebui-oidc
  data:
    - secretKey: client-id
      remoteRef:
        key: infra/openwebui
        property: oidc-client-id
    - secretKey: client-secret
      remoteRef:
        key: infra/openwebui
        property: oidc-client-secret
