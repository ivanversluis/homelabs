+# ExternalSecret: pulls Authentik OIDC configuration for Open WebUI from Vault.
# All OIDC env vars are sourced from Vault — never hardcode credentials in manifests.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-oidc
  namespace: ai
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openwebui-oidc
  data:
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        key: infra/openwebui
        property: OAUTH_CLIENT_ID
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: infra/openwebui
        property: OAUTH_CLIENT_SECRET
    - secretKey: ENABLE_LOGIN_FORM
      remoteRef:
        key: infra/openwebui
        property: ENABLE_LOGIN_FORM
    - secretKey: ENABLE_OAUTH_SIGNUP
      remoteRef:
        key: infra/openwebui
        property: ENABLE_OAUTH_SIGNUP
    - secretKey: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
      remoteRef:
        key: infra/openwebui
        property: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
    - secretKey: OAUTH_PROVIDER_NAME
      remoteRef:
        key: infra/openwebui
        property: OAUTH_PROVIDER_NAME
    - secretKey: OPENID_PROVIDER_URL
      remoteRef:
        key: infra/openwebui
        property: OPENID_PROVIDER_URL
    - secretKey: OPENID_REDIRECT_URI
      remoteRef:
        key: infra/openwebui
        property: OPENID_REDIRECT_URI
    - secretKey: WEBUI_URL
      remoteRef:
        key: infra/openwebui
        property: WEBUI_URL
