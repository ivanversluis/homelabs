# KongPlugin: request-transformer (mcp-inject-api-key)
# Injects the mcpo API key as an Authorization header when Kong forwards
# requests to the kubernetes-mcpo service.
#
# The plugin config is stored in Secret "mcp-plugin-inject-config" generated by
# mcp-inject-api-key-config-externalsecret.yaml using ESO's template engine.
# The mcpo API key is NEVER stored in Git or in the KongPlugin manifest.
#
# For Kong OSS, key-auth on this Ingress is enforced by the mcp-key-auth plugin
# (defined in kong-plugin-mcp-key-auth.yaml). OIDC (openid-connect) is a Kong
# Enterprise plugin; for OSS use key-auth + the consumer/credential below.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: mcp-inject-api-key
  namespace: ai
plugin: request-transformer
# configFrom references the Secret rendered by mcp-inject-api-key-config-externalsecret.yaml.
# The entire plugin config JSON lives in that Secret under the key "config".
configFrom:
  secretKeyRef:
    name: mcp-plugin-inject-config
    key: config
