# KongPlugin: key-auth — validates the API key sent by Open WebUI to the MCP endpoint.
# Open WebUI sends its key via the Authorization header (Bearer) or apikey header.
# The credential value is stored in the "openwebui-kongkey" Secret (managed by
# openwebui-kongkey-externalsecret.yaml — never created manually).
# KongPlugin: key-auth — validates the API key sent by Open WebUI to the MCP endpoint.
# Open WebUI sends its key via the Authorization header (Bearer) or apikey header.
# The credential value is stored in the "openwebui-kongkey" Secret (managed by
# openwebui-kongkey-externalsecret.yaml — never created manually).
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: mcp-key-auth
  namespace: ai
plugin: key-auth
config:
  key_names:
    - "apikey"
    - "Authorization"
  hide_credentials: true
  key_in_header: true
---
# ACL group credential for the openwebui consumer.
# MUST be created BEFORE the KongConsumer that references it — the Kong admission
# webhook validates all credential Secret references at consumer creation time.
# This assigns the consumer to the "openwebui-clients" group that the mcp-acl
# plugin's allow list requires. Without this, key-auth passes but ACL returns 403.
apiVersion: v1
kind: Secret
metadata:
  name: openwebui-acl-group
  namespace: ai
  labels:
    konghq.com/credential: acl
stringData:
  group: openwebui-clients
---
# KongConsumer representing Open WebUI.
# "credentials" lists the Secret names that hold the actual key-auth values.
# The openwebui-kongkey Secret is generated by openwebui-kongkey-externalsecret.yaml.
#
# NOTE: Kong KIC does NOT automatically assign consumers to groups based on username.
# The ACL group membership must be explicitly created as a credential Secret with
# label konghq.com/credential: acl — see openwebui-acl-group above.
#
# ORDER MATTERS: openwebui-acl-group Secret must exist before this consumer is
# applied — Kong admission webhook validates all credential references immediately.
apiVersion: configuration.konghq.com/v1
kind: KongConsumer
metadata:
  name: openwebui
  namespace: ai
  annotations:
    kubernetes.io/ingress.class: kong
username: openwebui
credentials:
  - openwebui-kongkey
  - openwebui-acl-group
---
# KongPlugin: ACL — restricts access to the openwebui-clients group only.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: mcp-acl
  namespace: ai
plugin: acl
config:
  allow:
    - openwebui-clients
  hide_groups_header: true
