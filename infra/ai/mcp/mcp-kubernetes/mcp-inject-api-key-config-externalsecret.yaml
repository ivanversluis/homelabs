# ExternalSecret: generates the mcp-inject-api-key KongPlugin config from Vault.
#
# WHY this exists:
#   KongPlugin config is a static YAML blob — shell-style $(VAR) placeholders are
#   never substituted at runtime. The correct pattern for Kong OSS KIC is:
#     1. Generate a Secret whose entire value is the JSON plugin config.
#     2. Reference it with configFrom.secretKeyRef in the KongPlugin.
#   This ExternalSecret uses ESO's template engine to embed the real key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-inject-api-key-config
  namespace: ai
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mcp-plugin-inject-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Kong configFrom expects JSON matching the plugin's config schema.
        # request-transformer: add an Authorization header before forwarding.
        config: |
          {"add":{"headers":["Authorization:Bearer {{ .mcpo_api_key }}"]}}
  data:
    - secretKey: mcpo_api_key
      remoteRef:
        key: infra/mcp
        property: mcpo-api-key
