apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcpo-api-key
  namespace: ai
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mcpo-api-key
  data:
    - secretKey: api-key
      remoteRef:
        key: infra/mcp
        property: mcpo-api-key
