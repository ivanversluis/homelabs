# mcp-nmap: MCP server for network scanning via nmap.
# Uses mcpo (bundled in the mcp-nmap Alpine image) as OpenAPI proxy.
#
# Architecture:
#   Single container: mcp-nmap image (Alpine) runs mcpo, which spawns mcp-nmap as a stdio subprocess.
#   nmap is installed natively in the same image — no cross-distro binary issues.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nmap-mcpo
  namespace: ai
  labels:
    app.kubernetes.io/name: nmap-mcpo
    app.kubernetes.io/component: mcp-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nmap-mcpo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nmap-mcpo
      annotations:
        prometheus.io/scrape: "false"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mcp-nmap
          image: ghcr.io/ivanversluis/mcp-hub/mcp-nmap:latest
          imagePullPolicy: Always
          # mcpo is installed in the same Alpine image; it wraps mcp-nmap as a stdio subprocess.
          # Everything runs in one container — no cross-distro binary issues.
          command: ["mcpo"]
          args:
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--api-key=$(MCPO_API_KEY)"
            - "--"
            - "mcp-nmap"
          env:
            - name: MCPO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcpo-api-key
                  key: api-key
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
