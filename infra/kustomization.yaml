apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - headlamp/
  - vault/
  - vault-config/
  - argocd-image-updater/
  # argocd and semaphoreui are managed by dedicated Flux Kustomizations
  # because their HelmRelease values use ${DOMAIN} for OIDC issuer URLs.
  # home-exporters is managed by a dedicated Flux Kustomization because the
  # goodwe NetworkPolicy uses ${GOODWE_INVERTER_CIDR}.
  # openclaw is managed exclusively by a dedicated Flux Kustomization with
  # force: false, so its PVC cannot be silently recreated.
  - nodes/
  - portainer/
  # flux-substitution creates flux-domain-vars in flux-system for components
  # that use dedicated postBuild.substituteFrom reconciliation.
  - flux-substitution/
