apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "1.21.*"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: cert-manager
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 5
  values:
    installCRDs: true
    # Use public recursive DNS for ACME DNS-01 propagation checks.
    # CoreDNS's forward plugin leaks stale/incomplete NS delegation info
    # (e.g. returns TLD nameservers instead of the real zone's authoritative
    # nameservers), which makes cert-manager query the wrong servers for the
    # challenge TXT record and DNS-01 propagation checks never succeed.
    dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
    dns01RecursiveNameserversOnly: true
    # Prometheus metrics
    prometheus:
      enabled: true
      servicemonitor:
        enabled: false  # enable when kube-prometheus-stack is deployed
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
