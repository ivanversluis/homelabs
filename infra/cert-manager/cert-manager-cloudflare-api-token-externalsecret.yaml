# ExternalSecret: pulls the Cloudflare API token from Vault (path: infra/cert-manager)
# so cert-manager can solve DNS-01 ACME challenges for *.${DOMAIN} without
# the token ever being stored in Git.
#
# Prerequisites in Vault:
#   vault kv put secret/infra/cert-manager cloudflare-api-token=<your-token>
#
# The Cloudflare API token needs the following permissions:
#   Zone - DNS - Edit   (for your domain zone)
#   Zone - Zone - Read
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
  data:
    - secretKey: api-token
      remoteRef:
        key: infra/cert-manager
        property: cloudflare-api-token
