---
# ClusterSecretStore provides a cluster-wide Vault backend for ExternalSecrets.
# ESO uses the Kubernetes auth method to authenticate to Vault.
#
# Prerequisites:
#   1. Vault must be initialized, unsealed, and have KV v2 enabled at "secret/"
#   2. Kubernetes auth must be enabled and configured in Vault
#   3. A Vault role "external-secrets" must exist, bound to the
#      "external-secrets-operator" service account in the
#      "external-secrets-system" namespace
#
# See: firewall-manager/docs/migration/vault-flux-migration.md
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets-operator"
            namespace: "external-secrets-system"
