apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
    spec:
      serviceAccountName: headlamp
      #flux-plugin
      initContainers:
        - name: install-flux-plugin
          image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "→ Installing Flux plugin..."
              cp -r /plugins/* /headlamp/plugins/
              echo "✓ Done:"
              ls -la /headlamp/plugins/
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins

      # app
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:latest
          imagePullPolicy: IfNotPresent
          args:
            - -in-cluster
            - -plugins-dir=/headlamp/plugins
            - -oidc-client-id=$(OIDC_CLIENT_ID)
            - -oidc-client-secret=$(OIDC_CLIENT_SECRET)
            - -oidc-idp-issuer-url=$(OIDC_IDP_ISSUER_URL)
            - -oidc-scopes=openid,profile,email,groups
            - -oidc-callback-url=$(OIDC_CALLBACK_URL)
          env:
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-secret
            - name: OIDC_IDP_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: idp-issuer-url
            - name: OIDC_CALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: oidc-callback-url
          ports:
            - name: http
              containerPort: 4466
              protocol: TCP
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 50m
              memory: 256Mi

      volumes:
        - name: plugins
          emptyDir: {}
