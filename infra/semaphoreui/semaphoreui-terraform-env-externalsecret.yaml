# Terraform input variables for the Semaphore "terraform" templates.
# Source: Vault secret/infra/terraform (seeded by
# automation/infra-as-code/terraform/bootstrap/seed-vault-from-tfvars.sh).
# Injected into the Semaphore pod as TF_VAR_* and forwarded to task runs via
# config.forwarded_env_vars in semaphoreui-helmrelease.yaml.
#
# The empty placeholder Secret below guarantees the pod can always start (the
# chart's envFrom is not optional) even before Vault is seeded; ESO merges the
# TF_VAR_* keys into it. Restart Semaphore after the first sync: envFrom is read
# at container start.
apiVersion: v1
kind: Secret
metadata:
  name: semaphoreui-terraform-env
  namespace: semaphoreui
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: Opaque
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: semaphoreui-terraform-env
  namespace: semaphoreui
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: semaphoreui-terraform-env
    creationPolicy: Merge
  data:
    - secretKey: TF_VAR_domain
      remoteRef:
        key: infra/terraform
        property: domain
    - secretKey: TF_VAR_authentik_url
      remoteRef:
        key: infra/terraform
        property: authentik_url
    - secretKey: TF_VAR_authentik_token
      remoteRef:
        key: infra/terraform
        property: authentik_token
    - secretKey: TF_VAR_cloudflare_api_token
      remoteRef:
        key: infra/terraform
        property: cloudflare_api_token
    - secretKey: TF_VAR_cloudflare_account_id
      remoteRef:
        key: infra/terraform
        property: cloudflare_account_id
    - secretKey: TF_VAR_cloudflare_tunnel_id
      remoteRef:
        key: infra/terraform
        property: cloudflare_tunnel_id
    - secretKey: TF_VAR_cloudflare_team_name
      remoteRef:
        key: infra/terraform
        property: cloudflare_team_name
    - secretKey: TF_VAR_cloudflare_zone_id
      remoteRef:
        key: infra/terraform
        property: cloudflare_zone_id
    - secretKey: TF_VAR_vault_prometheus_metrics_token
      remoteRef:
        key: infra/terraform
        property: vault_prometheus_metrics_token
    # Gatus values are written back into secret/infra/gatus by Terraform; they
    # must carry the current real values (empty string = disabled).
    - secretKey: TF_VAR_gatus_discord_webhook_url
      remoteRef:
        key: infra/terraform
        property: gatus_discord_webhook_url
    - secretKey: TF_VAR_gatus_portainer_monitor_token
      remoteRef:
        key: infra/terraform
        property: gatus_portainer_monitor_token
    - secretKey: TF_VAR_gatus_gitlab_monitor_token
      remoteRef:
        key: infra/terraform
        property: gatus_gitlab_monitor_token
