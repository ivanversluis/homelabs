apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: semaphoreui
  namespace: semaphoreui
spec:
  interval: 30m
  chart:
    spec:
      chart: semaphore
      version: "16.2.2"
      sourceRef:
        kind: HelmRepository
        name: semaphoreui
      interval: 12h
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  valuesFrom:
    - kind: Secret
      name: semaphoreui-oidc
      valuesKey: values.yaml   # Flux merges this on top of .spec.values
  values:
    replicaCount: 1

    image:
      repository: semaphoreui/semaphore
      tag: "v2.18.28"

    service:
      type: ClusterIP

    persistence:
      enabled: true
      size: 250Mi
      storageClass: longhorn
      accessModes:
        - ReadWriteOnce

    nodeSelector:
      node.longhorn.io/create-default-disk: "true"

    database:
      type: postgres
      host: semaphoreui-postgres
      port: 5432
      name: semaphoreui
      usernameFromSecret: true
      existingSecret: semaphoreui-postgres-secrets
      usernameKey: POSTGRES_USER
      passwordKey: POSTGRES_PASSWORD
      options:
        sslmode: disable
      persistence:
        enabled: false

    admin:
      create: true
      existingSecret: semaphoreui-secrets
      usernameKey: username
      passwordKey: password
      emailKey: email
      fullnameKey: fullname

    secrets:
      existingSecret: semaphoreui-secrets
      cookieHashKey: cookieHash
      cookieEncryptionKey: cookieEncryption
      accesskeyEncryptionKey: accesskeyEncryption

    runner:
      existingSecret: semaphoreui-secrets
      tokenKey: token

    # OIDC via Authentik
    oidc:
      enable: true
      providers:
        authentik:
          display_name: "Sign in with Authentik"
          provider_url: "https://auth.${DOMAIN}/application/o/semaphoreui/"
          redirect_url: "https://demo-semaphoreui.${DOMAIN}/api/auth/oidc/authentik/redirect"
          scopes:
            - openid
            - profile
            - email
          username_claim: "preferred_username"
          name_claim: "name"
          email_claim: "email"