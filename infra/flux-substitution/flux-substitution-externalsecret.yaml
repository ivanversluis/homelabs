---
# Creates a Secret in flux-system that Flux Kustomizations use via
# postBuild.substituteFrom to interpolate ${DOMAIN}, ${ACME_EMAIL},
# ${KONG_LB_IP}, ${KONG_EXTERNAL_LB_IP}, ${MIKROTIK_IP}, and
# ${GOODWE_INVERTER_CIDR} in manifests.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-domain-vars
  namespace: flux-system
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: flux-domain-vars
    creationPolicy: Owner
  data:
    - secretKey: DOMAIN
      remoteRef:
        key: secret/infra/kong-manifests-openui-gateway-mcp
        property: domain
    - secretKey: ACME_EMAIL
      remoteRef:
        key: secret/infra/kong-manifests-openui-gateway-mcp
        property: acme-email
    - secretKey: KONG_LB_IP
      remoteRef:
        key: secret/infra/kong-manifests-openui-gateway-mcp
        property: kong-lb-ip
    # KONG_EXTERNAL_LB_IP is the real MetalLB LAN VIP (from homelab-pool,
    # 172.16.20.205-215) that Kong's LoadBalancer Service requests.
    # KONG_LB_IP (above) is intentionally Kong's ClusterIP — it is only used
    # for the CoreDNS in-cluster split-brain hosts{} block, NOT for the
    # MetalLB annotation. Reusing KONG_LB_IP for both caused Kong's Service
    # to request its own ClusterIP as a LoadBalancer IP, which is outside
    # the pool range and left it stuck in <pending> forever.
    - secretKey: KONG_EXTERNAL_LB_IP
      remoteRef:
        key: secret/infra/kong-manifests-openui-gateway-mcp
        property: kong-external-lb-ip
    - secretKey: MIKROTIK_IP
      remoteRef:
        key: networking/mikrotik
        property: api_host
    - secretKey: GOODWE_INVERTER_CIDR
      remoteRef:
        key: infra/home-exporters/goodwe-prometheus-exporter
        property: GOODWE_INVERTER_CIDR
