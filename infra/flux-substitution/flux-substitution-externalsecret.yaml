---
# Creates a Secret in flux-system that Flux Kustomizations use via
# postBuild.substituteFrom to interpolate ${DOMAIN}, ${ACME_EMAIL},
# ${KONG_LB_IP}, and ${MIKROTIK_IP} in manifests. 
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-domain-vars
  namespace: flux-system
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: flux-domain-vars
    creationPolicy: Owner
  data:
    - secretKey: DOMAIN
      remoteRef:
        key: secret/infra/kong-manifests-openui-gateway-mcp
        property: domain
    - secretKey: ACME_EMAIL
      remoteRef:
        key: secret/infra/kong-manifests-openui-gateway-mcp
        property: acme-email
    - secretKey: KONG_LB_IP
      remoteRef:
        key: secret/infra/kong-manifests-openui-gateway-mcp
        property: kong-lb-ip
    - secretKey: MIKROTIK_IP
      remoteRef:
        key: networking/mikrotik
        property: api_host
