# Enable "Create Default Disk on Labeled Nodes" so only workers with
# node.longhorn.io/create-default-disk=true get a default disk.
apiVersion: v1
kind: ConfigMap
metadata:
  name: longhorn-default-setting
  namespace: longhorn-system
data:
  default-setting.yaml: |
    create-default-disk-labeled-nodes: true
    default-data-path: /var/lib/longhorn/
