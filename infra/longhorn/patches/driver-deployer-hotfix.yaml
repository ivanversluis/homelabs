# Longhorn v1.11.0 hotfix: update driver deployer to use the hotfixed
# manager image (v1.11.0-hotfix-1) per Longhorn v1.11.0 release notes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-driver-deployer
  namespace: longhorn-system
spec:
  template:
    spec:
      containers:
        - name: longhorn-driver-deployer
          image: docker.io/longhornio/longhorn-manager:v1.11.0-hotfix-1
          command:
            - longhorn-manager
            - -d
            - deploy-driver
            - --manager-image
            - docker.io/longhornio/longhorn-manager:v1.11.0-hotfix-1
            - --manager-url
            - http://longhorn-backend:9500/v1
