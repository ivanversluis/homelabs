apiVersion: batch/v1
kind: CronJob
metadata:
  name: openclaw-k8s-monitor
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/component: k8s-monitor
spec:
  schedule: "0 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openclaw
            app.kubernetes.io/component: k8s-monitor
        spec:
          serviceAccountName: openclaw
          restartPolicy: Never
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: k8s-monitor
              image: ghcr.io/openclaw/openclaw:2026.6.11
              imagePullPolicy: IfNotPresent
              command:
                - node
                - -e
                - |
                  const m = require("/config/k8s-monitor.js");
                  console.log(JSON.stringify(m.report));
                  const alert = m.report.discordAlert;
                  if (!alert || alert.error || alert.status >= 400) {
                    process.exit(1);
                  }
              env:
                - name: DISCORD_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: openclaw-secrets
                      key: DISCORD_TOKEN
                - name: NODE_ENV
                  value: production
                - name: KUBERNETES_IN_CLUSTER
                  value: "true"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: openclaw-config
            - name: tmp
              emptyDir: {}
