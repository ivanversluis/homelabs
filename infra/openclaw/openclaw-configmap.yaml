apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "controlUi": {
          "dangerouslyAllowHostHeaderOriginFallback": true,
          "allowedOrigins": []
        }
      },
      "agents": {
        "defaults": {
          "model": "openrouter/free"
        }
      },
      "channels": {
        "discord": {
          "enabled": true,
          "token": {
            "source": "env",
            "provider": "default",
            "id": "DISCORD_TOKEN"
          }
        }
      }
    }
  AGENTS.md: |
    # Homelab K8s Ops Agent

    You are **Claw**, a senior Kubernetes SRE running inside the homelab cluster
    on a HP EliteDesk 800 G9 (i5-12600, 16 GB RAM, Arch Linux).
    The cluster has 1 control node; 3 worker nodes are planned but not yet added.

    ## Your primary job
    Every 5 minutes (heartbeat) and whenever asked, you:
    1. **Scan** the cluster for errors, warnings, and anomalies using the k8s-monitor skill.
    2. **Analyse** what you find — distinguish real problems from noise.
    3. **Decide** on a severity level:
       - 🟢 **OK** — Nothing actionable, stay quiet.
       - 🟡 **Warning** — Post a brief update to #k8s-alerts in Discord.
       - 🔴 **Error / Critical** — Post a detailed alert to #k8s-alerts AND suggest
         whether a ticket should be created (the human decides to confirm).
    4. **Suggest a fix** — always include concrete next steps the human can take
       or that you can execute if given the go-ahead.

    ## Rules
    - Never restart or delete pods without explicit human approval.
    - Keep alerts concise: one embed per issue, not a wall of text.
    - Include the namespace, resource name, and relevant log snippet in every alert.
    - If you see an issue you already reported in the last 2 hours, do NOT re-alert
      unless it has worsened. Avoid alert fatigue.
    - You have read-only access to cluster state. Ask the human before any write.
    - The k8s-monitor skill uses the pod service account to call the K8s API
      directly over HTTPS — no kubectl binary is required or used.
      Run on `host=auto` or `host=gateway`. Do NOT use `host=sandbox`.
    - The k8s-monitor skill sends Discord alerts automatically via the Discord
      REST API when severity is not ok. Do NOT call the message tool for k8s
      alerts — it is already handled. After running the skill, check
      `discordAlert.status` in the returned report (200 = delivered successfully)
      and confirm back to the user with what was found.
  k8s-monitor.js: |
    "use strict";
    const { spawnSync } = require("child_process");

    const SEV = { OK: "ok", WARN: "warn", ERROR: "error", CRITICAL: "critical" };
    const CRITICAL_REASONS = new Set([
      "OOMKilling", "Failed", "BackOff", "Evicted", "NodeNotReady",
      "Killing", "FailedMount", "FailedScheduling",
    ]);

    /**
     * Fetch non-Normal events, all pods, and all nodes from the K8s API using
     * the pod's mounted service-account credentials.  A child Node.js process
     * is spawned so the three HTTPS calls can run with Promise.all (async)
     * while keeping the outer module synchronous for openclaw's require() contract.
     */
    function fetchClusterData() {
      const inner = [
        'const https = require("https"), fs = require("fs");',
        'const SA = "/var/run/secrets/kubernetes.io/serviceaccount";',
        'const TOKEN = fs.readFileSync(SA + "/token", "utf8").trim();',
        'const CA    = fs.readFileSync(SA + "/ca.crt");',
        'const HOST  = process.env.KUBERNETES_SERVICE_HOST;',
        'const PORT  = +(process.env.KUBERNETES_SERVICE_PORT || 443);',
        'function get(path) {',
        '  return new Promise((resolve) => {',
        '    const req = https.request(',
        '      { hostname: HOST, port: PORT, path, method: "GET",',
        '        headers: { Authorization: "Bearer " + TOKEN, Accept: "application/json" }, ca: CA },',
        '      (res) => {',
        '        const chunks = [];',
        '        res.on("data", (c) => chunks.push(c));',
        '        res.on("end", () => {',
        '          try { resolve(JSON.parse(Buffer.concat(chunks).toString("utf8"))); }',
        '          catch { resolve({ items: [] }); }',
        '        });',
        '      }',
        '    );',
        '    req.on("error", () => resolve({ items: [] }));',
        '    req.setTimeout(15000, () => { req.destroy(); resolve({ items: [] }); });',
        '    req.end();',
        '  });',
        '}',
        'Promise.all([',
        '  get("/api/v1/events?fieldSelector=type%21%3DNormal&limit=200"),',
        '  get("/api/v1/pods?limit=500"),',
        '  get("/api/v1/nodes"),',
        ']).then(([ev, po, no]) => {',
        '  process.stdout.write(JSON.stringify({ ev, po, no }));',
        '}).catch(() => { process.stdout.write("{}"); });',
      ].join("\n");

      const r = spawnSync("node", ["-e", inner], {
        encoding: "utf8",
        timeout: 25000,
        env: process.env,
        maxBuffer: 10 * 1024 * 1024,
      });

      try {
        const d = JSON.parse(r.stdout || "{}");
        return {
          events: d.ev || { items: [] },
          pods:   d.po || { items: [] },
          nodes:  d.no || { items: [] },
        };
      } catch {
        return { events: { items: [] }, pods: { items: [] }, nodes: { items: [] } };
      }
    }

    function parseEvents(data) {
      return (data.items || []).map((e) => ({
        namespace: e.metadata.namespace,
        name:      e.involvedObject?.name,
        kind:      e.involvedObject?.kind,
        reason:    e.reason,
        message:   e.message,
        count:     e.count,
        lastSeen:  e.lastTimestamp,
      }));
    }

    function parseBadPods(data) {
      return (data.items || [])
        .filter((p) =>
          (p.status?.containerStatuses || []).some(
            (c) =>
              c.state?.waiting?.reason === "CrashLoopBackOff" ||
              c.state?.waiting?.reason === "ImagePullBackOff"  ||
              c.state?.waiting?.reason === "ErrImagePull"      ||
              c.state?.terminated?.reason === "OOMKilled"      ||
              (c.ready === false &&
               c.state?.terminated &&
               c.state.terminated.exitCode !== 0 &&
               c.restartCount > 0)
          )
        )
        .map((p) => ({
          namespace:  p.metadata.namespace,
          name:       p.metadata.name,
          phase:      p.status?.phase,
          containers: (p.status?.containerStatuses || []).map((c) => ({
            name:     c.name,
            ready:    c.ready,
            restarts: c.restartCount,
            state:    c.state,
          })),
        }));
    }

    function parseNodes(data) {
      return (data.items || []).map((n) => ({
        name:  n.metadata.name,
        ready: n.status?.conditions?.find((c) => c.type === "Ready")?.status,
        pressure: (n.status?.conditions || [])
          .filter(
            (c) =>
              ["MemoryPressure", "DiskPressure", "PIDPressure"].includes(c.type) &&
              c.status === "True"
          )
          .map((c) => c.type),
      }));
    }

    const { events: evRaw, pods: podRaw, nodes: nodeRaw } = fetchClusterData();

    const events            = parseEvents(evRaw);
    const badPods           = parseBadPods(podRaw);
    const nodes             = parseNodes(nodeRaw);
    const criticalEvents    = events.filter((e) => CRITICAL_REASONS.has(e.reason));
    const warnEvents        = events.filter((e) => !CRITICAL_REASONS.has(e.reason) && (e.count || 0) >= 3);
    const nodesNotReady     = nodes.filter((n) => n.ready !== "True");
    const nodesWithPressure = nodes.filter((n) => (n.pressure?.length || 0) > 0);

    let severity = SEV.OK;
    if (criticalEvents.length > 0 || badPods.length > 0 || nodesNotReady.length > 0) {
      severity = SEV.ERROR;
    } else if (warnEvents.length > 0 || nodesWithPressure.length > 0) {
      severity = SEV.WARN;
    }

    function buildAlertMessage(sev, sum, det) {
      const icon = (sev === SEV.ERROR || sev === SEV.CRITICAL) ? "\uD83D\uDD34" : "\uD83D\uDFE1";
      let msg = `${icon} **K8s Alert** \u2014 Severity: **${sev.toUpperCase()}**\n`;
      msg += `\n**Summary:** ${sum.criticalEvents} critical events | ${sum.unhealthyPods} unhealthy pods | ${sum.nodesNotReady} nodes not ready\n`;
      if (det.criticalEvents.length > 0) {
        msg += `\n**Critical Events:**\n`;
        det.criticalEvents.slice(0, 3).forEach((e) => {
          msg += `\u2022 \`${e.name}\` (${e.namespace}) \u2014 ${e.reason}: ${String(e.message || "").substring(0, 100)} (${e.count || 1}\u00d7)\n`;
        });
      }
      if (det.badPods.length > 0) {
        msg += `\n**Unhealthy Pods:**\n`;
        det.badPods.slice(0, 5).forEach((p) => {
          const reason = p.containers[0]?.state?.waiting?.reason
            || p.containers[0]?.state?.terminated?.reason
            || "unknown";
          msg += `\u2022 \`${p.name}\` (${p.namespace}) \u2014 ${reason}\n`;
        });
      }
      return msg.substring(0, 2000);
    }

    function sendDiscordAlert(sev, sum, det) {
      const token = process.env.DISCORD_BOT_TOKEN;
      if (!token || token.startsWith("https://")) {
        return { sent: false, error: "DISCORD_BOT_TOKEN not set or is a webhook URL" };
      }
      const inner = [
        'const https = require("https");',
        'const body = JSON.stringify({ content: process.env.MSG });',
        'const req = https.request({',
        '  hostname: "discord.com", port: 443,',
        '  path: "/api/v10/channels/" + process.env.CHAN + "/messages",',
        '  method: "POST",',
        '  headers: {',
        '    Authorization: "Bot " + process.env.TOK,',
        '    "Content-Type": "application/json",',
        '    "Content-Length": Buffer.byteLength(body),',
        '  },',
        '}, (res) => {',
        '  const c = []; res.on("data", d => c.push(d));',
        '  res.on("end", () => {',
        '    process.stdout.write(JSON.stringify({ status: res.statusCode, body: Buffer.concat(c).toString().substring(0, 300) }));',
        '  });',
        '});',
        'req.on("error", e => process.stdout.write(JSON.stringify({ error: e.message })));',
        'req.setTimeout(10000, () => { req.destroy(); process.stdout.write(JSON.stringify({ error: "timeout" })); });',
        'req.write(body); req.end();',
      ].join("\n");
      const r = spawnSync("node", ["-e", inner], {
        encoding: "utf8",
        timeout: 15000,
        env: { ...process.env, TOK: token, CHAN: "1498285999552204810", MSG: buildAlertMessage(sev, sum, det) },
      });
      try { return JSON.parse(r.stdout || "{}"); }
      catch { return { sent: false, error: r.stderr || "parse error" }; }
    }

    const scannedAt = new Date().toISOString();
    const summary = {
      criticalEvents:    criticalEvents.length,
      warningEvents:     warnEvents.length,
      unhealthyPods:     badPods.length,
      nodesNotReady:     nodesNotReady.length,
      nodesWithPressure: nodesWithPressure.length,
    };
    const details = { criticalEvents, warnEvents, badPods, nodesNotReady, nodesWithPressure };

    const discordAlert = severity !== SEV.OK
      ? sendDiscordAlert(severity, summary, details)
      : null;

    module.exports = {
      report: {
        severity,
        scannedAt,
        discordAlert,
        summary,
        details,
      },
    };
