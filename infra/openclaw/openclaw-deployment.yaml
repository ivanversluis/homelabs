apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw
    spec:
      serviceAccountName: openclaw
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-skills
          image: ghcr.io/openclaw/openclaw:2026.7.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mkdir -p /home/node/.openclaw/skills
              mkdir -p /home/node/.openclaw/.openclaw
              cp /config/k8s-monitor.js /home/node/.openclaw/skills/k8s-monitor.js
              cp /config/AGENTS.md /home/node/.openclaw/AGENTS.md
              mkdir -p /home/node/.openclaw/.openclaw/agents/main/agent

              # Only seed openclaw.json from ConfigMap on first boot.
              if [ ! -f /home/node/.openclaw/.openclaw/openclaw.json ]; then
                cp /config/openclaw.json /home/node/.openclaw/openclaw.json
                cp /config/openclaw.json /home/node/.openclaw/.openclaw/openclaw.json
              fi

              # Use openclaw config set for all patching so writes include proper
              # meta (sha256 / last-good tracking). This prevents OpenClaw from
              # treating our writes as external edits and restoring from backup.
              export HOME=/home/node
              export OPENCLAW_HOME=/home/node/.openclaw
              export OPENCLAW_CONFIG_DIR=/home/node/.openclaw/.openclaw
              export NPM_CONFIG_CACHE=/tmp/.npm

              # Gateway: allowed origins and trusted proxies
              if [ -n "$OPENCLAW_ALLOWED_ORIGINS" ]; then
                ORIGINS=$(node -e "console.log(JSON.stringify((process.env.OPENCLAW_ALLOWED_ORIGINS||'').split(',').map(s=>s.trim()).filter(Boolean)))")
                node /app/dist/index.js config set gateway.controlUi.allowedOrigins "$ORIGINS" --strict-json 2>/dev/null || true
                node /app/dist/index.js config set gateway.controlUi.dangerouslyAllowHostHeaderOriginFallback false --strict-json 2>/dev/null || true
              else
                node /app/dist/index.js config set gateway.controlUi.dangerouslyAllowHostHeaderOriginFallback true --strict-json 2>/dev/null || true
              fi
              if [ -n "$OPENCLAW_TRUSTED_PROXIES" ]; then
                PROXIES=$(node -e "console.log(JSON.stringify((process.env.OPENCLAW_TRUSTED_PROXIES||'').split(',').map(s=>s.trim()).filter(Boolean)))")
                node /app/dist/index.js config set gateway.trustedProxies "$PROXIES" --strict-json 2>/dev/null || true
              fi

              # Codex/OpenAI: use the current canonical OpenAI route for native
              # Codex runs and seed the main agent auth profile from Vault.
              node /app/dist/index.js config set plugins.allow '["discord","codex"]' --strict-json 2>/dev/null || true
              node /app/dist/index.js config set plugins.entries.codex.enabled true --strict-json 2>/dev/null || true
              node /app/dist/index.js config set models.providers.openai.models '[{"id":"gpt-5.5"}]' --strict-json 2>/dev/null || true
              node /app/dist/index.js config set agents.defaults.model '{"primary":"openai/gpt-5.5"}' --strict-json 2>/dev/null || true
              node -e '
              const fs = require("fs");
              const path = require("path");
              const raw = process.env.CODEX || "";
              if (!raw.trim()) process.exit(0);

              const authPath = "/home/node/.openclaw/.openclaw/agents/main/agent/auth-profiles.json";
              fs.mkdirSync(path.dirname(authPath), { recursive: true });

              function readJson(file, fallback) {
                try { return JSON.parse(fs.readFileSync(file, "utf8")); }
                catch { return fallback; }
              }
              function writeAuth(auth) {
                auth.version = auth.version || 1;
                auth.profiles = auth.profiles || {};
                auth.lastGood = auth.lastGood || {};
                auth.usageStats = auth.usageStats || {};
                fs.writeFileSync(authPath, JSON.stringify(auth, null, 2));
              }
              function expiry(v) {
                if (!v) return undefined;
                if (typeof v === "number") return v > 1000000000000 ? v : v * 1000;
                const t = Date.parse(v);
                return Number.isFinite(t) ? t : undefined;
              }
              function normalizeProfile(p) {
                if (!p || typeof p !== "object") return p;
                const next = { ...p };
                if (next.type === "apikey") next.type = "api_key";
                if (next.apiKey && !next.key) next.key = next.apiKey;
                if (next.access_token && !next.access) next.access = next.access_token;
                if (next.refresh_token && !next.refresh) next.refresh = next.refresh_token;
                if (!next.type && (next.access && next.refresh)) next.type = "oauth";
                if (!next.type && (next.key || next.keyRef)) next.type = "api_key";
                if (!next.provider) next.provider = "openai";
                return next;
              }
              function validProfile(p) {
                if (!p || typeof p !== "object" || typeof p.provider !== "string") return false;
                if (p.type === "api_key") return !!(p.key || p.keyRef);
                if (p.type === "token") return !!(p.token || p.tokenRef);
                if (p.type === "oauth") return !!(p.access && p.refresh);
                return false;
              }

              const auth = readJson(authPath, { version: 1, profiles: {}, lastGood: {}, usageStats: {} });
              auth.profiles = Object.fromEntries(
                Object.entries(auth.profiles || {})
                  .map(([id, profile]) => [id, normalizeProfile(profile)])
                  .filter(([, profile]) => validProfile(profile))
              );
              const profileId = "openai:codex";

              let parsed = null;
              try { parsed = JSON.parse(raw); } catch {}

              if (parsed && parsed.profiles && typeof parsed.profiles === "object") {
                auth.profiles = { ...auth.profiles, ...parsed.profiles };
                auth.profiles = Object.fromEntries(
                  Object.entries(auth.profiles || {})
                    .map(([id, profile]) => [id, normalizeProfile(profile)])
                    .filter(([, profile]) => validProfile(profile))
                );
                auth.lastGood = { ...auth.lastGood, ...(parsed.lastGood || {}) };
                auth.usageStats = { ...auth.usageStats, ...(parsed.usageStats || {}) };
                if (!auth.profiles[profileId]) {
                  const source = Object.entries(auth.profiles).find(([id]) => id.startsWith("openai:"))
                    || Object.entries(auth.profiles).find(([id]) => id.startsWith("openai-codex:"));
                  if (source) {
                    auth.profiles[profileId] = { ...source[1], provider: "openai" };
                    if (auth.profiles[profileId].type === "apikey") auth.profiles[profileId].type = "api_key";
                  }
                }
                if (auth.profiles[profileId]) auth.lastGood.openai = profileId;
                writeAuth(auth);
                process.exit(0);
              }

              if (parsed) {
                const tokens = parsed.tokens || parsed;
                const access = tokens.access || tokens.access_token || tokens.id_token;
                const refresh = tokens.refresh || tokens.refresh_token;
                if (access && refresh) {
                  auth.profiles[profileId] = {
                    type: "oauth",
                    provider: "openai",
                    access,
                    refresh,
                    expires: expiry(tokens.expires || tokens.expires_at || tokens.expiry || parsed.expires_at)
                      || Date.now() + 15 * 60 * 1000,
                    accountId: tokens.accountId || tokens.account_id || parsed.accountId || parsed.account_id,
                    email: tokens.email || parsed.email,
                  };
                  auth.lastGood.openai = profileId;
                  auth.usageStats[profileId] = auth.usageStats[profileId] || { errorCount: 0, lastUsed: 0 };
                  writeAuth(auth);
                  process.exit(0);
                }
              }

              auth.profiles[profileId] = {
                type: "api_key",
                provider: "openai",
                keyRef: { source: "env", provider: "default", id: "CODEX_API_KEY" },
              };
              auth.lastGood.openai = profileId;
              auth.usageStats[profileId] = auth.usageStats[profileId] || { errorCount: 0, lastUsed: 0 };
              writeAuth(auth);
              ' 2>/dev/null || true
              node /app/dist/index.js config set auth.order.openai '["openai:codex"]' --strict-json 2>/dev/null || true

              # Repair: strip any invalid top-level keys (e.g. "providers") from the
              # persisted openclaw.json that would prevent the gateway from starting.
              node -e '
              const fs = require("fs");
              const p = "/home/node/.openclaw/.openclaw/openclaw.json";
              if (!fs.existsSync(p)) process.exit(0);
              const VALID = new Set(["gateway","agents","channels","models","plugins","cron","skills","nodes","auth","telemetry"]);
              const c = JSON.parse(fs.readFileSync(p, "utf8"));
              let changed = false;
              for (const k of Object.keys(c)) {
                if (!VALID.has(k) && !k.startsWith("$")) { delete c[k]; changed = true; }
              }
              if (changed) fs.writeFileSync(p, JSON.stringify(c, null, 2));
              ' 2>/dev/null || true

              # Remove any persisted model override that is not a configured provider route.
              # Stale providers (vercel-ai-gateway, zai, etc.) accumulate in agent/session
              # configs from UI interaction and beat agents.defaults.model on resume.
              node -e '
              const fs = require("fs"), path = require("path");
              const agentsDir = "/home/node/.openclaw/.openclaw/agents";
              const ALLOWED = ["openrouter/", "azure/", "openai/"];
              function stale(m) { return m && typeof m==="string" && !ALLOWED.some(p=>m.startsWith(p)); }
              function clean(dir) {
                if (!fs.existsSync(dir)) return;
                for (const e of fs.readdirSync(dir, {withFileTypes:true})) {
                  const p = path.join(dir, e.name);
                  if (e.isFile() && e.name === "config.json") {
                    try {
                      const c = JSON.parse(fs.readFileSync(p, "utf8"));
                      if (stale(c.model)) { delete c.model; fs.writeFileSync(p, JSON.stringify(c, null, 2)); }
                    } catch(_) {}
                  } else if (e.isDirectory()) { clean(p); }
                }
              }
              clean(agentsDir);
              const sessFile = agentsDir + "/main/sessions/sessions.json";
              if (fs.existsSync(sessFile)) {
                try {
                  const s = JSON.parse(fs.readFileSync(sessFile, "utf8"));
                  let changed = false;
                  if (Array.isArray(s.sessions)) {
                    s.sessions = s.sessions.map(sess => {
                      if (stale(sess.model)) { delete sess.model; changed = true; }
                      return sess;
                    });
                  }
                  if (changed) fs.writeFileSync(sessFile, JSON.stringify(s, null, 2));
                } catch(_) {}
              }
              ' 2>/dev/null || true

              # Default model: OpenAI Codex via the native Codex runtime.
              node /app/dist/index.js config set agents.defaults.model '{"primary":"openai/gpt-5.5"}' --strict-json 2>/dev/null || true

              # Discord: DM allowlist and guild access without @mention
              if [ -n "$DISCORD_USER_ID" ]; then
                node /app/dist/index.js config set channels.discord.allowFrom \
                  "[\"$DISCORD_USER_ID\"]" --strict-json 2>/dev/null || true
              fi
              # K8s monitoring now runs as a Kubernetes CronJob. Remove older
              # OpenClaw LLM cron jobs from the persisted PVC state if present.
              node -e '
              const fs = require("fs");
              const p = "/home/node/.openclaw/.openclaw/cron/jobs.json";
              if (!fs.existsSync(p)) process.exit(0);
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              const before = (j.jobs || []).length;
              j.jobs = (j.jobs || []).filter(job =>
                !String(job.name || "").startsWith("k8s-monitor-") &&
                !(job.payload?.message || "").includes("k8s-monitor skill")
              );
              const changed = j.jobs.length !== before;
              if (changed) fs.writeFileSync(p, JSON.stringify(j, null, 2));
              ' 2>/dev/null || true

              if [ -n "$DISCORD_GUILD_ID" ]; then
                node /app/dist/index.js config set channels.discord.groupPolicy allowlist 2>/dev/null || true
                node /app/dist/index.js config set channels.discord.guilds \
                  "{\"$DISCORD_GUILD_ID\":{\"requireMention\":false}}" --strict-json 2>/dev/null || true
              fi
          env:
            - name: OPENCLAW_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENCLAW_ALLOWED_ORIGINS
            - name: OPENCLAW_TRUSTED_PROXIES
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENCLAW_TRUSTED_PROXIES
                  optional: true
            - name: DISCORD_USER_ID
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: DISCORD_USER_ID
            - name: DISCORD_GUILD_ID
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: DISCORD_GUILD_ID
            - name: CODEX
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: CODEX
                  optional: true
            - name: CODEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: CODEX
                  optional: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: config
              mountPath: /config
            - name: tmp-volume
              mountPath: /tmp
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:2026.7.1
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /app/dist/index.js
            - gateway
            - run
            - --allow-unconfigured
            - --bind
            - lan
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
          envFrom:
            - secretRef:
                name: openclaw-secrets
          env:
            - name: HOME
              value: /home/node
            - name: OPENCLAW_HOME
              value: /home/node/.openclaw
            - name: OPENCLAW_CONFIG_DIR
              value: /home/node/.openclaw/.openclaw
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: DISCORD_TOKEN
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
            - name: npm_config_cache
              value: /tmp/.npm
            - name: NODE_ENV
              value: production
            - name: KUBERNETES_IN_CLUSTER
              value: "true"
            # Azure AI Foundry — map Vault secrets to the standard env vars
            # that OpenClaw / Vercel AI SDK auto-discovers for the Azure provider.
            # The model will appear as azure/gpt-4o-mini in the UI.
            - name: AZURE_RESOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: AZURE_RESOURCE_NAME
                  optional: true
            - name: AZURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: AZURE_API_KEY
                  optional: true
            - name: CODEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: CODEX
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - require('http').get('http://127.0.0.1:18789/healthz',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - require('http').get('http://127.0.0.1:18789/readyz',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: workspace
              mountPath: /home/node/workspace
            - name: tmp-volume
              mountPath: /tmp
            - name: npm-cache
              mountPath: /home/node/.npm
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-data
        - name: workspace
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
        - name: npm-cache
          emptyDir: {}
        - name: config
          configMap:
            name: openclaw-config
