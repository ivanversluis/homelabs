apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw
    spec:
      serviceAccountName: openclaw
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-skills
          image: ghcr.io/openclaw/openclaw:2026.4.23
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mkdir -p /home/node/.openclaw/skills
              mkdir -p /home/node/.openclaw/.openclaw
              cp /config/k8s-monitor.js /home/node/.openclaw/skills/k8s-monitor.js
              cp /config/AGENTS.md /home/node/.openclaw/AGENTS.md
              cp /config/openclaw.json /home/node/.openclaw/openclaw.json
              cp /config/openclaw.json /home/node/.openclaw/.openclaw/openclaw.json
              node -e '
              const fs = require("fs");
              const originsRaw = process.env.OPENCLAW_ALLOWED_ORIGINS || "";
              const proxiesRaw = process.env.OPENCLAW_TRUSTED_PROXIES || "";
              const origins = originsRaw.split(",").map((s) => s.trim()).filter(Boolean);
              const trustedProxies = proxiesRaw.split(",").map((s) => s.trim()).filter(Boolean);
              const paths = [
                "/home/node/.openclaw/openclaw.json",
                "/home/node/.openclaw/.openclaw/openclaw.json",
              ];
              for (const p of paths) {
                const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
                cfg.gateway = cfg.gateway || {};
                cfg.gateway.controlUi = cfg.gateway.controlUi || {};
                if (origins.length) {
                  cfg.gateway.controlUi.allowedOrigins = origins;
                  cfg.gateway.controlUi.dangerouslyAllowHostHeaderOriginFallback = false;
                } else {
                  cfg.gateway.controlUi.dangerouslyAllowHostHeaderOriginFallback = true;
                }
                if (trustedProxies.length) {
                  cfg.gateway.trustedProxies = trustedProxies;
                }
                fs.writeFileSync(p, JSON.stringify(cfg, null, 2));
              }
              '
          env:
            - name: OPENCLAW_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENCLAW_ALLOWED_ORIGINS
            - name: OPENCLAW_TRUSTED_PROXIES
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENCLAW_TRUSTED_PROXIES
                  optional: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: config
              mountPath: /config
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:2026.4.23
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /app/dist/index.js
            - gateway
            - run
            - --allow-unconfigured
            - --bind
            - lan
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
          envFrom:
            - secretRef:
                name: openclaw-secrets
          env:
            - name: HOME
              value: /home/node
            - name: OPENCLAW_HOME
              value: /home/node/.openclaw
            - name: OPENCLAW_CONFIG_DIR
              value: /home/node/.openclaw/.openclaw
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
            - name: npm_config_cache
              value: /tmp/.npm
            - name: NODE_ENV
              value: production
            - name: KUBERNETES_IN_CLUSTER
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - require('http').get('http://127.0.0.1:18789/healthz',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - require('http').get('http://127.0.0.1:18789/readyz',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: workspace
              mountPath: /home/node/workspace
            - name: tmp-volume
              mountPath: /tmp
            - name: npm-cache
              mountPath: /home/node/.npm
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-data
        - name: workspace
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
        - name: npm-cache
          emptyDir: {}
        - name: config
          configMap:
            name: openclaw-config
