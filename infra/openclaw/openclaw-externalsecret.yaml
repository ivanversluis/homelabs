apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-secrets
  namespace: openclaw
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openclaw-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: infra/openclaw
        property: OPENROUTER_API_KEY
    - secretKey: AZURE_API_KEY
      remoteRef:
        key: infra/openclaw
        property: AZURE_API_KEY
    - secretKey: AZURE_RESOURCE_NAME
      remoteRef:
        key: infra/openclaw
        property: AZURE_RESOURCE_NAME
    - secretKey: OPENCLAW_ALLOWED_ORIGINS
      remoteRef:
        key: infra/openclaw
        property: OPENCLAW_ALLOWED_ORIGINS
    - secretKey: OPENCLAW_TRUSTED_PROXIES
      remoteRef:
        key: infra/openclaw
        property: OPENCLAW_TRUSTED_PROXIES
    - secretKey: OPENCLAW_GATEWAY_TOKEN
      remoteRef:
        key: infra/openclaw
        property: OPENCLAW_GATEWAY_TOKEN
    - secretKey: DISCORD_TOKEN
      remoteRef:
        key: infra/openclaw
        property: DISCORD_TOKEN
    - secretKey: DISCORD_USER_ID
      remoteRef:
        key: infra/openclaw
        property: DISCORD_USER_ID
    - secretKey: DISCORD_GUILD_ID
      remoteRef:
        key: infra/openclaw
        property: DISCORD_GUILD_ID
