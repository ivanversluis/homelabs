apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-secrets
  namespace: openclaw
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openclaw-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: infra/openclaw
        property: OPENROUTER_API_KEY
    - secretKey: OPENCLAW_GATEWAY_TOKEN
      remoteRef:
        key: infra/openclaw
        property: OPENCLAW_GATEWAY_TOKEN
    - secretKey: DISCORD_TOKEN
      remoteRef:
        key: infra/openclaw
        property: DISCORD_TOKEN
