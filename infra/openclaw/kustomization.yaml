apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openclaw
resources:
  - openclaw-namespace.yaml
  - openclaw-netpol.yaml
  - openclaw-kong-netpol.yaml
  - openclaw-pvc.yaml
  - openclaw-serviceaccount.yaml
  - openclaw-clusterrole.yaml
  - openclaw-clusterrolebinding.yaml
  - openclaw-externalsecret.yaml
  - openclaw-configmap.yaml
  - openclaw-k8s-monitor-cronjob.yaml
  - openclaw-deployment.yaml
  - openclaw-service.yaml

# Generate the runtime config with Kustomize's content hash. The Deployment
# references this ConfigMap by name, so any Git config change updates the Pod
# template reference and triggers a deterministic rollout. The init container
# then renders the template into the read-only runtime emptyDir.
configMapGenerator:
  - name: openclaw-runtime-config
    files:
      - openclaw.json.template=openclaw.json.template
  # Versioned code and instructions, separate from the historical skip ConfigMap.
  - name: openclaw-k8s-diagnostics
    files:
      - k8s-query.js=k8s-query.js
      - SKILL.md=skills/kubernetes-diagnostics/SKILL.md
      - AGENTS.md=AGENTS.md
      - sync-agents.js=sync-agents.js

patches:
  - path: openclaw-gitops-config-patch.yaml
  - path: openclaw-state-migration-patch.yaml
  # openclaw-config keeps AGENTS.md and k8s-monitor.js. Its historical
  # openclaw.json is deliberately removed from the rendered object so there is
  # exactly one active Git-owned runtime config source.
  - target:
      kind: ConfigMap
      name: openclaw-config
    patch: |-
      - op: remove
        path: /data/openclaw.json
