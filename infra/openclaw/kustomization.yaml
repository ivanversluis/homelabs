apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - openclaw-namespace.yaml
  - openclaw-netpol.yaml
  - openclaw-kong-netpol.yaml
  - openclaw-pvc.yaml
  - openclaw-serviceaccount.yaml
  - openclaw-clusterrole.yaml
  - openclaw-clusterrolebinding.yaml
  - openclaw-externalsecret.yaml
  - openclaw-configmap.yaml
  - openclaw-runtime-config.yaml
  - openclaw-k8s-monitor-cronjob.yaml
  - openclaw-deployment.yaml
  - openclaw-service.yaml

patches:
  - path: openclaw-gitops-config-patch.yaml
  # openclaw-config keeps AGENTS.md and k8s-monitor.js. Its historical
  # openclaw.json is deliberately removed from the rendered object so there is
  # exactly one active Git-owned runtime config source.
  - target:
      kind: ConfigMap
      name: openclaw-config
    patch: |-
      - op: remove
        path: /data/openclaw.json
