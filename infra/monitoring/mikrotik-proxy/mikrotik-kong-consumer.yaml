# KongConsumer: gatus
# Represents the Gatus monitoring pod as a Kong consumer for key-auth.
# The credential reference is added after the Vault secret is populated and
# ESO has created the mikrotik-proxy-key-auth Secret (see mikrotik-secrets.md-local).
# To add credentials after Vault setup, update this file to uncomment credentials
# or patch: kubectl patch kongconsumer gatus -n monitoring --type merge \
#   -p '{"credentials":["mikrotik-proxy-key-auth"]}'
apiVersion: configuration.konghq.com/v1
kind: KongConsumer
metadata:
  name: gatus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mikrotik-proxy
  annotations:
    kubernetes.io/ingress.class: kong
username: gatus
# credentials populated after ESO syncs mikrotik-proxy-key-auth from Vault:
# credentials:
#   - mikrotik-proxy-key-auth
