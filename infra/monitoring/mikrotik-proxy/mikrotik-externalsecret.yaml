# ExternalSecret: mikrotik-api-creds
# Reads RouterOS API username + password from Vault and materialises a Kubernetes
# Secret whose sole key ("config") contains the full request-transformer plugin
# config JSON. Kong reads this via KongPlugin.configFrom, so the Base64-encoded
# Basic Auth header never appears in the repository.
#
# Vault path: secret/networking/mikrotik
#   Properties: api_username, api_password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mikrotik-api-creds
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mikrotik-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mikrotik-request-transformer-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Kong request-transformer plugin config in JSON.
        # Adds a Basic Auth header to every upstream (RouterOS) request and
        # strips the apikey credential so it is not forwarded to the router.
        config: '{"add":{"headers":["Authorization:Basic {{ printf "%s:%s" .username .password | b64enc }}"]},"remove":{"headers":["apikey"]}}'
  data:
    - secretKey: username
      remoteRef:
        key: networking/mikrotik
        property: api_username
    - secretKey: password
      remoteRef:
        key: networking/mikrotik
        property: api_password
---
# ExternalSecret: mikrotik-proxy-key-auth
# Reads the Kong key-auth credential from Vault and materialises a Kubernetes
# Secret with the label konghq.com/credential: key-auth so the Kong Ingress
# Controller recognises it as a key-auth credential for the gatus KongConsumer.
#
# Vault path: secret/networking/mikrotik
#   Property: proxy_api_key   (random 32-byte hex — see mikrotik-secrets.md-local)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mikrotik-proxy-key-auth
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mikrotik-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mikrotik-proxy-key-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          konghq.com/credential: key-auth
      data:
        key: "{{ .proxy_api_key }}"
  data:
    - secretKey: proxy_api_key
      remoteRef:
        key: networking/mikrotik
        property: proxy_api_key
