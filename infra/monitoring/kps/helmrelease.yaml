apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 15m

  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.*"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 12h

  install:
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3
    cleanupOnFail: true

  values:
    # Don't need this as already deployed with ArgoCD apps for now
    grafana:
      enabled: false

    # Operator
    prometheusOperator:
      nodeSelector:
        kubernetes.io/hostname: k8s-master01
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      resources:
        requests:
          cpu: 50m
          memory: 256Mi

    # Kubernetes object state metrics
    kubeStateMetrics:
      enabled: true

    kube-state-metrics:
      nodeSelector:
        kubernetes.io/hostname: k8s-master01
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

    # Node metrics exporter (DaemonSet; runs on all my homelab nodes)
    nodeExporter:
      enabled: true

    # Prometheus server
    prometheus:
      prometheusSpec:
        retention: 7d

        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false

        nodeSelector:
          kubernetes.io/hostname: k8s-master01
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"

        # No persistence 
        storageSpec: {}

        resources:
          requests:
            cpu: 200m
            memory: 1Gi

    # Alertmanager
    alertmanager:
      enabled: true
      alertmanagerSpec:
        nodeSelector:
          kubernetes.io/hostname: k8s-master01
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi