apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/name: gatus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gatus-secrets
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: infra/gatus
        property: DISCORD_WEBHOOK_URL
    - secretKey: PORTAINER_MONITOR_TOKEN
      remoteRef:
        key: infra/gatus
        property: PORTAINER_MONITOR_TOKEN
    - secretKey: GITLAB_MONITOR_TOKEN
      remoteRef:
        key: infra/gatus
        property: GITLAB_MONITOR_TOKEN
