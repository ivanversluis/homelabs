# ExternalSecret: gatus-mikrotik-key
# Syncs the Kong route API key from Vault into gatus-secrets so Gatus can
# pass it as the apikey header when calling the Kong /mikrotik route.
#
# This is a SEPARATE ExternalSecret from gatus-secrets to isolate the
# networking/mikrotik Vault path. If the Vault secret is not yet populated,
# only this ExternalSecret fails — the main gatus-secrets (Discord, Portainer,
# GitLab tokens) continue to sync normally.
#
# Prerequisites: Vault path secret/networking/mikrotik must be populated.
# See infra/monitoring/mikrotik-proxy/mikrotik-secrets.md-local
#
# Target: merges MIKROTIK_PROXY_KEY into the existing gatus-secrets Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-mikrotik-key
  namespace: monitoring
  labels:
    app.kubernetes.io/name: gatus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gatus-secrets
    creationPolicy: Merge
  data:
    - secretKey: MIKROTIK_PROXY_KEY
      remoteRef:
        key: networking/mikrotik
        property: proxy_api_key
