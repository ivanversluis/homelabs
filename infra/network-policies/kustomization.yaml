# Zero Trust network policies for k8s-homelab.
#
# Per-namespace policies are co-located with their owning component.
# This directory only contains:
#   - global/               cluster-wide default-deny baseline
#   - flux-system-netpol    Flux CD controllers (no dedicated component dir)
#
# All other policies live alongside their component manifests:
#   apps/<name>/<name>-netpol.yaml
#   infra/<name>/<name>-netpol.yaml
#   services/<path>/<name>-netpol.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - global/
  - flux-system-netpol.yaml
