apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelabs-repo
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: homelabs-repo
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: "{{ .url }}"
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: url
      remoteRef:
        key: infra/argocd
        property: REPO_URL
    - secretKey: username
      remoteRef:
        key: infra/argocd
        property: REPO_USERNAME
    - secretKey: password
      remoteRef:
        key: infra/argocd
        property: REPO_PASSWORD
