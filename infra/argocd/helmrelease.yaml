apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 30m
  chart:
    spec:
      chart: argo-cd
      version: "9.5.22"
      sourceRef:
        kind: HelmRepository
        name: argo
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 5
  values:
    crds:
      install: true
      keep: false
    global:
      domain: demo-argocd.${DOMAIN}
    configs:
      cm:
        exec.enabled: "true"
        url: "https://demo-argocd.${DOMAIN}"
        oidc.config: |
          name: Authentik
          issuer: https://auth.${DOMAIN}/application/o/argocd/
          clientID: $argocd-oidc:client-id
          clientSecret: $argocd-oidc:client-secret
          requestedScopes:
            - openid
            - profile
            - email
            - groups
      params:
        server.insecure: "true"
      rbac:
        policy.csv: |
          p, role:admin, *, *, */*, allow
          p, role:readonly, applications, get, */*, allow
          p, role:readonly, logs, get, */*, allow
          g, ArgoCD Admins, role:admin
          g, ArgoCD Viewers, role:readonly
        policy.default: role:readonly
        scopes: '[groups]'
    server:
      service:
        type: ClusterIP
      metrics:
        enabled: true
    controller:
      metrics:
        enabled: true
    repoServer:
      metrics:
        enabled: true
    applicationSet:
      enabled: true
      metrics:
        enabled: true
    notifications:
      enabled: true
      metrics:
        enabled: true
