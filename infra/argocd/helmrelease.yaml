apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 30m
  chart:
    spec:
      chart: argo-cd
      version: "7.7.16"
      sourceRef:
        kind: HelmRepository
        name: argo
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 5
  values:
    crds:
      install: true
      keep: false
    global:
      domain: argocd.local
    configs:
      cm:
        exec.enabled: "true"
      rbac:
        policy.csv: |
          p, role:admin, exec, create, */*, allow
    server:
      service:
        type: ClusterIP
      metrics:
        enabled: true
    controller:
      metrics:
        enabled: true
    repoServer:
      metrics:
        enabled: true
    applicationSet:
      enabled: true
      metrics:
        enabled: true
    notifications:
      enabled: true
      metrics:
        enabled: true
