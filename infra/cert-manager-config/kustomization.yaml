apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # These resources require the cert-manager webhook to be running.
  # Applied only after the cert-manager HelmRelease is Ready (enforced
  # via dependsOn + healthChecks in cert-manager-config-kustomization.yaml).
  - cert-manager-cloudflare-api-token-externalsecret.yaml
  - cert-manager-clusterissuer-letsencrypt.yaml
