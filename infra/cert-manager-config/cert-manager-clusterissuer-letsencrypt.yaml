# ClusterIssuer: Let's Encrypt production via DNS-01 / Cloudflare.
# Uses the token fetched by the ExternalSecret above.
# DNS-01 means the service does NOT need to be publicly reachable —
# cert-manager writes a TXT record to Cloudflare to prove domain ownership.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - ${DOMAIN}
---
# ClusterIssuer: Let's Encrypt staging — use this first to avoid rate-limits
# while testing. Swap to letsencrypt-prod once verified.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - ${DOMAIN}
