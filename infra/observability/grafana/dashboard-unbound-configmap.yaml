apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-unbound
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    grafana_dashboard: "true"
data:
  unbound.json: |
    {
      "title": "Unbound Recursive Resolver",
      "uid": "unbound-resolver",
      "tags": ["dns", "unbound"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "type": "stat",
          "title": "Queries/s",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "sum(rate(unbound_queries_total[5m]))", "refId": "A"}],
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "type": "stat",
          "title": "Cache Hit Ratio",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "sum(rate(unbound_cache_hits_total[5m])) / (sum(rate(unbound_cache_hits_total[5m])) + sum(rate(unbound_cache_misses_total[5m]))) * 100", "refId": "A"}],
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [{"value": 0, "color": "red"}, {"value": 50, "color": "yellow"}, {"value": 80, "color": "green"}]}}}
        },
        {
          "type": "stat",
          "title": "SERVFAIL Rate",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "sum(rate(unbound_answer_rcode_total{rcode=\"SERVFAIL\"}[5m]))", "refId": "A"}],
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "fieldConfig": {"defaults": {"unit": "reqps", "thresholds": {"steps": [{"value": 0, "color": "green"}, {"value": 0.5, "color": "yellow"}, {"value": 2, "color": "red"}]}}}
        },
        {
          "type": "stat",
          "title": "Avg Recursion Time",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "rate(unbound_recursion_time_seconds_total[5m]) / rate(unbound_queries_total[5m])", "refId": "A"}],
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"steps": [{"value": 0, "color": "green"}, {"value": 0.5, "color": "yellow"}, {"value": 2, "color": "red"}]}}}
        },
        {
          "type": "timeseries",
          "title": "Query Rate",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "sum(rate(unbound_queries_total[5m]))", "legendFormat": "total queries", "refId": "A"},
            {"expr": "sum(rate(unbound_cache_hits_total[5m]))", "legendFormat": "cache hits", "refId": "B"}
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "type": "timeseries",
          "title": "Response Codes",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "sum(rate(unbound_answer_rcode_total[5m])) by (rcode)", "legendFormat": "{{rcode}}", "refId": "A"}],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "type": "timeseries",
          "title": "Recursion Time",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "rate(unbound_recursion_time_seconds_total[5m]) / rate(unbound_queries_total[5m])", "legendFormat": "avg recursion", "refId": "A"}
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "fieldConfig": {"defaults": {"unit": "s"}}
        },
        {
          "type": "timeseries",
          "title": "Cache Size",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "unbound_msg_cache_count", "legendFormat": "msg cache", "refId": "A"},
            {"expr": "unbound_rrset_cache_count", "legendFormat": "rrset cache", "refId": "B"}
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "type": "timeseries",
          "title": "Upstream Latency (DoT)",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "histogram_quantile(0.99, rate(unbound_response_time_seconds_bucket[5m]))", "legendFormat": "p99", "refId": "A"}],
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 20},
          "fieldConfig": {"defaults": {"unit": "s"}}
        }
      ]
    }
