apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-shelly
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    grafana_dashboard: "true"
data:
  shelly-devices.json: |
    {
      "title": "Shelly Devices",
      "uid": "shelly-devices",
      "tags": ["home", "climate", "shelly"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "device_id",
            "label": "Device",
            "type": "query",
            "datasource": {"uid": "prometheus"},
            "query": "label_values(shelly_device_info, device_id)",
            "multi": true,
            "includeAll": true,
            "current": {"text": "All", "value": "$__all"},
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "type": "table",
          "title": "Devices",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "shelly_device_info{device_id=~\"$device_id\"}", "format": "table", "instant": true, "refId": "A"}],
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 0},
          "transformations": [
            {"id": "organize", "options": {
              "excludeByName": {"Time": true, "Value": true, "__name__": true, "app": true, "instance": true, "job": true, "service": true},
              "renameByName": {"device_id": "Device ID", "code": "Model", "gen": "Generation"}
            }}
          ]
        },
        {
          "type": "stat",
          "title": "Devices Total",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "shelly_devices_total", "refId": "A"}],
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 6},
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "type": "stat",
          "title": "Devices Online",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "sum(shelly_device_online)", "refId": "A"}],
          "gridPos": {"h": 4, "w": 4, "x": 4, "y": 6},
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "type": "stat",
          "title": "Exporter Up",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "shelly_up", "refId": "A"}],
          "gridPos": {"h": 4, "w": 4, "x": 8, "y": 6},
          "options": {"colorMode": "background", "graphMode": "none", "textMode": "value"},
          "fieldConfig": {"defaults": {
            "unit": "short",
            "mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}],
            "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}
          }}
        },
        {
          "type": "stat",
          "title": "Scrape Errors (24h)",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "increase(shelly_scrape_errors_total[1d])", "refId": "A"}],
          "gridPos": {"h": 4, "w": 4, "x": 12, "y": 6},
          "options": {"colorMode": "background", "graphMode": "none", "textMode": "value"},
          "fieldConfig": {"defaults": {
            "unit": "short",
            "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}
          }}
        },
        {
          "type": "stat",
          "title": "Last Success",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "shelly_last_scrape_success_timestamp * 1000", "refId": "A"}],
          "gridPos": {"h": 4, "w": 4, "x": 16, "y": 6},
          "fieldConfig": {"defaults": {"unit": "dateTimeAsIso"}}
        },
        {
          "type": "stat",
          "title": "Time Since Last Success",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "time() - shelly_last_scrape_success_timestamp", "refId": "A"}],
          "gridPos": {"h": 4, "w": 4, "x": 20, "y": 6},
          "options": {"colorMode": "background", "graphMode": "none", "textMode": "value"},
          "fieldConfig": {"defaults": {
            "unit": "s",
            "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 90}]}
          }}
        },
        {
          "type": "timeseries",
          "title": "Temperature",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "shelly_temperature_celsius{device_id=~\"$device_id\"}", "legendFormat": "{{device_id}}/{{channel}}", "refId": "A"}
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 10},
          "fieldConfig": {"defaults": {"unit": "celsius"}}
        },
        {
          "type": "timeseries",
          "title": "Humidity",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "shelly_humidity_percent{device_id=~\"$device_id\"}", "legendFormat": "{{device_id}}/{{channel}}", "refId": "A"}
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 10},
          "fieldConfig": {"defaults": {"unit": "percent"}}
        },
        {
          "type": "gauge",
          "title": "Battery",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "shelly_battery_percent{device_id=~\"$device_id\"}", "legendFormat": "{{device_id}}", "refId": "A"}
          ],
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 18},
          "fieldConfig": {"defaults": {
            "unit": "percent", "min": 0, "max": 100,
            "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 20}, {"color": "green", "value": 50}]}
          }}
        },
        {
          "type": "timeseries",
          "title": "Wi-Fi Signal",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "shelly_wifi_rssi_dbm{device_id=~\"$device_id\"}", "legendFormat": "{{device_id}}", "refId": "A"}
          ],
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 18},
          "fieldConfig": {"defaults": {
            "unit": "dBm",
            "custom": {"thresholdsStyle": {"mode": "line"}},
            "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": -80}, {"color": "green", "value": -70}]}
          }}
        }
      ]
    }
