apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-coredns
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    grafana_dashboard: "true"
data:
  coredns.json: |
    {
      "title": "CoreDNS Health",
      "uid": "coredns-health",
      "tags": ["dns", "coredns"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "type": "stat",
          "title": "Request Rate",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "sum(rate(coredns_dns_requests_total[5m]))", "refId": "A"}],
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "type": "stat",
          "title": "Cache Hit Ratio",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "sum(rate(coredns_cache_hits_total[5m])) / (sum(rate(coredns_cache_hits_total[5m])) + sum(rate(coredns_cache_misses_total[5m]))) * 100", "refId": "A"}],
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [{"value": 0, "color": "red"}, {"value": 50, "color": "yellow"}, {"value": 80, "color": "green"}]}}}
        },
        {
          "type": "stat",
          "title": "SERVFAIL Rate",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "sum(rate(coredns_dns_responses_total{rcode=\"SERVFAIL\"}[5m]))", "refId": "A"}],
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "fieldConfig": {"defaults": {"unit": "reqps", "thresholds": {"steps": [{"value": 0, "color": "green"}, {"value": 1, "color": "yellow"}, {"value": 5, "color": "red"}]}}}
        },
        {
          "type": "stat",
          "title": "P99 Latency",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "histogram_quantile(0.99, sum(rate(coredns_dns_request_duration_seconds_bucket[5m])) by (le))", "refId": "A"}],
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"steps": [{"value": 0, "color": "green"}, {"value": 0.1, "color": "yellow"}, {"value": 0.5, "color": "red"}]}}}
        },
        {
          "type": "timeseries",
          "title": "Requests by Type",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "sum(rate(coredns_dns_requests_total[5m])) by (type)", "legendFormat": "{{type}}", "refId": "A"}],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "type": "timeseries",
          "title": "Responses by Rcode",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "sum(rate(coredns_dns_responses_total[5m])) by (rcode)", "legendFormat": "{{rcode}}", "refId": "A"}],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "type": "timeseries",
          "title": "Latency Percentiles",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "histogram_quantile(0.50, sum(rate(coredns_dns_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p50", "refId": "A"},
            {"expr": "histogram_quantile(0.90, sum(rate(coredns_dns_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p90", "refId": "B"},
            {"expr": "histogram_quantile(0.99, sum(rate(coredns_dns_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p99", "refId": "C"}
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "fieldConfig": {"defaults": {"unit": "s"}}
        },
        {
          "type": "timeseries",
          "title": "Cache Performance",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "sum(rate(coredns_cache_hits_total[5m])) by (type)", "legendFormat": "hits ({{type}})", "refId": "A"},
            {"expr": "sum(rate(coredns_cache_misses_total[5m]))", "legendFormat": "misses", "refId": "B"}
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "fieldConfig": {"defaults": {"unit": "ops"}}
        },
        {
          "type": "timeseries",
          "title": "Forward Requests",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "sum(rate(coredns_forward_requests_total[5m])) by (to)", "legendFormat": "{{to}}", "refId": "A"}],
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 20},
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        }
      ]
    }
