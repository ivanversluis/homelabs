apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
data:
  grafana.ini: |
    [server]
    root_url = %(protocol)s://%(domain)s/

    [security]
    admin_user = admin
    # Admin password is set via GF_SECURITY_ADMIN_PASSWORD env var

    [users]
    allow_sign_up = false

    [auth.anonymous]
    enabled = false

    [dashboards]
    default_home_dashboard_path = /etc/grafana/provisioning/dashboards/fm-golden-signals.json

    [analytics]
    reporting_enabled = false
    check_for_updates = false

    [log]
    mode = console
    level = info

    [alerting]
    enabled = false

    [unified_alerting]
    enabled = true
