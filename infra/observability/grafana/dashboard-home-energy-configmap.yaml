          "targets": [
            {"expr": "goodwe_ac_frequency_hz", "legendFormat": "{{inverter}}", "refId": "A"}
          ],
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 12},
          "fieldConfig": {"defaults": {"unit": "hertz"}}
        },
        {
          "type": "timeseries",
          "title": "DC String Voltage",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "goodwe_dc_voltage_volts", "legendFormat": "{{inverter}} string {{string}}", "refId": "A"}
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
