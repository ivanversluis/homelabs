apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-home-energy
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    grafana_dashboard: "true"
data:
  home-energy.json: |
    {
      "title": "Home Energy",
      "uid": "home-energy",
      "tags": ["home", "energy", "goodwe", "solar"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "type": "stat",
          "title": "PV Power",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "goodwe_power_watts", "refId": "A"}],
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"unit": "watt"}}
        },
        {
          "type": "stat",
          "title": "Total Generation",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "goodwe_total_generation_kwh", "refId": "A"}],
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "fieldConfig": {"defaults": {"unit": "kwatth"}}
        },
        {
          "type": "stat",
          "title": "Inverter Temp",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "goodwe_temperature_celsius", "refId": "A"}],
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "fieldConfig": {"defaults": {"unit": "celsius"}}
        },
        {
          "type": "stat",
          "title": "Exporter Up",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "goodwe_up", "refId": "A"}],
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "fieldConfig": {
            "defaults": {"unit": "short"},
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Value"},
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}}},
                      {"type": "value", "options": {"1": {"text": "UP", "color": "green"}}}
                    ]
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "timeseries",
          "title": "PV Power",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "goodwe_power_watts", "legendFormat": "{{inverter}}", "refId": "A"}
          ],
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 4},
          "fieldConfig": {"defaults": {"unit": "watt"}}
        },
        {
          "type": "timeseries",
          "title": "AC Voltage",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "goodwe_ac_voltage_volts", "legendFormat": "{{inverter}}", "refId": "A"}
          ],
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 12},
          "fieldConfig": {"defaults": {"unit": "volt"}}
        },
        {
          "type": "timeseries",
          "title": "AC Current",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "goodwe_ac_current_amps", "legendFormat": "{{inverter}}", "refId": "A"}
          ],
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 12},
          "fieldConfig": {"defaults": {"unit": "amp"}}
        },
        {
          "type": "timeseries",
          "title": "AC Frequency",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "goodwe_ac_frequency_hz", "legendFormat": "{{inverter}}", "refId": "A"}
          ],
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 12},
          "fieldConfig": {"defaults": {"unit": "hertz"}}
        },
        {
          "type": "timeseries",
          "title": "DC String Voltage",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "goodwe_dc_voltage_volts", "legendFormat": "{{inverter}} string {{string}}", "refId": "A"}
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "fieldConfig": {"defaults": {"unit": "volt"}}
        },
        {
          "type": "timeseries",
          "title": "DC String Current",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "goodwe_dc_current_amps", "legendFormat": "{{inverter}} string {{string}}", "refId": "A"}
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "fieldConfig": {"defaults": {"unit": "amp"}}
        },
        {
          "type": "timeseries",
          "title": "Inverter Temperature",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "goodwe_temperature_celsius", "legendFormat": "{{inverter}}", "refId": "A"}
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 28},
          "fieldConfig": {"defaults": {"unit": "celsius"}}
        },
        {
          "type": "timeseries",
          "title": "RSSI",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "goodwe_rssi_dbm", "legendFormat": "{{inverter}}", "refId": "A"}
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 28},
          "fieldConfig": {"defaults": {"unit": "dBm"}}
        },
        {
          "type": "stat",
          "title": "Scrape Errors",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "goodwe_scrape_errors_total", "refId": "A"}],
          "gridPos": {"h": 4, "w": 8, "x": 0, "y": 36},
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "type": "stat",
          "title": "Last Scrape",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "goodwe_last_scrape_timestamp", "refId": "A"}],
          "gridPos": {"h": 4, "w": 8, "x": 8, "y": 36},
          "fieldConfig": {"defaults": {"unit": "dateTimeAsIso"}}
        },
        {
          "type": "stat",
          "title": "Last Successful Scrape",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "goodwe_last_scrape_success_timestamp", "refId": "A"}],
          "gridPos": {"h": 4, "w": 8, "x": 16, "y": 36},
          "fieldConfig": {"defaults": {"unit": "dateTimeAsIso"}}
        }
      ]
    }
