apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-contact-points
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: alerting
data:
  contact-points.yaml: |
    apiVersion: 1

    contactPoints:
      - orgId: 1
        name: discord-primary
        receivers:
          - uid: discord-primary
            type: discord
            settings:
              url: $GRAFANA_DISCORD_WEBHOOK_URL
              title: "[Homelab] {{ .CommonLabels.alertname }}"
              message: "{{ template \"default.message\" . }}"
