apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: visualization
    spec:
      nodeSelector:
        node.longhorn.io/create-default-disk: "true"
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:10.2.2
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
                  optional: true
            - name: GF_INSTALL_PLUGINS
              value: ""
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
              readOnly: true
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards/default.yaml
              subPath: default.yaml
              readOnly: true
            - name: dashboard-overview
              mountPath: /etc/grafana/provisioning/dashboards/firewall-manager-overview.json
              subPath: firewall-manager-overview.json
              readOnly: true
            - name: dashboard-golden-signals
              mountPath: /etc/grafana/provisioning/dashboards/fm-golden-signals.json
              subPath: fm-golden-signals.json
              readOnly: true
            - name: dashboard-red-method
              mountPath: /etc/grafana/provisioning/dashboards/fm-red-method.json
              subPath: fm-red-method.json
              readOnly: true
            - name: dashboard-use-method
              mountPath: /etc/grafana/provisioning/dashboards/fm-use-method.json
              subPath: fm-use-method.json
              readOnly: true
            - name: dashboard-hashicorp-vault
              mountPath: /etc/grafana/provisioning/dashboards/hashicorp-vault.json
              subPath: hashicorp-vault.json
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: grafana-config
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-overview
          configMap:
            name: grafana-dashboard-overview
        - name: dashboard-golden-signals
          configMap:
            name: grafana-dashboard-golden-signals
        - name: dashboard-red-method
          configMap:
            name: grafana-dashboard-red-method
        - name: dashboard-use-method
          configMap:
            name: grafana-dashboard-use-method
        - name: dashboard-hashicorp-vault
          configMap:
            name: grafana-dashboard-hashicorp-vault
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
