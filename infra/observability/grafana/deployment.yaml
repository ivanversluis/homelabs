apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: visualization
    spec:
      nodeSelector:
        node.longhorn.io/create-default-disk: "true"
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.0.1
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
                  optional: true
            - name: GRAFANA_DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-alerting-secrets
                  key: DISCORD_WEBHOOK_URL
            - name: GF_SERVER_ROOT_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-alerting-secrets
                  key: GRAFANA_PUBLIC_URL
            - name: GF_INSTALL_PLUGINS
              value: ""
            # OIDC via Authentik
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: "authentik"
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: "openid profile email"
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: "https://auth.${DOMAIN}/application/o/authorize/"
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: "https://auth.${DOMAIN}/application/o/token/"
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: "https://auth.${DOMAIN}/application/o/userinfo/"
            - name: GF_AUTH_SIGNOUT_REDIRECT_URL
              value: "https://auth.${DOMAIN}/application/o/grafana/end-session/"
            - name: GF_AUTH_OAUTH_AUTO_LOGIN
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: "contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'"
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc
                  key: client-id
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc
                  key: client-secret
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
              readOnly: true
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards/default.yaml
              subPath: default.yaml
              readOnly: true
            - name: alerting-contact-points
              mountPath: /etc/grafana/provisioning/alerting/contact-points.yaml
              subPath: contact-points.yaml
              readOnly: true
            - name: alerting-notification-policies
              mountPath: /etc/grafana/provisioning/alerting/notification-policies.yaml
              subPath: notification-policies.yaml
              readOnly: true
            - name: alerting-rules-time-sync
              mountPath: /etc/grafana/provisioning/alerting/rules-time-sync.yaml
              subPath: rules-time-sync.yaml
              readOnly: true
            - name: dashboard-overview
              mountPath: /etc/grafana/provisioning/dashboards/firewall-manager-overview.json
              subPath: firewall-manager-overview.json
              readOnly: true
            - name: dashboard-golden-signals
              mountPath: /etc/grafana/provisioning/dashboards/fm-golden-signals.json
              subPath: fm-golden-signals.json
              readOnly: true
            - name: dashboard-red-method
              mountPath: /etc/grafana/provisioning/dashboards/fm-red-method.json
              subPath: fm-red-method.json
              readOnly: true
            - name: dashboard-use-method
              mountPath: /etc/grafana/provisioning/dashboards/fm-use-method.json
              subPath: fm-use-method.json
              readOnly: true
            - name: dashboard-hashicorp-vault
              mountPath: /etc/grafana/provisioning/dashboards/hashicorp-vault.json
              subPath: hashicorp-vault.json
              readOnly: true
            - name: dashboard-kubernetes-platform
              mountPath: /etc/grafana/provisioning/dashboards/kubernetes-platform-overview.json
              subPath: kubernetes-platform-overview.json
              readOnly: true
            - name: dashboard-kubernetes-nodes
              mountPath: /etc/grafana/provisioning/dashboards/kubernetes-node-health.json
              subPath: kubernetes-node-health.json
              readOnly: true
            - name: dashboard-kubernetes-time-sync
              mountPath: /etc/grafana/provisioning/dashboards/kubernetes-time-sync.json
              subPath: kubernetes-time-sync.json
              readOnly: true
            - name: dashboard-dns-overview
              mountPath: /etc/grafana/provisioning/dashboards/dns-overview.json
              subPath: dns-overview.json
              readOnly: true
            - name: dashboard-coredns
              mountPath: /etc/grafana/provisioning/dashboards/coredns.json
              subPath: coredns.json
              readOnly: true
            - name: dashboard-pihole
              mountPath: /etc/grafana/provisioning/dashboards/pihole.json
              subPath: pihole.json
              readOnly: true
            - name: dashboard-unbound
              mountPath: /etc/grafana/provisioning/dashboards/unbound.json
              subPath: unbound.json
              readOnly: true
            - name: dashboard-pihole-client
              mountPath: /etc/grafana/provisioning/dashboards/pihole-client.json
              subPath: pihole-client.json
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: grafana-config
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: alerting-contact-points
          configMap:
            name: grafana-alerting-contact-points
        - name: alerting-notification-policies
          configMap:
            name: grafana-alerting-notification-policies
        - name: alerting-rules-time-sync
          configMap:
            name: grafana-alerting-rules-time-sync
        - name: dashboard-overview
          configMap:
            name: grafana-dashboard-overview
        - name: dashboard-golden-signals
          configMap:
            name: grafana-dashboard-golden-signals
        - name: dashboard-red-method
          configMap:
            name: grafana-dashboard-red-method
        - name: dashboard-use-method
          configMap:
            name: grafana-dashboard-use-method
        - name: dashboard-hashicorp-vault
          configMap:
            name: grafana-dashboard-hashicorp-vault
        - name: dashboard-kubernetes-platform
          configMap:
            name: grafana-dashboard-kubernetes-platform
        - name: dashboard-kubernetes-nodes
          configMap:
            name: grafana-dashboard-kubernetes-nodes
        - name: dashboard-kubernetes-time-sync
          configMap:
            name: grafana-dashboard-kubernetes-time-sync
        - name: dashboard-dns-overview
          configMap:
            name: grafana-dashboard-dns-overview
        - name: dashboard-coredns
          configMap:
            name: grafana-dashboard-coredns
        - name: dashboard-pihole
          configMap:
            name: grafana-dashboard-pihole
        - name: dashboard-unbound
          configMap:
            name: grafana-dashboard-unbound
        - name: dashboard-pihole-client
          configMap:
            name: grafana-dashboard-pihole-client
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
