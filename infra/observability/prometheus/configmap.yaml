apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'firewall-manager'
        cluster: 'microk8s'

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    rule_files:
      - "/etc/prometheus/alerts/*.yml"

    scrape_configs:
      # Scrape FM API service
      - job_name: 'fm-api'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - firewall-manager-dev
                - firewall-manager-staging
                - firewall-manager-prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: fm-api
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metrics_path: '/metrics'
        scrape_interval: 15s
        scrape_timeout: 10s

      # Scrape FM WebUI service
      - job_name: 'fm-webui'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - firewall-manager-dev
                - firewall-manager-staging
                - firewall-manager-prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: fm-webui
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metrics_path: '/metrics'
        scrape_interval: 15s
        scrape_timeout: 10s

      # Scrape FM Worker service
      - job_name: 'fm-worker'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - firewall-manager-dev
                - firewall-manager-staging
                - firewall-manager-prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: fm-worker
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metrics_path: '/metrics'
        scrape_interval: 15s
        scrape_timeout: 10s

      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
            labels:
              service: 'prometheus'
              app: 'monitoring'

      # Loki metrics
      - job_name: 'loki'
        static_configs:
          - targets: ['loki:3100']
            labels:
              service: 'loki'
              app: 'monitoring'

      # HashiCorp Vault metrics (in-cluster service)
      - job_name: 'vault'
        scheme: http
        metrics_path: '/v1/sys/metrics'
        params:
          format: ['prometheus']
        authorization:
          credentials_file: /etc/prometheus/secrets/vault-prometheus-token/token
        static_configs:
          - targets: ['vault.vault.svc.cluster.local:8200']
            labels:
              service: 'vault'
              app: 'hashicorp-vault'
        scrape_interval: 30s
        scrape_timeout: 15s
