apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'firewall-manager'
        cluster: 'microk8s'

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    rule_files:
      - "/etc/prometheus/alerts/*.yml"

    scrape_configs:
      # Scrape FM API service
      - job_name: 'fm-api'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - firewall-manager-dev
                - firewall-manager-staging
                - firewall-manager-prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: fm-api
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metrics_path: '/metrics'
        scrape_interval: 15s
        scrape_timeout: 10s

      # Scrape FM WebUI service
      - job_name: 'fm-webui'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - firewall-manager-dev
                - firewall-manager-staging
                - firewall-manager-prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: fm-webui
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metrics_path: '/metrics'
        scrape_interval: 15s
        scrape_timeout: 10s

      # Scrape FM Worker service
      - job_name: 'fm-worker'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - firewall-manager-dev
                - firewall-manager-staging
                - firewall-manager-prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: fm-worker
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metrics_path: '/metrics'
        scrape_interval: 15s
        scrape_timeout: 10s

      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
            labels:
              service: 'prometheus'
              app: 'monitoring'

      # Loki metrics
      - job_name: 'loki'
        static_configs:
          - targets: ['loki:3100']
            labels:
              service: 'loki'
              app: 'monitoring'

      # CoreDNS metrics (kube-system)
      - job_name: 'coredns'
        static_configs:
          - targets: ['coredns-metrics.kube-system.svc.cluster.local:9153']
            labels:
              service: 'coredns'
              app: 'dns'
        scrape_interval: 30s
        scrape_timeout: 10s

      # Pi-hole exporter (pihole namespace)
      - job_name: 'pihole-exporter'
        static_configs:
          - targets: ['pihole-exporter.pihole.svc.cluster.local:9617']
            labels:
              service: 'pihole-exporter'
              app: 'dns'
        scrape_interval: 30s
        scrape_timeout: 10s

      # Unbound exporter (dns namespace)
      - job_name: 'unbound-exporter'
        static_configs:
          - targets: ['unbound-exporter.dns.svc.cluster.local:9167']
            labels:
              service: 'unbound-exporter'
              app: 'dns'
        scrape_interval: 30s
        scrape_timeout: 10s

      # Daikin exporter (home-exporters namespace)
      - job_name: 'daikin-prometheus-exporter'
        static_configs:
          - targets: ['daikin-prometheus-exporter.home-exporters.svc.cluster.local:9100']
            labels:
              service: 'daikin-prometheus-exporter'
              app: 'home-climate'
        scrape_interval: 10m
        scrape_timeout: 10s

      # DSMR P1 smart meter exporter (home-exporters namespace)
      - job_name: 'dsmr-p1-prometheus-exporter'
        static_configs:
          - targets: ['dsmr-p1-prometheus-exporter.home-exporters.svc.cluster.local:9100']
            labels:
              service: 'dsmr-p1-prometheus-exporter'
              app: 'home-energy'
        scrape_interval: 10s
        scrape_timeout: 5s

      # GoodWe exporter (home-exporters namespace)
      - job_name: 'goodwe-prometheus-exporter'
        static_configs:
          - targets: ['goodwe-prometheus-exporter.home-exporters.svc.cluster.local:9100']
            labels:
              service: 'goodwe-prometheus-exporter'
              app: 'home-energy'
        scrape_interval: 10s
        scrape_timeout: 5s

      # Shelly Cloud exporter (home-exporters namespace)
      - job_name: 'shelly-prometheus-exporter'
        static_configs:
          - targets: ['shelly-prometheus-exporter.home-exporters.svc.cluster.local:9100']
            labels:
              service: 'shelly-prometheus-exporter'
              app: 'home-climate'
        scrape_interval: 30s
        scrape_timeout: 10s

      # HashiCorp Vault metrics (in-cluster service)
      - job_name: 'vault'
        scheme: http
        metrics_path: '/v1/sys/metrics'
        params:
          format: ['prometheus']
        bearer_token_file: /etc/prometheus/secrets/vault-prometheus-token/token
        static_configs:
          - targets: ['vault.vault.svc.cluster.local:8200']
            labels:
              service: 'vault'
              app: 'hashicorp-vault'
        scrape_interval: 30s
        scrape_timeout: 15s

      # Kubernetes state metrics from kube-prometheus-stack
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-prometheus-stack-kube-state-metrics.monitoring.svc.cluster.local:8080']
            labels:
              service: 'kube-state-metrics'
              app: 'kubernetes'

      # Node exporter metrics from kube-prometheus-stack
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - monitoring
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: kube-prometheus-stack-prometheus-node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_address_target_name]
            target_label: node
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
        scrape_interval: 15s
        scrape_timeout: 10s
