apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - namespace.yaml
  - observability-netpol.yaml
  # Prometheus
  - prometheus/configmap.yaml
  - prometheus/alerts-configmap.yaml
  - prometheus/rbac.yaml
  - prometheus/deployment.yaml
  - prometheus/service.yaml
  # Loki
  - loki/statefulset.yaml
  - loki/service.yaml
  # Promtail
  - promtail/configmap.yaml
  - promtail/daemonset.yaml
  - promtail/rbac.yaml
  # Grafana
  - grafana/configmap.yaml
  - grafana/datasources-configmap.yaml
  - grafana/dashboards-provider-configmap.yaml
  - grafana/alerting-contact-points-configmap.yaml
  - grafana/alerting-notification-policies-configmap.yaml
  - grafana/alerting-rules-time-sync-configmap.yaml
  - grafana/dashboard-overview-configmap.yaml
  - grafana/dashboard-golden-signals-configmap.yaml
  - grafana/dashboard-red-method-configmap.yaml
  - grafana/dashboard-use-method-configmap.yaml
  - grafana/dashboard-hashicorp-vault-configmap.yaml
  - grafana/dashboard-kubernetes-platform-configmap.yaml
  - grafana/dashboard-kubernetes-nodes-configmap.yaml
  - grafana/dashboard-kubernetes-time-sync-configmap.yaml
  - grafana/dashboard-dns-overview-configmap.yaml
  - grafana/dashboard-coredns-configmap.yaml
  - grafana/dashboard-pihole-configmap.yaml
  - grafana/dashboard-pihole-client-configmap.yaml
  - grafana/dashboard-unbound-configmap.yaml
  - grafana/dashboard-home-climate-configmap.yaml
  - grafana/dashboard-home-energy-configmap.yaml
  - grafana/dashboard-dsmr-energy-configmap.yaml
  - grafana/dashboard-shelly-configmap.yaml
  - grafana/dashboard-prometheus-storage-configmap.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml
  # Vault integration
  - vault/external-secret.yaml
  - vault/grafana-admin-external-secret.yaml
  - vault/grafana-alerting-externalsecret.yaml
  - vault/grafana-oidc-externalsecret.yaml
  # DNS ServiceMonitors
  - dns/coredns-servicemonitor.yaml
  - dns/pihole-servicemonitor.yaml
  - dns/unbound-servicemonitor.yaml

generatorOptions:
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logging

configMapGenerator:
  - name: loki-config
    files:
      - loki.yaml=loki/loki.yaml
