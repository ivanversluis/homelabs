---
# ExternalSecret: pulls SSH authorized_keys for VMs from Vault.
#
# Vault path : secret/vms/ssh-keys
# Property   : authorized-keys  (one or more public keys, newline-separated)
#
# The resulting Secret is referenced by debian-bookworm-vm.yaml under
# spec.template.spec.accessCredentials. KubeVirt's QEMU guest agent
# propagation keeps the VM's ~/.ssh/authorized_keys in sync at runtime
# without requiring a VM restart.
#
# See vms-secrets.md-local for Vault setup instructions.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vms-ssh-keys
  namespace: vms
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vms-ssh-keys
    creationPolicy: Owner
  data:
    - secretKey: authorized-keys
      remoteRef:
        key: vms/ssh-keys
        property: authorized-keys
