apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
  # n8n is managed exclusively by a dedicated Flux Kustomization
  # (clusters/k8s-homelab/workloads/n8n-kustomization.yaml), so its
  # PVCs remain outside the root flux-system inventory.
  # linkding, termix, vaultwarden are managed by dedicated Flux Kustomizations
  # (clusters/k8s-homelab/workloads/*-kustomization.yaml) with postBuild.substituteFrom
  # because their deployments/ingresses use ${DOMAIN} for OIDC and URL config.
  # homepage, homebox, and forgejo are also managed exclusively by dedicated
  # workload Kustomizations.
