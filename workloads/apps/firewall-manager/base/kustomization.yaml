apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace is set by overlays
# # namespace set by overlay

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - database.yaml
  - api.yaml
  - webui.yaml
  - worker.yaml
  - ingress.yaml

labels:
  - pairs:
      app: firewall-manager
    includeSelectors: true

