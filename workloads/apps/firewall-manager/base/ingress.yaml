apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fm-webui
  # namespace set by overlay
  labels:
    app: firewall-manager
  annotations:
    # Uncomment and configure based on your ingress controller
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # Uncomment for TLS
  # tls:
  # - hosts:
  #   - firewall-manager.example.com
  #   secretName: fm-tls
  rules:
  - host: firewall-manager.example.com  # Change to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fm-webui
            port:
              number: 80
