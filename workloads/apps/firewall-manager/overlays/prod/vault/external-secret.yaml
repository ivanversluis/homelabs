apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fm-secrets
  namespace: firewall-manager-prod
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: fm-secrets
    creationPolicy: Owner
  data:
  - secretKey: DB_PASSWORD
    remoteRef:
      key: firewall-manager/prod/postgres
      property: password
  - secretKey: FLASK_SECRET_KEY
    remoteRef:
      key: firewall-manager/prod/app
      property: FLASK_SECRET_KEY
  - secretKey: ENCRYPTION_KEY
    remoteRef:
      key: firewall-manager/prod/app
      property: ENCRYPTION_KEY
  - secretKey: POSTGRES_DB
    remoteRef:
      key: firewall-manager/prod/postgres
      property: database
  - secretKey: POSTGRES_USER
    remoteRef:
      key: firewall-manager/prod/postgres
      property: username
  - secretKey: DATABASE_URL
    remoteRef:
      key: firewall-manager/prod/app
      property: DATABASE_URL
