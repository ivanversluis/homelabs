apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: firewall-manager-dev

resources:
  - ../../base
  - firewall-manager-netpol.yaml
  - fm-db-data-longhorn-pvc.yaml
  - vault

labels:
  - pairs:
      environment: dev
    includeSelectors: true

patches:
  - path: patches/configmap.yaml
  - path: patches/remove-static-secret.yaml
  - path: patches/replicas.yaml
  - path: patches/ingress.yaml
  - path: patches/database-longhorn.yaml
  # The DB uses fm-db-data-longhorn in dev; drop the unused base PVC, which
  # would otherwise stay Pending (WaitForFirstConsumer) and keep the app Progressing.
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: fm-db-data
      $patch: delete

images:
  - name: ghcr.io/ivanversluis/firewall-manager-api
    newTag: dev-7d01b2f
  - name: ghcr.io/ivanversluis/firewall-manager-webui
    newTag: dev-7d01b2f
  - name: ghcr.io/ivanversluis/firewall-manager-worker
    newTag: dev-7d01b2f
