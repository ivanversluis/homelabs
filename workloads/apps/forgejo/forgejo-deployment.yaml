apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      enableServiceLinks: false
      nodeSelector:
        node.longhorn.io/create-default-disk: "true"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: forgejo
          # Rootless image avoids s6 startup lock permission issues under non-root policy.
          image: codeberg.org/forgejo/forgejo:16.0.5-rootless
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: forgejo-config
          env:
            - name: FORGEJO__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: FORGEJO__security__SECRET_KEY
            - name: FORGEJO__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: FORGEJO__security__INTERNAL_TOKEN
            - name: FORGEJO__oauth2__JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: FORGEJO__oauth2__JWT_SECRET
            # OIDC credentials from Vault via ExternalSecret
            - name: FORGEJO__OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: forgejo-oidc
                  key: client-id
            - name: FORGEJO__OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-oidc
                  key: client-secret
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Idempotent: create or update the DB-stored auth source; never fail the pod.
                    for i in $(seq 1 60); do
                      wget -qO- http://localhost:3000/api/healthz >/dev/null 2>&1 && break
                      sleep 5
                    done
                    ID=$(gitea admin auth list 2>/dev/null | awk '$2=="authentik"{print $1}')
                    if [ -n "$ID" ]; then
                      gitea admin auth update-oauth --id "$ID" --key "$FORGEJO__OIDC_CLIENT_ID" --secret "$FORGEJO__OIDC_CLIENT_SECRET" --auto-discover-url "$OIDC_DISCOVER_URL"
                    else
                      gitea admin auth add-oauth --name authentik --provider openidConnect --key "$FORGEJO__OIDC_CLIENT_ID" --secret "$FORGEJO__OIDC_CLIENT_SECRET" --auto-discover-url "$OIDC_DISCOVER_URL"
                    fi
                    exit 0
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: forgejo-data
              mountPath: /var/lib/gitea
      volumes:
        - name: forgejo-data
          persistentVolumeClaim:
            claimName: forgejo-pvc
