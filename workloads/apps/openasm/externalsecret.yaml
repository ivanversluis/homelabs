apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oasm-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: oasm-env
    creationPolicy: Owner
  data:
    - secretKey: OASM_CLOUD_APIKEY
      remoteRef:
        key: apps/oasm
        property: OASM_CLOUD_APIKEY
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: apps/oasm
        property: POSTGRES_PASSWORD
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: apps/oasm
        property: REDIS_PASSWORD
    - secretKey: REDIS_URL
      remoteRef:
        key: apps/oasm
        property: REDIS_URL
    - secretKey: RUSTFS_ACCESS_KEY
      remoteRef:
        key: apps/oasm
        property: RUSTFS_ACCESS_KEY
    - secretKey: RUSTFS_SECRET_KEY
      remoteRef:
        key: apps/oasm
        property: RUSTFS_SECRET_KEY
    - secretKey: ENCRYPTION_KEYS
      remoteRef:
        key: apps/oasm
        property: ENCRYPTION_KEYS
