apiVersion: apps/v1
kind: Deployment
metadata:
  name: oasm-rustfs
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: oasm-rustfs}
  template:
    metadata:
      labels: {app: oasm-rustfs}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.3
          args: ["/data"]
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: oasm-env, key: RUSTFS_ACCESS_KEY}
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: oasm-env, key: RUSTFS_SECRET_KEY}
          ports:
            - {name: s3, containerPort: 9000}
          readinessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: oasm-rustfs-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oasm-rustfs
spec:
  selector: {app: oasm-rustfs}
  ports:
    - {name: s3, port: 9000, targetPort: s3}
