apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oasm-postgres-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-worker
  resources:
    requests:
      storage: 10Gi
---
