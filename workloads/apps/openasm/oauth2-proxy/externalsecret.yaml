apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oidc
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: oasm-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef: {key: apps/oasm, property: OAUTH_CLIENT_ID}
    - secretKey: client-secret
      remoteRef: {key: apps/oasm, property: OAUTH_CLIENT_SECRET}
    - secretKey: cookie-secret
      remoteRef: {key: apps/oasm, property: OAUTH2_PROXY_COOKIE_SECRET}
