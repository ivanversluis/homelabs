apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-llm-gateway-key
  namespace: ai
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openwebui-llm-gateway-key
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: infra/kong
        property: ai-gateway-client-key
