apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openwebui
  namespace: ai
  annotations:
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
    konghq.com/strip-path: "false"
    # WebSocket support for streaming responses
    konghq.com/connection: "upgrade"
    # Increase proxy read timeout for long LLM responses (default 60s is too short)
    konghq.com/proxy-read-timeout: "300"
    konghq.com/proxy-send-timeout: "300"
spec:
  ingressClassName: kong
  rules:
    - host: ai-chat.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openwebui
                port:
                  number: 8080
