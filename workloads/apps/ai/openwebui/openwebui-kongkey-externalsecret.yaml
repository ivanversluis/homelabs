# ExternalSecret: pulls the Open WebUI Kong consumer key from Vault.
#
# This secret is the credential Open WebUI uses when calling the MCP endpoint
# through Kong's key-auth plugin. Kong validates it before forwarding the request
# to kubernetes-mcpo.
#
# The generated Secret carries the label konghq.com/credential: key-auth so
# Kong KIC recognises it as a key-auth credential for the "openwebui" KongConsumer.
#
# Prerequisites in Vault (see kong-ai-secrets.md-local):
#   vault kv put secret/infra/openwebui \
#     mcp-consumer-key=$(openssl rand -hex 24)
#
# After ESO syncs, add this value in Open WebUI:
#   Settings → Tools → Add Tool Server → API Key field
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-kongkey
  namespace: ai
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openwebui-kongkey
    creationPolicy: Owner
    template:
      # Kong KIC requires this label to recognise the Secret as a key-auth credential
      metadata:
        labels:
          konghq.com/credential: key-auth
      data:
        # Kong key-auth looks for the "key" field in the credential Secret
        key: "{{ .mcp_consumer_key }}"
  data:
    - secretKey: mcp_consumer_key
      remoteRef:
        key: infra/openwebui
        property: mcp-consumer-key
