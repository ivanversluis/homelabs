apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-tool-connections
  namespace: ai
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openwebui-tool-connections
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        TOOL_SERVER_CONNECTIONS: |
          [
            {
              "type": "openapi",
              "url": "https://mcp-gw.${DOMAIN}",
              "path": "/kubernetes",
              "auth_type": "bearer",
              "key": "{{ .mcp_consumer_key }}",
              "config": { "enable": true },
              "info": {
                "id": "kubernetes",
                "name": "Kubernetes",
                "description": "Read-only Kubernetes operations through MCPO and Kong"
              }
            },
            {
              "type": "openapi",
              "url": "https://mcp-gw.${DOMAIN}",
              "path": "/nmap",
              "auth_type": "bearer",
              "key": "{{ .mcp_consumer_key }}",
              "config": { "enable": true },
              "info": {
                "id": "nmap",
                "name": "Nmap",
                "description": "Network discovery through MCPO and Kong"
              }
            }
          ]
  data:
    - secretKey: mcp_consumer_key
      remoteRef:
        key: infra/openwebui
        property: mcp-consumer-key
