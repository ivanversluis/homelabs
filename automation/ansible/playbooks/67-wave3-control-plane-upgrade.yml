---
# Pinned Kubernetes control-plane minor upgrade. No node drain, OS package upgrade, or reboot.
# Requires the fresh recovery checkpoint produced by playbooks/66-wave3-recovery-checkpoint.yml.
- name: Wave 3 Kubernetes control-plane upgrade to v1.36.4
  hosts: control_plane
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  pre_tasks:
    - name: Revalidate recovery backup target before loading upgrade role
      ansible.builtin.include_role:
        name: wave3_control_plane_upgrade
        tasks_from: verify_backup_target
  roles:
    - wave3_control_plane_upgrade
