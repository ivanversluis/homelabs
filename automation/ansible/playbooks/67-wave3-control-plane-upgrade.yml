# Requires the fresh recovery checkpoint produced by playbooks/66-wave3-recovery-checkpoint.yml.
- name: Wave 3 Kubernetes control-plane upgrade to v1.36.4
  hosts: control_plane
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  roles:
    - wave3_control_plane_upgrade
