---
- name: Coordinated worker Arch and Kubernetes upgrade canary
  hosts: workers
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  pre_tasks:
    - name: Require exactly the configured canary worker
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == lifecycle_worker_canary
        fail_msg: >-
          Run playbook 68 with limit={{ lifecycle_worker_canary }}. The canary is configured
          centrally in inventories/homelab/group_vars/all.yml.
  vars:
    wave3_node_upgrade_approved: true
    wave3_node_mode: worker
    wave3_node_allowed_targets:
      - "{{ lifecycle_worker_canary }}"
  roles:
    - wave3_node_upgrade
