---
- name: Coordinated control-plane host Arch and kubelet upgrade
  hosts: control_plane
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  pre_tasks:
    - name: Require exactly one control-plane target
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname in groups['control_plane']
        fail_msg: >-
          Run playbook 70 against exactly one control-plane host.
  vars:
    wave3_node_upgrade_approved: true
    wave3_node_mode: control-plane
    wave3_node_allowed_targets: "{{ groups['control_plane'] }}"
    wave3_node_require_all_workers_target: true
  roles:
    - wave3_node_upgrade
