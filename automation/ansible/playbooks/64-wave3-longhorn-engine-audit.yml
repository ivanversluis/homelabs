---
# Read-only audit after Wave 3 drain dry-runs exposed Longhorn instance-manager PDB blocks.
# It determines whether the v1.11 instance managers still correspond to volumes/engines that
# have not completed the v1.12.1 engine upgrade, or are expected live-upgrade leftovers that
# only need an attach/detach cycle before Longhorn can clean them up.
- name: Wave 3 Longhorn engine-image audit
  hosts: control_plane
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  roles:
    - wave3_longhorn_engine_audit
