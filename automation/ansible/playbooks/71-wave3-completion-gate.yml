---
- name: Coordinated platform final per-node completion gate
  hosts: k8s_homelab
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  roles:
    - wave3_completion_gate

- name: Coordinated platform final cluster completion gate
  hosts: k8s-master01
  gather_facts: false
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:
    - name: Verify cluster-wide coordinated platform completion
      ansible.builtin.include_role:
        name: wave3_completion_gate
        tasks_from: cluster
