---
# Configures Vault's SSH secrets engine as the homelab's SSH client (user) CA.
# Runs against the in-cluster Vault pod via `kubectl exec` — never against a port-forward
# with a persisted token file. VAULT_TOKEN must be exported in the operator's shell for this
# run only; it is read via lookup('env', ...) and never written to disk or git.
#
# This role is idempotent: re-running it does not rotate the CA private key or destroy
# existing signed certificates. The CA private key is generated by Vault and never leaves it.
- name: Ensure VAULT_TOKEN was supplied via environment (never stored in repo)
  ansible.builtin.assert:
    that:
      - lookup('env', 'VAULT_TOKEN') | length > 0
    fail_msg: "Export VAULT_TOKEN in your shell before running this role. It is never read from files."
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Resolve the running Vault pod name
  ansible.builtin.command: >-
    kubectl get pod -n {{ vault_namespace }} -l app.kubernetes.io/name=vault
    -o jsonpath={.items[0].metadata.name}
  register: vault_pod
  delegate_to: localhost
  run_once: true
  changed_when: false

- name: List currently mounted secrets engines
  ansible.builtin.command: >-
    kubectl exec -n {{ vault_namespace }} {{ vault_pod.stdout }} --
    env VAULT_TOKEN={{ lookup('env', 'VAULT_TOKEN') }}
    vault secrets list -format=json
  register: vault_secrets_list
  delegate_to: localhost
  run_once: true
  changed_when: false
  no_log: true

- name: Enable the ssh-client-signer secrets engine
  ansible.builtin.command: >-
    kubectl exec -n {{ vault_namespace }} {{ vault_pod.stdout }} --
    env VAULT_TOKEN={{ lookup('env', 'VAULT_TOKEN') }}
    vault secrets enable -path={{ vault_ssh_mount_path }} ssh
  delegate_to: localhost
  run_once: true
  when: (vault_ssh_mount_path ~ '/') not in (vault_secrets_list.stdout | from_json)
  changed_when: true
  no_log: true

- name: Check whether the CA has already been generated
  ansible.builtin.command: >-
    kubectl exec -n {{ vault_namespace }} {{ vault_pod.stdout }} --
    env VAULT_TOKEN={{ lookup('env', 'VAULT_TOKEN') }}
    vault read -format=json {{ vault_ssh_mount_path }}/config/ca
  register: vault_ca_check
  delegate_to: localhost
  run_once: true
  changed_when: false
  failed_when: false
  no_log: true

- name: Generate the Vault SSH client CA (private key never leaves Vault)
  ansible.builtin.command: >-
    kubectl exec -n {{ vault_namespace }} {{ vault_pod.stdout }} --
    env VAULT_TOKEN={{ lookup('env', 'VAULT_TOKEN') }}
    vault write -f {{ vault_ssh_mount_path }}/config/ca generate_signing_key=true
  delegate_to: localhost
  run_once: true
  when: vault_ca_check.rc != 0
  changed_when: true
  no_log: true

- name: Create/update the homelab-ansible signing role (locked-down extensions, short TTL)
  ansible.builtin.shell: |
    set -o pipefail
    kubectl exec -n {{ vault_namespace }} {{ vault_pod.stdout }} -- \
      env VAULT_TOKEN={{ lookup('env', 'VAULT_TOKEN') }} \
      vault write {{ vault_ssh_mount_path }}/roles/{{ vault_ssh_role_name }} - <<'EOF'
    {
      "key_type": "ca",
      "algorithm_signer": "rsa-sha2-256",
      "allow_user_certificates": true,
      "default_user": "{{ vault_ssh_allowed_principal }}",
      "allowed_users": "{{ vault_ssh_allowed_principal }}",
      "default_extensions": {"permit-pty": ""},
      "allowed_extensions": "",
      "allow_user_key_ids": true,
      "key_id_format": "{% raw %}{{role_name}}-{{public_key_hash}}{% endraw %}",
      "ttl": "{{ vault_ssh_default_ttl }}",
      "max_ttl": "{{ vault_ssh_max_ttl }}"
    }
    EOF
  delegate_to: localhost
  run_once: true
  changed_when: true
  no_log: true

- name: Write the Vault policy allowing only signing through the homelab-ansible role
  ansible.builtin.shell: |
    set -o pipefail
    kubectl exec -n {{ vault_namespace }} {{ vault_pod.stdout }} -- \
      env VAULT_TOKEN={{ lookup('env', 'VAULT_TOKEN') }} \
      vault policy write {{ vault_semaphore_policy_name }} - <<'POLICY'
    path "{{ vault_ssh_mount_path }}/sign/{{ vault_ssh_role_name }}" {
      capabilities = ["update"]
    }
    path "{{ vault_ssh_mount_path }}/issue/{{ vault_ssh_role_name }}" {
      capabilities = ["update"]
    }
    POLICY
  delegate_to: localhost
  run_once: true
  changed_when: true
  no_log: true

- name: Bind the Semaphore ServiceAccount to the signing policy via Kubernetes auth
  ansible.builtin.command: >-
    kubectl exec -n {{ vault_namespace }} {{ vault_pod.stdout }} --
    env VAULT_TOKEN={{ lookup('env', 'VAULT_TOKEN') }}
    vault write auth/kubernetes/role/{{ vault_semaphore_k8s_role }}
    bound_service_account_names={{ vault_semaphore_service_account }}
    bound_service_account_namespaces={{ vault_semaphore_namespace }}
    policies={{ vault_semaphore_policy_name }}
    ttl={{ vault_semaphore_role_ttl }}
  delegate_to: localhost
  run_once: true
  changed_when: true
  no_log: true

- name: Read the CA public key for distribution to nodes (safe to display — public key only)
  ansible.builtin.command: >-
    kubectl exec -n {{ vault_namespace }} {{ vault_pod.stdout }} --
    env VAULT_TOKEN={{ lookup('env', 'VAULT_TOKEN') }}
    vault read -field=public_key {{ vault_ssh_mount_path }}/config/ca
  register: vault_ssh_ca_public_key_result
  delegate_to: localhost
  run_once: true
  changed_when: false

- name: Expose the CA public key to subsequent plays/roles
  ansible.builtin.set_fact:
    vault_ssh_ca_public_key: "{{ vault_ssh_ca_public_key_result.stdout }}"
