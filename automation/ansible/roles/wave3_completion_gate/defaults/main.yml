---
wave3_completion_kubeconfig: /etc/kubernetes/admin.conf
wave3_completion_control_plane: k8s-master01
wave3_completion_target_version: "{{ lifecycle_kubernetes_target_version }}"
wave3_completion_target_package_prefix: "{{ lifecycle_kubernetes_target_package_prefix }}"
wave3_completion_expected_calico_version: "{{ lifecycle_expected_calico_version }}"
wave3_completion_expected_longhorn_manager_image: "{{ lifecycle_expected_longhorn_manager_image }}"
wave3_completion_longhorn_namespace: longhorn-system
wave3_completion_required_apiserver_args:
  - oidc-issuer-url
  - oidc-client-id
  - oidc-username-claim
  - oidc-groups-claim
