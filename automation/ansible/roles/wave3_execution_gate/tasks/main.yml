---
# Read-only Wave 3 execution gate. This is the last evidence-gathering step before any
# package/kubeadm mutation is considered. A failure here is a hard stop.

- name: Show kubeadm ClusterConfiguration with line numbers
  ansible.builtin.raw: |
    kubectl --kubeconfig={{ wave3_gate_kubeconfig }} -n kube-system \
      get configmap kubeadm-config -o jsonpath='{.data.ClusterConfiguration}' | nl -ba
  changed_when: false
  register: wave3_gate_kubeadm_config_numbered

- name: Run kubeadm upgrade plan and capture warnings
  ansible.builtin.raw: kubeadm upgrade plan 2>&1
  changed_when: false
  failed_when: false
  register: wave3_gate_upgrade_plan

# Evidence must be printed before a fail-fast assertion. The previous ordering placed this
# debug task after the assertion, so the exact malformed live ClusterConfiguration was hidden
# whenever kubeadm correctly blocked the gate.
- name: Show numbered kubeadm configuration and upgrade-plan evidence
  ansible.builtin.debug:
    msg:
      - "ClusterConfiguration={{ wave3_gate_kubeadm_config_numbered.stdout_lines | default([]) }}"
      - "kubeadm upgrade plan={{ wave3_gate_upgrade_plan.stdout_lines | default([]) }}"

- name: Highlight apiServer key lines if present
  ansible.builtin.debug:
    msg: >-
      apiServer key lines={{ wave3_gate_kubeadm_config_numbered.stdout_lines
      | select('search', 'apiServer:') | list }}

- name: Block on malformed kubeadm configuration
  ansible.builtin.assert:
    that:
      - wave3_gate_upgrade_plan.rc == 0
      - "'strict decoding error' not in (wave3_gate_upgrade_plan.stdout | lower)"
      - "'already set in map' not in (wave3_gate_upgrade_plan.stdout | lower)"
      - "'error unmarshaling configuration' not in (wave3_gate_upgrade_plan.stdout | lower)"
    fail_msg: >-
      Wave 3 is BLOCKED because kubeadm reports a malformed ClusterConfiguration. The
      numbered live configuration and upgrade-plan evidence are printed above. Do not run
      kubeadm upgrade apply or package mutation until the duplicate/invalid key is corrected
      deliberately.

- name: Confirm current Calico baseline
  ansible.builtin.raw: |
    set -e
    version="$(kubectl --kubeconfig={{ wave3_gate_kubeconfig }} get installation.operator.tigera.io default -o jsonpath='{.status.calicoVersion}')"
    test "$version" = "{{ wave3_gate_expected_calico_version }}"
    kubectl --kubeconfig={{ wave3_gate_kubeconfig }} get tigerastatus
  changed_when: false
  register: wave3_gate_calico

- name: Confirm current Longhorn baseline and healthy volumes
  ansible.builtin.raw: |
    set -e
    image="$(kubectl --kubeconfig={{ wave3_gate_kubeconfig }} -n longhorn-system get daemonset longhorn-manager -o jsonpath='{.spec.template.spec.containers[?(@.name=="longhorn-manager")].image}')"
    test "$image" = "{{ wave3_gate_expected_longhorn_manager_image }}"
    bad="$(kubectl --kubeconfig={{ wave3_gate_kubeconfig }} -n longhorn-system get volumes.longhorn.io -o jsonpath='{range .items[?(@.status.robustness!="healthy")]}{.metadata.name}{"\n"}{end}')"
    test -z "$bad"
    kubectl --kubeconfig={{ wave3_gate_kubeconfig }} -n longhorn-system get settings.longhorn.io node-drain-policy -o jsonpath='{.value}{"\n"}'
  changed_when: false
  register: wave3_gate_longhorn

# Task 49 exposed that kubectl JSONPath does not support the nested filter expression used by
# the previous implementation (`unterminated filter`). Reuse the already-proven Wave 0.5
# pattern: fetch JSON, parse it with Ansible/Jinja, and evaluate the Ready condition there.
- name: Fetch Flux Kustomizations for the execution gate
  ansible.builtin.raw: >-
    kubectl --kubeconfig={{ wave3_gate_kubeconfig }}
    get kustomizations.kustomize.toolkit.fluxcd.io -A -o json
  changed_when: false
  register: wave3_gate_flux_ks_raw

- name: Fetch Flux HelmReleases for the execution gate
  ansible.builtin.raw: >-
    kubectl --kubeconfig={{ wave3_gate_kubeconfig }}
    get helmreleases.helm.toolkit.fluxcd.io -A -o json
  changed_when: false
  register: wave3_gate_flux_hr_raw

- name: Parse Flux objects for the execution gate
  ansible.builtin.set_fact:
    wave3_gate_flux_kustomizations: "{{ (wave3_gate_flux_ks_raw.stdout | from_json)['items'] }}"
    wave3_gate_flux_helmreleases: "{{ (wave3_gate_flux_hr_raw.stdout | from_json)['items'] }}"
    wave3_gate_flux_blockers: []
    wave3_gate_flux_suspended: []

- name: Record suspended Flux Kustomizations
  ansible.builtin.set_fact:
    wave3_gate_flux_suspended: >-
      {{ wave3_gate_flux_suspended + ['Kustomization/' + item.metadata.namespace + '/' + item.metadata.name] }}
  loop: "{{ wave3_gate_flux_kustomizations }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
  when: item.spec.suspend | default(false)

- name: Record non-suspended Flux Kustomizations that are not Ready
  ansible.builtin.set_fact:
    wave3_gate_flux_blockers: >-
      {{ wave3_gate_flux_blockers + ['Kustomization/' + item.metadata.namespace + '/' + item.metadata.name] }}
  loop: "{{ wave3_gate_flux_kustomizations }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
  vars:
    ready_cond: "{{ item.status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | list | first | default({'status': 'Unknown'}) }}"
  when:
    - not (item.spec.suspend | default(false))
    - ready_cond.status != 'True'

- name: Record suspended Flux HelmReleases
  ansible.builtin.set_fact:
    wave3_gate_flux_suspended: >-
      {{ wave3_gate_flux_suspended + ['HelmRelease/' + item.metadata.namespace + '/' + item.metadata.name] }}
  loop: "{{ wave3_gate_flux_helmreleases }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
  when: item.spec.suspend | default(false)

- name: Record non-suspended Flux HelmReleases that are not Ready
  ansible.builtin.set_fact:
    wave3_gate_flux_blockers: >-
      {{ wave3_gate_flux_blockers + ['HelmRelease/' + item.metadata.namespace + '/' + item.metadata.name] }}
  loop: "{{ wave3_gate_flux_helmreleases }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
  vars:
    ready_cond: "{{ item.status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | list | first | default({'status': 'Unknown'}) }}"
  when:
    - not (item.spec.suspend | default(false))
    - ready_cond.status != 'True'

- name: Show Flux execution-gate evidence
  ansible.builtin.debug:
    msg:
      - "Flux blockers={{ wave3_gate_flux_blockers }}"
      - "Flux suspended accepted exceptions={{ wave3_gate_flux_suspended }}"

- name: Confirm Flux has no active reconciliation blockers
  ansible.builtin.assert:
    that:
      - wave3_gate_flux_blockers | length == 0
    fail_msg: >-
      Wave 3 is BLOCKED because one or more non-suspended Flux Kustomizations or HelmReleases
      are not Ready. Resolve the resources listed above before host or Kubernetes mutation.

- name: Simulate worker drains with server-side dry-run
  ansible.builtin.raw: >-
    kubectl --kubeconfig={{ wave3_gate_kubeconfig }} drain {{ item }}
    --ignore-daemonsets
    --delete-emptydir-data
    --dry-run=server
    --timeout=60s
  changed_when: false
  failed_when: false
  loop: "{{ wave3_gate_worker_nodes }}"
  register: wave3_gate_drain_simulations

- name: Report worker drain simulations
  ansible.builtin.debug:
    msg: >-
      node={{ item.item }} rc={{ item.rc }} output={{ (item.stdout_lines | default([])) + (item.stderr_lines | default([])) }}
  loop: "{{ wave3_gate_drain_simulations.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Block if any worker drain simulation fails
  ansible.builtin.assert:
    that:
      - (wave3_gate_drain_simulations.results | selectattr('rc', 'ne', 0) | list | length) == 0
    fail_msg: >-
      Wave 3 worker maintenance is BLOCKED because at least one server-side drain dry-run
      failed. Resolve the reported PDB/Longhorn/workload disruption constraint; do not use
      --disable-eviction as a workaround.

- name: Show Wave 3 execution-gate verdict
  ansible.builtin.debug:
    msg:
      - "WAVE 3 EXECUTION GATE: READY FOR OPERATOR REVIEW"
      - "Kubernetes target candidate={{ wave3_gate_target_patch }}; no upgrade executed"
      - "Calico baseline={{ wave3_gate_expected_calico_version }} confirmed"
      - "Longhorn baseline={{ wave3_gate_expected_longhorn_manager_image }} confirmed"
      - "Flux active resources Ready; suspended resources={{ wave3_gate_flux_suspended }}"
      - "All worker drain simulations passed with server-side dry-run"
      - "Next step remains an explicit operator approval before any package synchronization or kubeadm mutation"
