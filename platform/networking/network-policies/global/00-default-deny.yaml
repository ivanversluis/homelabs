---
# Zero Trust baseline: default-deny ingress + egress for every namespace
# except the system namespaces explicitly excluded below.
# Order 1000 is evaluated last; per-namespace k8s NetworkPolicies provide
# explicit Allow rules that take precedence over this implicit deny.
#
# IMPORTANT: Calico GlobalNetworkPolicy with types: [Egress] creates an
# implicit deny for ALL matched pods. Do NOT add global Allow policies
# with selector: all() — they will block system namespaces (incl. CoreDNS).
# Use per-namespace k8s NetworkPolicies for egress carve-outs instead.
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: zt-default-deny
spec:
  order: 1000
  namespaceSelector: kubernetes.io/metadata.name not in {"kube-system", "kube-public", "kube-node-lease", "calico-system", "tigera-operator", "longhorn-system", "metallb-system", "ingress-nginx", "kubevirt", "cdi"}
  types:
    - Ingress
    - Egress
