apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-rules-pvc
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: alerting
data:
  rules-pvc.yaml: |
    {
      "apiVersion": 1,
      "groups": [
        {
          "orgId": 1,
          "name": "pvc-capacity",
          "folder": "Homelab",
          "interval": "1m",
          "rules": [
            {
              "uid": "pvc_full_warning",
              "title": "PVCFilesystemUsageHigh",
              "condition": "C",
              "data": [
                {
                  "refId": "A",
                  "relativeTimeRange": {
                    "from": 300,
                    "to": 0
                  },
                  "datasourceUid": "prometheus",
                  "model": {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "prometheus"
                    },
                    "editorMode": "code",
                    "expr": "100 * (1 - (max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_available_bytes{job=\"kubernetes-kubelet-volumes\"}) / clamp_min(max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{job=\"kubernetes-kubelet-volumes\"}), 1)))",
                    "instant": true,
                    "intervalMs": 1000,
                    "maxDataPoints": 43200,
                    "range": false,
                    "refId": "A"
                  }
                },
                {
                  "refId": "B",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "datasourceUid": "__expr__",
                  "model": {
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "A",
                    "intervalMs": 1000,
                    "maxDataPoints": 43200,
                    "reducer": "last",
                    "refId": "B",
                    "type": "reduce"
                  }
                },
                {
                  "refId": "C",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "datasourceUid": "__expr__",
                  "model": {
                    "conditions": [
                      {
                        "evaluator": {
                          "params": [
                            80
                          ],
                          "type": "gt"
                        },
                        "operator": {
                          "type": "and"
                        },
                        "query": {
                          "params": [
                            "C"
                          ]
                        },
                        "reducer": {
                          "params": [],
                          "type": "last"
                        },
                        "type": "query"
                      }
                    ],
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "B",
                    "intervalMs": 1000,
                    "maxDataPoints": 43200,
                    "refId": "C",
                    "type": "threshold"
                  }
                }
              ],
              "noDataState": "NoData",
              "execErrState": "Alerting",
              "for": "15m",
              "labels": {
                "severity": "warning",
                "component": "pvc-capacity",
                "engine": "grafana"
              },
              "annotations": {
                "summary": "PVCFilesystemUsageHigh on {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}",
                "description": "PVC filesystem full >80% for 15m; current {{ printf \"%.1f\" $values.B.Value }}%. Take action before write failures.",
                "__dashboardUid__": "k8s-pvc-capacity",
                "__panelId__": "7"
              }
            },
            {
              "uid": "pvc_full_critical",
              "title": "PVCFilesystemUsageCritical",
              "condition": "C",
              "data": [
                {
                  "refId": "A",
                  "relativeTimeRange": {
                    "from": 300,
                    "to": 0
                  },
                  "datasourceUid": "prometheus",
                  "model": {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "prometheus"
                    },
                    "editorMode": "code",
                    "expr": "100 * (1 - (max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_available_bytes{job=\"kubernetes-kubelet-volumes\"}) / clamp_min(max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{job=\"kubernetes-kubelet-volumes\"}), 1)))",
                    "instant": true,
                    "intervalMs": 1000,
                    "maxDataPoints": 43200,
                    "range": false,
                    "refId": "A"
                  }
                },
                {
                  "refId": "B",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "datasourceUid": "__expr__",
                  "model": {
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "A",
                    "intervalMs": 1000,
                    "maxDataPoints": 43200,
                    "reducer": "last",
                    "refId": "B",
                    "type": "reduce"
                  }
                },
                {
                  "refId": "C",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "datasourceUid": "__expr__",
                  "model": {
                    "conditions": [
                      {
                        "evaluator": {
                          "params": [
                            95
                          ],
                          "type": "gt"
                        },
                        "operator": {
                          "type": "and"
                        },
                        "query": {
                          "params": [
                            "C"
                          ]
                        },
                        "reducer": {
                          "params": [],
                          "type": "last"
                        },
                        "type": "query"
                      }
                    ],
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "B",
                    "intervalMs": 1000,
                    "maxDataPoints": 43200,
                    "refId": "C",
                    "type": "threshold"
                  }
                }
              ],
              "noDataState": "NoData",
              "execErrState": "Alerting",
              "for": "2m",
              "labels": {
                "severity": "critical",
                "component": "pvc-capacity",
                "engine": "grafana"
              },
              "annotations": {
                "summary": "PVCFilesystemUsageCritical on {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}",
                "description": "PVC filesystem full >95% for 2m; current {{ printf \"%.1f\" $values.B.Value }}%. Immediate action required.",
                "__dashboardUid__": "k8s-pvc-capacity",
                "__panelId__": "7"
              }
            },
            {
              "uid": "pvc_missing_stats",
              "title": "PVCMountedVolumeMetricsMissing",
              "condition": "C",
              "data": [
                {
                  "refId": "A",
                  "relativeTimeRange": {
                    "from": 300,
                    "to": 0
                  },
                  "datasourceUid": "prometheus",
                  "model": {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "prometheus"
                    },
                    "editorMode": "code",
                    "expr": "max by (namespace, persistentvolumeclaim) (kube_pod_spec_volumes_persistentvolumeclaims_info{job=\"kube-state-metrics\"} * on(namespace,pod) group_left() (kube_pod_status_phase{job=\"kube-state-metrics\",phase=\"Running\"} == 1)) unless on(namespace,persistentvolumeclaim) max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{job=\"kubernetes-kubelet-volumes\"})",
                    "instant": true,
                    "intervalMs": 1000,
                    "maxDataPoints": 43200,
                    "range": false,
                    "refId": "A"
                  }
                },
                {
                  "refId": "B",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "datasourceUid": "__expr__",
                  "model": {
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "A",
                    "intervalMs": 1000,
                    "maxDataPoints": 43200,
                    "reducer": "last",
                    "refId": "B",
                    "type": "reduce"
                  }
                },
                {
                  "refId": "C",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "datasourceUid": "__expr__",
                  "model": {
                    "conditions": [
                      {
                        "evaluator": {
                          "params": [
                            0
                          ],
                          "type": "gt"
                        },
                        "operator": {
                          "type": "and"
                        },
                        "query": {
                          "params": [
                            "C"
                          ]
                        },
                        "reducer": {
                          "params": [],
                          "type": "last"
                        },
                        "type": "query"
                      }
                    ],
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "B",
                    "intervalMs": 1000,
                    "maxDataPoints": 43200,
                    "refId": "C",
                    "type": "threshold"
                  }
                }
              ],
              "noDataState": "NoData",
              "execErrState": "Alerting",
              "for": "10m",
              "labels": {
                "severity": "warning",
                "component": "pvc-capacity",
                "engine": "grafana"
              },
              "annotations": {
                "summary": "PVCMountedVolumeMetricsMissing on {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}",
                "description": "Running pod references PVC but no kubelet filesystem metrics have been collected for 10m. Confirm supported driver and scrape health.",
                "__dashboardUid__": "k8s-pvc-capacity",
                "__panelId__": "9"
              }
            },
            {
              "uid": "pvc_kubelet_scrape_down",
              "title": "PVCKubeletScrapeUnavailable",
              "condition": "C",
              "data": [
                {
                  "refId": "A",
                  "relativeTimeRange": {
                    "from": 300,
                    "to": 0
                  },
                  "datasourceUid": "prometheus",
                  "model": {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "prometheus"
                    },
                    "editorMode": "code",
                    "expr": "up{job=\"kubernetes-kubelet-volumes\"}",
                    "instant": true,
                    "intervalMs": 1000,
                    "maxDataPoints": 43200,
                    "range": false,
                    "refId": "A"
                  }
                },
                {
                  "refId": "B",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "datasourceUid": "__expr__",
                  "model": {
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "A",
                    "intervalMs": 1000,
                    "maxDataPoints": 43200,
                    "reducer": "last",
                    "refId": "B",
                    "type": "reduce"
                  }
                },
                {
                  "refId": "C",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "datasourceUid": "__expr__",
                  "model": {
                    "conditions": [
                      {
                        "evaluator": {
                          "params": [
                            1
                          ],
                          "type": "lt"
                        },
                        "operator": {
                          "type": "and"
                        },
                        "query": {
                          "params": [
                            "C"
                          ]
                        },
                        "reducer": {
                          "params": [],
                          "type": "last"
                        },
                        "type": "query"
                      }
                    ],
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "B",
                    "intervalMs": 1000,
                    "maxDataPoints": 43200,
                    "refId": "C",
                    "type": "threshold"
                  }
                }
              ],
              "noDataState": "Alerting",
              "execErrState": "Alerting",
              "for": "5m",
              "labels": {
                "severity": "critical",
                "component": "pvc-capacity",
                "engine": "grafana"
              },
              "annotations": {
                "summary": "PVCKubeletScrapeUnavailable on {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}",
                "description": "Kubelet metrics endpoint unavailable for 5m, volume reporting may be incomplete.",
                "__dashboardUid__": "k8s-pvc-capacity",
                "__panelId__": "10"
              }
            }
          ]
        }
      ]
    }
