apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-rules-longhorn
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: alerting
data:
  rules-longhorn.yaml: |
    {
      "apiVersion": 1,
      "groups": [
        {
          "orgId": 1,
          "name": "longhorn-storage",
          "folder": "Homelab",
          "interval": "1m",
          "rules": [
            {
              "uid": "longhorn_disk_warning",
              "title": "LonghornDiskUsageWarning",
              "condition": "C",
              "data": [
                {
                  "refId": "A",
                  "relativeTimeRange": {
                    "from": 300,
                    "to": 0
                  },
                  "datasourceUid": "prometheus",
                  "model": {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "prometheus"
                    },
                    "editorMode": "code",
                    "expr": "100 * (max by (node,disk) (longhorn_disk_usage_bytes{job=\"longhorn-manager\"}) / clamp_min(max by (node,disk) (longhorn_disk_capacity_bytes{job=\"longhorn-manager\"}), 1))",
                    "instant": true,
                    "intervalMs": 1000,
                    "maxDataPoints": 43200,
                    "range": false,
                    "refId": "A"
                  }
                },
                {
                  "refId": "B",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "datasourceUid": "__expr__",
                  "model": {
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "A",
                    "intervalMs": 1000,
                    "maxDataPoints": 43200,
                    "reducer": "last",
                    "refId": "B",
                    "type": "reduce"
                  }
                },
                {
                  "refId": "C",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "datasourceUid": "__expr__",
                  "model": {
                    "conditions": [
                      {
                        "evaluator": {
                          "params": [
                            65
                          ],
                          "type": "gt"
                        },
                        "operator": {
                          "type": "and"
                        },
                        "query": {
                          "params": [
                            "C"
                          ]
                        },
                        "reducer": {
                          "params": [],
                          "type": "last"
                        },
                        "type": "query"
                      }
                    ],
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "B",
                    "intervalMs": 1000,
                    "maxDataPoints": 43200,
                    "refId": "C",
                    "type": "threshold"
                  }
                }
              ],
              "noDataState": "NoData",
              "execErrState": "Alerting",
              "for": "10m",
              "labels": {
                "severity": "warning",
                "component": "longhorn",
                "engine": "grafana"
              },
              "annotations": {
                "summary": "Longhorn disk usage approaching replica scheduling limit",
                "description": "Longhorn disk {{ $labels.disk }} on {{ $labels.node }} has used {{ printf \"%.1f\" $values.B.Value }}% for 10m. Plan cleanup/capacity before the default ~75% scheduling boundary.",
                "__dashboardUid__": "k8s-longhorn-scheduling",
                "__panelId__": "8"
              }
            },
            {
              "uid": "longhorn_disk_critical",
              "title": "LonghornDiskUsageCritical",
