apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kubernetes-node-resources
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    grafana_dashboard: 'true'
data:
  kubernetes-node-resource-capacity.json: |
    {
      "uid": "k8s-node-resource-capacity",
      "title": "Kubernetes Node Resource Capacity",
      "id": null,
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "tags": [
        "kubernetes",
        "nodes",
        "capacity",
        "alerting"
      ],
      "refresh": "30s",
      "timezone": "browser",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "panels": [
        {
          "id": 8,
          "type": "text",
          "title": "Sustained resource warnings",
          "gridPos": {
            "h": 3,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "**Root disk >70% for 4h \u00b7 Memory >85% for 4h \u00b7 CPU >90% for 30m**\n\nEach node/instance has its own alert. A threshold crossing begins Pending; recovery resets the timer. CPU is averaged over 5 minutes. Discord receives firing and resolved notifications through `discord-primary`."
          }
        },
        {
          "id": 1,
          "type": "bargauge",
          "title": "CPU usage % \u2014 current",
          "description": "Warning when usage stays > 90% for 30m. CPU uses a 5-minute idle rate; root disk uses available space (including reserved-space impact). Each series is evaluated independently.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 3
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 90
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "100 * (1 - avg by(instance, node) (rate(node_cpu_seconds_total{job=\"node-exporter\",mode=\"idle\"}[5m])))",
              "refId": "A",
              "legendFormat": "{{node}} ({{instance}})",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 2,
          "type": "bargauge",
          "title": "Memory usage % \u2014 current",
          "description": "Warning when usage stays > 85% for 4h. CPU uses a 5-minute idle rate; root disk uses available space (including reserved-space impact). Each series is evaluated independently.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 3
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 85
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "max by(instance, node) (100 * (1 - (node_memory_MemAvailable_bytes{job=\"node-exporter\"} / node_memory_MemTotal_bytes{job=\"node-exporter\"})))",
              "refId": "A",
              "legendFormat": "{{node}} ({{instance}})",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 3,
          "type": "bargauge",
          "title": "Root disk usage % \u2014 current",
          "description": "Warning when usage stays > 70% for 4h. CPU uses a 5-minute idle rate; root disk uses available space (including reserved-space impact). Each series is evaluated independently.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 3
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  }
                ]
              },
              "color": {
