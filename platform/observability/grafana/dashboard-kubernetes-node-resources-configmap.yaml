              "editorMode": "code",
              "expr": "max by(instance, node) (100 * (1 - (node_filesystem_avail_bytes{job=\"node-exporter\",mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{job=\"node-exporter\",mountpoint=\"/\",fstype!~\"tmpfs|overlay\"})))",
              "refId": "A",
              "legendFormat": "{{node}} ({{instance}})",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "CPU usage % \u2014 history",
          "description": "Warning when usage stays > 90% for 30m. CPU uses a 5-minute idle rate; root disk uses available space (including reserved-space impact). Each series is evaluated independently.",
          "datasource": {
