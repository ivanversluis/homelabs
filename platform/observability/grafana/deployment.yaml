apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: visualization
    spec:
      nodeSelector:
        node.longhorn.io/create-default-disk: "true"
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.2.3
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
                  optional: true
            - name: GRAFANA_DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-alerting-secrets
                  key: DISCORD_WEBHOOK_URL
            - name: GF_SERVER_ROOT_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-alerting-secrets
                  key: GRAFANA_PUBLIC_URL
            - name: GF_INSTALL_PLUGINS
              value: ""
            # OIDC via Authentik
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: "authentik"
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: "openid profile email"
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: "https://auth.${DOMAIN}/application/o/authorize/"
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: "https://auth.${DOMAIN}/application/o/token/"
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: "https://auth.${DOMAIN}/application/o/userinfo/"
            - name: GF_AUTH_SIGNOUT_REDIRECT_URL
              value: "https://auth.${DOMAIN}/application/o/grafana/end-session/"
            - name: GF_AUTH_OAUTH_AUTO_LOGIN
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: "contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'"
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc
                  key: client-id
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc
                  key: client-secret
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
              readOnly: true
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards/default.yaml
              subPath: default.yaml
              readOnly: true
            - name: alerting-contact-points
              mountPath: /etc/grafana/provisioning/alerting/contact-points.yaml
              subPath: contact-points.yaml
              readOnly: true
            - name: alerting-notification-policies
              mountPath: /etc/grafana/provisioning/alerting/notification-policies.yaml
              subPath: notification-policies.yaml
              readOnly: true
            - name: alerting-rules-node-resources
              mountPath: /etc/grafana/provisioning/alerting/rules-node-resources.yaml
              subPath: rules-node-resources.yaml
              readOnly: true
            - name: alerting-rules-time-sync
              mountPath: /etc/grafana/provisioning/alerting/rules-time-sync.yaml
              subPath: rules-time-sync.yaml
              readOnly: true
            - name: dashboards-dns
              mountPath: /var/lib/grafana/dashboards/DNS
              readOnly: true
            - name: dashboards-home
              mountPath: /var/lib/grafana/dashboards/Home
              readOnly: true
            - name: dashboards-firewall-manager
              mountPath: /var/lib/grafana/dashboards/Firewall Manager
              readOnly: true
            - name: dashboards-platform-services
              mountPath: /var/lib/grafana/dashboards/Platform Services
              readOnly: true
            - name: dashboards-kubernetes
              mountPath: /var/lib/grafana/dashboards/Kubernetes
              readOnly: true
            - name: dashboard-homelab-overview
              mountPath: /var/lib/grafana/dashboards/homelab-overview.json
              subPath: homelab-overview.json
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: grafana-config
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: alerting-contact-points
          configMap:
            name: grafana-alerting-contact-points
        - name: alerting-notification-policies
          configMap:
            name: grafana-alerting-notification-policies
        - name: alerting-rules-node-resources
          configMap:
            name: grafana-alerting-rules-node-resources
        - name: alerting-rules-time-sync
          configMap:
            name: grafana-alerting-rules-time-sync
        - name: dashboards-dns
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-coredns
                  items:
                    - key: coredns.json
                      path: coredns.json
              - configMap:
                  name: grafana-dashboard-dns-overview
                  items:
                    - key: dns-overview.json
                      path: dns-overview.json
              - configMap:
                  name: grafana-dashboard-pihole-client
                  items:
                    - key: pihole-client.json
                      path: pihole-client.json
              - configMap:
                  name: grafana-dashboard-pihole
                  items:
                    - key: pihole.json
                      path: pihole.json
              - configMap:
                  name: grafana-dashboard-unbound
                  items:
                    - key: unbound.json
                      path: unbound.json
        - name: dashboards-home
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-dsmr-energy
                  items:
                    - key: dsmr-energy.json
                      path: dsmr-energy.json
              - configMap:
                  name: grafana-dashboard-home-climate
                  items:
                    - key: home-climate.json
                      path: home-climate.json
              - configMap:
                  name: grafana-dashboard-home-energy
                  items:
                    - key: home-energy.json
                      path: home-energy.json
              - configMap:
                  name: grafana-dashboard-shelly
                  items:
                    - key: shelly-devices.json
                      path: shelly-devices.json
        - name: dashboards-firewall-manager
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-golden-signals
                  items:
                    - key: fm-golden-signals.json
                      path: fm-golden-signals.json
              - configMap:
                  name: grafana-dashboard-overview
                  items:
                    - key: firewall-manager-overview.json
                      path: firewall-manager-overview.json
              - configMap:
                  name: grafana-dashboard-red-method
                  items:
                    - key: fm-red-method.json
                      path: fm-red-method.json
              - configMap:
                  name: grafana-dashboard-use-method
                  items:
                    - key: fm-use-method.json
                      path: fm-use-method.json
        - name: dashboards-platform-services
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-hashicorp-vault
                  items:
                    - key: hashicorp-vault.json
                      path: hashicorp-vault.json
              - configMap:
                  name: grafana-dashboard-prometheus-storage
                  items:
                    - key: prometheus-storage.json
                      path: prometheus-storage.json
        - name: dashboards-kubernetes
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-kubernetes-node-resources
                  items:
                    - key: kubernetes-node-resource-capacity.json
                      path: kubernetes-node-resource-capacity.json
              - configMap:
                  name: grafana-dashboard-kubernetes-nodes
                  items:
                    - key: kubernetes-node-health.json
                      path: kubernetes-node-health.json
              - configMap:
                  name: grafana-dashboard-kubernetes-platform
                  items:
                    - key: kubernetes-platform-overview.json
                      path: kubernetes-platform-overview.json
              - configMap:
                  name: grafana-dashboard-kubernetes-time-sync
                  items:
                    - key: kubernetes-time-sync.json
                      path: kubernetes-time-sync.json
              - configMap:
                  name: grafana-dashboard-kubernetes-workloads
                  items:
                    - key: kubernetes-workloads.json
                      path: kubernetes-workloads.json
        - name: dashboard-homelab-overview
          configMap:
            name: grafana-dashboard-homelab-overview
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
