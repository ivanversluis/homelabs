apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-contact-points
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: alerting
data:
  contact-points.yaml: |
    apiVersion: 1

    contactPoints:
      - orgId: 1
        name: discord-primary
        receivers:
          - uid: discord-primary
            type: discord
            disableResolveMessage: false
            settings:
              url: $GRAFANA_DISCORD_WEBHOOK_URL
              title: "[Homelab][{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
              message: |
                {{ range .Alerts }}
                [{{ .Status | toUpper }}] {{ .Labels.alertname }}
                Instance: {{ .Labels.instance }}{{ if .Labels.node }} | Node: {{ .Labels.node }}{{ end }}
                Severity: {{ .Labels.severity }}
                {{ .Annotations.summary }}
                {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
                {{ if .DashboardURL }}Dashboard: {{ .DashboardURL }}{{ end }}
                {{ if .PanelURL }}Panel: {{ .PanelURL }}{{ end }}
                {{ if .GeneratorURL }}Alert: {{ .GeneratorURL }}{{ end }}
                {{- end }}
