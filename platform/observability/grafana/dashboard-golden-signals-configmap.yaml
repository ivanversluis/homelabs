apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-golden-signals
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    grafana_dashboard: "true"
data:
  fm-golden-signals.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Golden Signals dashboard based on Google SRE principles: Latency, Traffic, Errors, Saturation",
      "editable": true,
      "gnetId": null,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": true,
          "icon": "external link",
          "includeVars": true,
          "keepTime": true,
          "tags": ["firewall-manager"],
          "targetBlank": false,
          "title": "FM Dashboards",
          "type": "dashboards"
        }
      ],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0},
          "id": 100,
          "panels": [],
          "title": "🚦 Golden Signals Overview",
          "type": "row"
        },
        {
          "datasource": "Prometheus",
          "description": "P50, P95, P99 latency across all services",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Latency",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {"legend": false, "tooltip": false, "viz": false},
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {"type": "linear"},
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {"group": "A", "mode": "none"},
                "thresholdsStyle": {"mode": "line+area"}
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 0.5},
                  {"color": "red", "value": 1}
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 1},
          "id": 1,
          "options": {
            "legend": {"calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=~\"fm-.*\"}[5m])) by (le, job))",
              "legendFormat": "{{job}} p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=~\"fm-.*\"}[5m])) by (le, job))",
              "legendFormat": "{{job}} p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=~\"fm-.*\"}[5m])) by (le, job))",
              "legendFormat": "{{job}} p99",
              "refId": "C"
            }
          ],
          "title": "🕐 Latency - Response Time Percentiles",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "description": "Request rate per service",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Requests/sec",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "opacity",
                "hideFrom": {"legend": false, "tooltip": false, "viz": false},
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {"type": "linear"},
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {"group": "A", "mode": "none"},
                "thresholdsStyle": {"mode": "off"}
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]},
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 1},
          "id": 2,
          "options": {
            "legend": {"calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=~\"fm-.*\"}[5m])) by (job)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "title": "📊 Traffic - Request Rate",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "description": "Error rate as percentage of total requests",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Error %",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 30,
                "gradientMode": "opacity",
                "hideFrom": {"legend": false, "tooltip": false, "viz": false},
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {"type": "linear"},
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {"group": "A", "mode": "none"},
                "thresholdsStyle": {"mode": "line+area"}
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "red", "value": 5}
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 9},
          "id": 3,
          "options": {
            "legend": {"calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "expr": "100 * sum(rate(http_requests_total{job=~\"fm-.*\", status=~\"5..\"}[5m])) by (job) / sum(rate(http_requests_total{job=~\"fm-.*\"}[5m])) by (job)",
              "legendFormat": "{{job}} 5xx",
              "refId": "A"
            },
            {
              "expr": "100 * sum(rate(http_requests_total{job=~\"fm-.*\", status=~\"4..\"}[5m])) by (job) / sum(rate(http_requests_total{job=~\"fm-.*\"}[5m])) by (job)",
              "legendFormat": "{{job}} 4xx",
              "refId": "B"
            }
          ],
          "title": "❌ Errors - Error Rate Percentage",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "description": "Active in-flight requests per service",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Active Requests",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "opacity",
                "hideFrom": {"legend": false, "tooltip": false, "viz": false},
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {"type": "linear"},
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {"group": "A", "mode": "none"},
                "thresholdsStyle": {"mode": "off"}
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 9},
          "id": 4,
          "options": {
            "legend": {"calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "expr": "active_requests{job=~\"fm-.*\"}",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "title": "📈 Saturation - Active Requests",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 17},
          "id": 101,
          "panels": [],
          "title": "📊 Service Health",
          "type": "row"
        },
        {
          "datasource": "Prometheus",
          "description": "Current status of all Firewall Manager services",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [
                {"options": {"0": {"color": "red", "text": "DOWN"}}, "type": "value"},
                {"options": {"1": {"color": "green", "text": "UP"}}, "type": "value"}
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 8, "x": 0, "y": 18},
          "id": 5,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [
            {"expr": "up{job=\"fm-api\"}", "legendFormat": "API", "refId": "A"},
            {"expr": "up{job=\"fm-webui\"}", "legendFormat": "WebUI", "refId": "B"},
            {"expr": "up{job=\"fm-worker\"}", "legendFormat": "Worker", "refId": "C"}
          ],
          "title": "Service Status",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "description": "Database connection status",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [
                {"options": {"0": {"color": "red", "text": "Disconnected"}}, "type": "value"},
                {"options": {"1": {"color": "green", "text": "Connected"}}, "type": "value"}
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 4, "x": 8, "y": 18},
          "id": 6,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [
            {"expr": "database_connection_status{job=\"fm-api\"}", "legendFormat": "Database", "refId": "A"}
          ],
          "title": "Database",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "description": "Service uptime in hours",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "green", "value": 24}
                ]
              },
              "unit": "h"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 12, "x": 12, "y": 18},
          "id": 7,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [
            {"expr": "service_uptime_seconds{job=\"fm-api\"} / 3600", "legendFormat": "API", "refId": "A"},
            {"expr": "service_uptime_seconds{job=\"fm-webui\"} / 3600", "legendFormat": "WebUI", "refId": "B"},
            {"expr": "service_uptime_seconds{job=\"fm-worker\"} / 3600", "legendFormat": "Worker", "refId": "C"}
          ],
          "title": "Uptime (hours)",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 22},
          "id": 102,
          "panels": [],
          "title": "🔥 Firewall Entities",
          "type": "row"
        },
        {
          "datasource": "Prometheus",
          "description": "Count of managed firewall entities",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "blue", "value": null}
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 24, "x": 0, "y": 23},
          "id": 8,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [
            {"expr": "firewall_instances_total{job=\"fm-api\"}", "legendFormat": "Firewalls", "refId": "A"},
            {"expr": "firewall_policies_total{job=\"fm-api\"}", "legendFormat": "Policies", "refId": "B"},
            {"expr": "firewall_addresses_total{job=\"fm-api\"}", "legendFormat": "Addresses", "refId": "C"},
            {"expr": "firewall_services_total{job=\"fm-api\"}", "legendFormat": "Services", "refId": "D"},
            {"expr": "firewall_address_groups_total{job=\"fm-api\"}", "legendFormat": "Address Groups", "refId": "E"},
            {"expr": "firewall_service_groups_total{job=\"fm-api\"}", "legendFormat": "Service Groups", "refId": "F"},
            {"expr": "firewall_applications_total{job=\"fm-api\"}", "legendFormat": "Applications", "refId": "G"}
          ],
          "title": "Firewall Entity Counts",
          "type": "stat"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["firewall-manager", "golden-signals", "sre"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "FM - Golden Signals (SRE)",
      "uid": "fm-golden-signals",
      "version": 1
    }
