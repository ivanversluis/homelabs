apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
namePrefix: gatus-
resources:
  - ../../../../security/oauth2-proxy/base
  - externalsecret.yaml
  - networkpolicy.yaml
  - ingress.yaml
patches:
  - target:
      kind: Deployment
      name: oauth2-proxy
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --oidc-issuer-url=https://auth.${DOMAIN}/application/o/gatus/
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --redirect-url=https://gatus.${DOMAIN}/oauth2/callback
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --upstream=http://gatus.monitoring.svc.cluster.local:80
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--allowed-group=Gatus Users"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --cookie-name=_gatus_oauth2
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--skip-auth-route=^/health$"
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: OAUTH2_PROXY_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: gatus-oidc
                key: client-id
          - name: OAUTH2_PROXY_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: gatus-oidc
                key: client-secret
          - name: OAUTH2_PROXY_COOKIE_SECRET
            valueFrom:
              secretKeyRef:
                name: gatus-oidc
                key: cookie-secret
