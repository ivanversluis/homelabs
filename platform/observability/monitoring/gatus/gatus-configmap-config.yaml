# ─────────────────────────────────────────────────────────────────────────────
# Gatus configuration - every PUBLIC route has a check here, grouped by function.
# Public routes are published by Terraform (automation/infra-as-code/terraform/
# deployments/tunnel.tf); scripts/validate-public-routes.py (CI) fails when a
# route has no endpoint here or an endpoint points at an unpublished host.
#
# Groups (UI order):  00-edge  10-platform  20-ai  30-apps  35-firewall-manager
#                     40-storage  50-admin  60-synology  70-network
# Internal-only checks (ingress via Kubernetes services) come later.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: gatus
data:
  00-base.yaml: |
    storage:
      type: sqlite
      path: /data/data.db

    web:
      address: 0.0.0.0
      port: 8080

    ui:
      title: "Homelab Status"
      header: "Homelab Status"
      description: "Public-route health checks for the homelab GitOps platform"
      dashboard-heading: "Homelab Status"
      dashboard-subheading: "Cloudflare Tunnel, platform services, and application checks"
      dark-mode: true
      default-sort-by: group
      buttons:
        - name: "Homepage"
          link: "https://homepage.${DOMAIN}"
        - name: "Grafana"
          link: "https://grafana.${DOMAIN}"

    metrics: true

    connectivity:
      checker:
        target: 1.1.1.1:53
        interval: 60s

    alerting:
      discord:
        webhook-url: "$DISCORD_WEBHOOK_URL"
        title: "Homelab Gatus"

  10-edge.yaml: |
    # Edge: Cloudflare tunnel, certificate and domain checks
    endpoints:
          - name: gatus
            group: 00-edge
            url: "https://gatus.${DOMAIN}/health"
            interval: 60s
            client: &cloudflare_client
              timeout: 10s
              dns-resolver: "tcp://1.1.1.1:53"
            ui: &safe_public_ui
              hide-url: true
              hide-hostname: true
              hide-port: true
              hide-errors: false
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 1500"
            alerts: &discord_alert
              - type: discord
                description: "Public edge check failed"
                failure-threshold: 3
                success-threshold: 2
                send-on-resolved: true

          - name: cloudflare-domain
            group: 00-edge
            url: "https://homepage.${DOMAIN}/"
            interval: 5m
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] < 500"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[DOMAIN_EXPIRATION] > 720h"
              - "[RESPONSE_TIME] < 2000"
            alerts: *discord_alert

  20-platform.yaml: |
    # Platform: identity, GitOps, secrets, observability, automation
    endpoints:
          - name: grafana-api-health
            group: 10-platform
            url: "https://grafana.${DOMAIN}/api/health"
            interval: 60s
            client: &cloudflare_client
              timeout: 10s
              dns-resolver: "tcp://1.1.1.1:53"
            ui: &safe_public_ui
              hide-url: true
              hide-hostname: true
              hide-port: true
              hide-errors: false
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2000"
              - "[BODY].database == ok"
            alerts: &discord_alert
              - type: discord
                description: "Platform check failed"
                failure-threshold: 3
                success-threshold: 2
                send-on-resolved: true

          - name: headlamp
            group: 10-platform
            url: "https://headlamp.${DOMAIN}/"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY] == pat(*Headlamp*)"
            alerts: *discord_alert

          - name: argocd-version
            group: 10-platform
            url: "https://argocd.${DOMAIN}/api/version"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "has([BODY].Version) == true"
            alerts: *discord_alert

          - name: vault-sys-health
            group: 10-platform
            url: "https://vault.${DOMAIN}/v1/sys/health"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == any(200, 429, 472, 473)"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2000"
              - "[BODY].initialized == true"
              - "[BODY].sealed == false"
            alerts: *discord_alert

          - name: semaphore-ui
            group: 10-platform
            url: "https://semaphoreui.${DOMAIN}/"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY] == pat(*Semaphore*)"
            alerts: *discord_alert

          # Authentik (OIDC provider for every SSO app)
          - name: authentik
            group: 10-platform
            url: "https://auth.${DOMAIN}/-/health/live/"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == any(200, 204)"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
            alerts: *discord_alert

  30-ai.yaml: |
    # AI: Open WebUI and the Kong gateways
    endpoints:
          - name: openwebui
            group: 20-ai
            url: "https://openwebui.${DOMAIN}/"
            interval: 60s
            client: &cloudflare_client
              timeout: 10s
              dns-resolver: "tcp://1.1.1.1:53"
            ui: &safe_public_ui
              hide-url: true
              hide-hostname: true
              hide-port: true
              hide-errors: false
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 3000"
              - "[BODY] == pat(*Open WebUI*)"
            alerts: &discord_alert
              - type: discord
                description: "AI check failed"
                failure-threshold: 3
                success-threshold: 2
                send-on-resolved: true

          # Kong LLM gateway. An unauthenticated request must be rejected: 401 proves the route is up and key auth is enforced.
          - name: llm-gateway
            group: 20-ai
            url: "https://llm-gw.${DOMAIN}/v1/models"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 401"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 3000"
              - "[BODY].message == pat(*API key*)"
            alerts: *discord_alert

          # Kong MCP gateway health route (static response, no auth).
          - name: mcp-gateway
            group: 20-ai
            url: "https://mcp-gw.${DOMAIN}/healthz"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 3000"
              - "[BODY].status == ok"
            alerts: *discord_alert

  40-apps.yaml: |
    # Applications
    endpoints:
          - name: homepage
            group: 30-apps
            url: "https://homepage.${DOMAIN}/api/healthcheck"
            interval: 60s
            client: &cloudflare_client
              timeout: 10s
              dns-resolver: "tcp://1.1.1.1:53"
            ui: &safe_public_ui
              hide-url: true
              hide-hostname: true
              hide-port: true
              hide-errors: false
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2000"
            alerts: &discord_alert
              - type: discord
                description: "Application check failed"
                failure-threshold: 3
                success-threshold: 2
                send-on-resolved: true

          - name: homebox
            group: 30-apps
            url: "https://homebox.${DOMAIN}/"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY] == pat(*homebox-frontend*)"
            alerts: *discord_alert

          - name: vaultwarden
            group: 30-apps
            url: "https://stargate.${DOMAIN}/"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2000"
              - "[BODY] == pat(*app-root*)"
            alerts: *discord_alert

          - name: forgejo
            group: 30-apps
            url: "https://forgejo.${DOMAIN}/"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY] == pat(*Forgejo*)"
            alerts: *discord_alert

          - name: linkding
            group: 30-apps
            url: "https://bookmarks.${DOMAIN}/"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY] == pat(*Linkding*)"
            alerts: *discord_alert

          - name: n8n
            group: 30-apps
            url: "https://n8n.${DOMAIN}/healthz"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
            alerts: *discord_alert

          - name: termix
            group: 30-apps
            url: "https://termix.${DOMAIN}/"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY] == pat(*Termix*)"
            alerts: *discord_alert

  45-firewall-manager.yaml: |
    # Firewall Manager environments (public setup-status endpoint)
    endpoints:
          - name: firewall-manager-dev
            group: 35-firewall-manager
            url: "https://fm-dev.${DOMAIN}/api/setup/status"
            interval: 60s
            client: &cloudflare_client
              timeout: 10s
              dns-resolver: "tcp://1.1.1.1:53"
            ui: &safe_public_ui
              hide-url: true
              hide-hostname: true
              hide-port: true
              hide-errors: false
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY].database_accessible == true"
              - "[BODY].initialized == true"
            alerts: &discord_alert
              - type: discord
                description: "Firewall Manager check failed"
                failure-threshold: 3
                success-threshold: 2
                send-on-resolved: true

          - name: firewall-manager-staging
            group: 35-firewall-manager
            url: "https://fm-staging.${DOMAIN}/api/setup/status"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY].database_accessible == true"
              - "[BODY].initialized == true"
            alerts: *discord_alert

          # Add "[BODY].initialized == true" once the first-run setup wizard of this environment is completed.
          - name: firewall-manager-prod
            group: 35-firewall-manager
            url: "https://fm-prod.${DOMAIN}/api/setup/status"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY].database_accessible == true"
            alerts: *discord_alert

  50-storage-admin.yaml: |
    # Storage and administration
    endpoints:
          - name: longhorn-ui
            group: 40-storage
            url: "https://storage.${DOMAIN}/ping"
            interval: 60s
            client: &cloudflare_client
              timeout: 10s
              dns-resolver: "tcp://1.1.1.1:53"
            ui: &safe_public_ui
              hide-url: true
              hide-hostname: true
              hide-port: true
              hide-errors: false
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 3000"
              - "[BODY] == pat(*OK*)"
            alerts: &discord_alert
              - type: discord
                description: "Storage/admin check failed"
                failure-threshold: 3
                success-threshold: 2
                send-on-resolved: true

          - name: portainer-status
            group: 50-admin
            url: "https://portainer.${DOMAIN}/api/status"
            interval: 60s
            client: *cloudflare_client
            headers:
              x-api-key: "$PORTAINER_MONITOR_TOKEN"
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 3000"
              - "has([BODY].Version) == true"
            alerts: *discord_alert

  60-synology.yaml: |
    endpoints:
      # GitLab is currently running on Synology NAS.
      # Keep disabled until gitlab.${DOMAIN} is confirmed in Cloudflare Tunnel.
      - name: gitlab-synology
        group: 60-synology
        enabled: false
        url: "https://gitlab.${DOMAIN}/users/sign_in"
        interval: 2m
        client:
          timeout: 10s
          dns-resolver: "tcp://1.1.1.1:53"
        headers:
          PRIVATE-TOKEN: "$GITLAB_MONITOR_TOKEN"
        ui:
          hide-url: true
          hide-hostname: true
          hide-port: true
          hide-errors: false
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 168h"
          - "[RESPONSE_TIME] < 3000"
          - "[BODY] == pat(*GitLab*)"

  70-network.yaml: |
    endpoints:
      # WireGuard tunnel status via Kong → RouterOS REST API
      # All 3 endpoints query the same /interface/wireguard/peer list.
      # RouterOS returns JSON fields in alphabetical order within each peer object;
      # "interface" immediately precedes "last-handshake" alphabetically.
      # So pat(*"interface":"<name>","last-handshake"*) matches only when that
      # specific peer is connected — if disabled or not yet handshaked, the
      # last-handshake field is absent and the consecutive substring cannot match.
      - name: WG1 (route64-org-ams)
        group: 70-network
        url: "https://api-gw.${DOMAIN}/mikrotik/interface/wireguard/peers"
        interval: 60s
        client: &wg_client
          timeout: 10s
        headers: &wg_headers
          apikey: "$MIKROTIK_PROXY_KEY"
        ui: &wg_ui
          hide-url: true
          hide-hostname: true
          hide-port: true
          hide-errors: false
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 3000"
          - '[BODY] == pat(*"interface":"route64-org-ams","last-handshake"*)'
        alerts: &wg_alert
          - type: discord
            description: "WireGuard tunnel down"
            failure-threshold: 3
            success-threshold: 2
            send-on-resolved: true

      - name: WG2 (18110-wg)
        group: 70-network
        url: "https://api-gw.${DOMAIN}/mikrotik/interface/wireguard/peers"
        interval: 60s
        client: *wg_client
        headers: *wg_headers
        ui: *wg_ui
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 3000"
          - '[BODY] == pat(*"interface":"18110-wg-tunnel","last-handshake"*)'
        alerts: *wg_alert

      - name: WG3 (3221-v3-wg)
        group: 70-network
        url: "https://api-gw.${DOMAIN}/mikrotik/interface/wireguard/peers"
        interval: 60s
        client: *wg_client
        headers: *wg_headers
        ui: *wg_ui
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 3000"
          - '[BODY] == pat(*"interface":"3221-v3-wg-tunnel","last-handshake"*)'
        alerts: *wg_alert
