# Gatus health checks are grouped by the repository architecture.
# 00-edge synthetic checks; 10-platform Kubernetes capabilities;
# 20-infra operations; 30-services shared services;
# 40-workloads applications; 50-compute-synology NAS-only checks.
# Managed public hosts: automation/infra-as-code/terraform/deployments/tunnel.tf
# Ownership/coverage validation: scripts/validate-public-routes.py
# Ingress overview: docs/networking/ingress-overview.md
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: gatus
data:
  00-base.yaml: |
    storage:
      type: sqlite
      path: /data/data.db

    web:
      address: 0.0.0.0
      port: 8080

    ui:
      title: "Homelab Status"
      header: "Homelab Status"
      description: "Health checks grouped by platform, infra, services and workloads"
      dashboard-heading: "Homelab Status"
      dashboard-subheading: "Public ingress and internal checks grouped by architecture"
      dark-mode: true
      default-sort-by: group
      buttons:
        - name: "Homepage"
          link: "https://homepage.${DOMAIN}"
        - name: "Grafana"
          link: "https://grafana.${DOMAIN}"

    metrics: true

    connectivity:
      checker:
        target: 1.1.1.1:53
        interval: 60s

    alerting:
      discord:
        webhook-url: "$DISCORD_WEBHOOK_URL"
        title: "Homelab Gatus"

  10-edge.yaml: |
    # 00-edge | 1 synthetic check
    endpoints:
          - name: cloudflare-domain
            group: 00-edge
            url: "https://homepage.${DOMAIN}/"
            interval: 5m
            client: &cloudflare_client
              timeout: 10s
              dns-resolver: "tcp://1.1.1.1:53"
            ui: &safe_public_ui
              hide-url: true
              hide-hostname: true
              hide-port: true
              hide-errors: false
            conditions:
              - "[STATUS] < 500"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[DOMAIN_EXPIRATION] > 720h"
              - "[RESPONSE_TIME] < 2000"
            alerts: &discord_alert
              - type: discord
                description: "Public edge check failed"
                failure-threshold: 3
                success-threshold: 2
                send-on-resolved: true

  20-platform.yaml: |
    # 10-platform | 3 checks
    endpoints:
          - name: grafana-api-health
            group: 10-platform
            url: "https://grafana.${DOMAIN}/api/health"
            interval: 60s
            client: &cloudflare_client
              timeout: 10s
              dns-resolver: "tcp://1.1.1.1:53"
            ui: &safe_public_ui
              hide-url: true
              hide-hostname: true
              hide-port: true
              hide-errors: false
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2000"
              - "[BODY].database == ok"
            alerts: &discord_alert
              - type: discord
                description: "Platform check failed"
                failure-threshold: 3
                success-threshold: 2
                send-on-resolved: true

          - name: gatus
            group: 10-platform
            url: "https://gatus.${DOMAIN}/health"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 1500"
            alerts: *discord_alert

          - name: longhorn-ui
            group: 10-platform
            url: "https://storage.${DOMAIN}/ping"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 3000"
              - "[BODY] == pat(*OK*)"
            alerts: *discord_alert

  30-infra.yaml: |
    # 20-infra | 5 checks
    endpoints:
          - name: headlamp
            group: 20-infra
            url: "https://headlamp.${DOMAIN}/"
            interval: 60s
            client: &cloudflare_client
              timeout: 10s
              dns-resolver: "tcp://1.1.1.1:53"
            ui: &safe_public_ui
              hide-url: true
              hide-hostname: true
              hide-port: true
              hide-errors: false
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY] == pat(*Headlamp*)"
            alerts: &discord_alert
              - type: discord
                description: "Infrastructure check failed"
                failure-threshold: 3
                success-threshold: 2
                send-on-resolved: true

          - name: argocd-version
            group: 20-infra
            url: "https://argocd.${DOMAIN}/api/version"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "has([BODY].Version) == true"
            alerts: *discord_alert

          - name: vault-sys-health
            group: 20-infra
            url: "https://vault.${DOMAIN}/v1/sys/health"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == any(200, 429, 472, 473)"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2000"
              - "[BODY].initialized == true"
              - "[BODY].sealed == false"
            alerts: *discord_alert

          - name: semaphore-ui
            group: 20-infra
            url: "https://semaphoreui.${DOMAIN}/"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY] == pat(*Semaphore*)"
            alerts: *discord_alert

          - name: portainer-status
            group: 20-infra
            url: "https://portainer.${DOMAIN}/api/status"
            interval: 60s
            client: *cloudflare_client
            headers:
              x-api-key: "$PORTAINER_MONITOR_TOKEN"
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 3000"
              - "has([BODY].Version) == true"
            alerts: *discord_alert

  40-services.yaml: |
    # 30-services | 3 checks
    endpoints:
          # Authentik is the OIDC provider used by SSO applications.
          - name: authentik
            group: 30-services
            url: "https://auth.${DOMAIN}/-/health/live/"
            interval: 60s
            client: &cloudflare_client
              timeout: 10s
              dns-resolver: "tcp://1.1.1.1:53"
            ui: &safe_public_ui
              hide-url: true
              hide-hostname: true
              hide-port: true
              hide-errors: false
            conditions:
              - "[STATUS] == any(200, 204)"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
            alerts: &discord_alert
              - type: discord
                description: "Shared service check failed"
                failure-threshold: 3
                success-threshold: 2
                send-on-resolved: true

          - name: llm-gateway
            group: 30-services
            url: "https://llm-gw.${DOMAIN}/v1/models"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 401"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 3000"
              - "[BODY].message == pat(*API key*)"
            alerts: *discord_alert

          # Kong MCP gateway health route (static response, no auth).

          - name: mcp-gateway
            group: 30-services
            url: "https://mcp-gw.${DOMAIN}/healthz"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 3000"
              - "[BODY].status == ok"
            alerts: *discord_alert

  50-workloads.yaml: |
    # 40-workloads | 8 checks
    endpoints:
          - name: openwebui
            group: 40-workloads
            url: "https://openwebui.${DOMAIN}/"
            interval: 60s
            client: &cloudflare_client
              timeout: 10s
              dns-resolver: "tcp://1.1.1.1:53"
            ui: &safe_public_ui
              hide-url: true
              hide-hostname: true
              hide-port: true
              hide-errors: false
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 3000"
              - "[BODY] == pat(*Open WebUI*)"
            alerts: &discord_alert
              - type: discord
                description: "Workload check failed"
                failure-threshold: 3
                success-threshold: 2
                send-on-resolved: true

          # Kong LLM gateway. An unauthenticated request must be rejected: 401 proves the route is up and key auth is enforced.

          - name: homepage
            group: 40-workloads
            url: "https://homepage.${DOMAIN}/api/healthcheck"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2000"
            alerts: *discord_alert

          - name: oasm
            group: 40-workloads
            url: "https://oasm.${DOMAIN}/"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == any(200, 302)"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 3000"
            alerts: *discord_alert

          - name: homebox
            group: 40-workloads
            url: "https://homebox.${DOMAIN}/"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY] == pat(*homebox-frontend*)"
            alerts: *discord_alert

          - name: vaultwarden
            group: 40-workloads
            url: "https://stargate.${DOMAIN}/"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2000"
              - "[BODY] == pat(*app-root*)"
            alerts: *discord_alert

          - name: forgejo
            group: 40-workloads
            url: "https://forgejo.${DOMAIN}/"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY] == pat(*Forgejo*)"
            alerts: *discord_alert

          - name: linkding
            group: 40-workloads
            url: "https://bookmarks.${DOMAIN}/"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY] == pat(*Linkding*)"
            alerts: *discord_alert

          - name: n8n
            group: 40-workloads
            url: "https://n8n.${DOMAIN}/healthz"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
            alerts: *discord_alert

          - name: termix
            group: 40-workloads
            url: "https://termix.${DOMAIN}/"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY] == pat(*Termix*)"
            alerts: *discord_alert

  55-workloads-firewall-manager.yaml: |
    # 40-workloads | 3 checks
    endpoints:
          - name: firewall-manager-dev
            group: 40-workloads
            url: "https://fm-dev.${DOMAIN}/api/setup/status"
            interval: 60s
            client: &cloudflare_client
              timeout: 10s
              dns-resolver: "tcp://1.1.1.1:53"
            ui: &safe_public_ui
              hide-url: true
              hide-hostname: true
              hide-port: true
              hide-errors: false
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY].database_accessible == true"
              - "[BODY].initialized == true"
            alerts: &discord_alert
              - type: discord
                description: "Firewall Manager check failed"
                failure-threshold: 3
                success-threshold: 2
                send-on-resolved: true

          - name: firewall-manager-staging
            group: 40-workloads
            url: "https://fm-staging.${DOMAIN}/api/setup/status"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY].database_accessible == true"
              - "[BODY].initialized == true"
            alerts: *discord_alert

          # Add "[BODY].initialized == true" once the first-run setup wizard of this environment is completed.

          - name: firewall-manager-prod
            group: 40-workloads
            url: "https://fm-prod.${DOMAIN}/api/setup/status"
            interval: 60s
            client: *cloudflare_client
            ui: *safe_public_ui
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 168h"
              - "[RESPONSE_TIME] < 2500"
              - "[BODY].database_accessible == true"
            alerts: *discord_alert

  60-compute-synology.yaml: |
    # 50-compute-synology | 1 disabled check
    endpoints:
      # GitLab disabled until published as a managed route.
      - name: gitlab-synology
        group: 50-compute-synology
        enabled: false
        url: "https://gitlab.${DOMAIN}/users/sign_in"
        interval: 2m
        client:
          timeout: 10s
          dns-resolver: "tcp://1.1.1.1:53"
        headers:
          PRIVATE-TOKEN: "$GITLAB_MONITOR_TOKEN"
        ui:
          hide-url: true
          hide-hostname: true
          hide-port: true
          hide-errors: false
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 168h"
          - "[RESPONSE_TIME] < 3000"
          - "[BODY] == pat(*GitLab*)"

  70-services-network.yaml: |
    # 30-services | 3 checks
    endpoints:
      # Internal WireGuard peer checks via Kong api-gw; not public routes.
      - name: WG1 (route64-org-ams)
        group: 30-services
        url: "https://api-gw.${DOMAIN}/mikrotik/interface/wireguard/peers"
        interval: 60s
        client: &wg_client
          timeout: 10s
        headers: &wg_headers
          apikey: "$MIKROTIK_PROXY_KEY"
        ui: &wg_ui
          hide-url: true
          hide-hostname: true
          hide-port: true
          hide-errors: false
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 3000"
          - '[BODY] == pat(*"interface":"route64-org-ams","last-handshake"*)'
        alerts: &wg_alert
          - type: discord
            description: "WireGuard tunnel down"
            failure-threshold: 3
            success-threshold: 2
            send-on-resolved: true

      - name: WG2 (18110-wg)
        group: 30-services
        url: "https://api-gw.${DOMAIN}/mikrotik/interface/wireguard/peers"
        interval: 60s
        client: *wg_client
        headers: *wg_headers
        ui: *wg_ui
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 3000"
          - '[BODY] == pat(*"interface":"18110-wg-tunnel","last-handshake"*)'
        alerts: *wg_alert

      - name: WG3 (3221-v3-wg)
        group: 30-services
        url: "https://api-gw.${DOMAIN}/mikrotik/interface/wireguard/peers"
        interval: 60s
        client: *wg_client
        headers: *wg_headers
        ui: *wg_ui
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 3000"
          - '[BODY] == pat(*"interface":"3221-v3-wg-tunnel","last-handshake"*)'
        alerts: *wg_alert
