apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - mikrotik-externalsecret.yaml
  - mikrotik-service-endpointslice.yaml
  # mikrotik-kong-consumer.yaml is intentionally excluded from this path.
  # KongConsumer references Secret "mikrotik-proxy-key-auth" which is created by
  # the ExternalSecret above. Kong's admission webhook rejects the consumer at
  # dry-run time if the Secret does not yet exist (e.g. fresh namespace).
  # The consumer is managed by monitoring-kong-consumers Flux Kustomization which
  # depends on monitoring (with healthCheck on the ExternalSecret) to ensure the
  # Secret exists before the KongConsumer is applied.
  - mikrotik-kong-plugins.yaml
  - mikrotik-kong-plugin-request-transformer.yaml
  - mikrotik-ingress.yaml
