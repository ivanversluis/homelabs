apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - namespace.yaml
  - observability-netpol.yaml
  # Prometheus
  - prometheus/rbac.yaml
  - prometheus/deployment.yaml
  - prometheus/service.yaml
  # Loki
  - loki/statefulset.yaml
  - loki/service.yaml
  # Promtail
  - promtail/configmap.yaml
  - promtail/daemonset.yaml
  - promtail/rbac.yaml
  # Grafana
  - grafana/configmap.yaml
  - grafana/datasources-configmap.yaml
  - grafana/dashboards-provider-configmap.yaml
  - grafana/alerting-contact-points-configmap.yaml
  - grafana/alerting-notification-policies-configmap.yaml
  - grafana/alerting-rules-time-sync-configmap.yaml
  - grafana/alerting-rules-node-resources-configmap.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml
  # Vault integration
  - vault/external-secret.yaml
  - vault/grafana-admin-external-secret.yaml
  - vault/grafana-alerting-externalsecret.yaml
  - vault/grafana-oidc-externalsecret.yaml
  # DNS ServiceMonitors
  - dns/coredns-servicemonitor.yaml
  - dns/pihole-servicemonitor.yaml
  - dns/unbound-servicemonitor.yaml

generatorOptions:
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logging

configMapGenerator:
  - name: loki-config
    files:
      - loki.yaml=loki/loki.yaml
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus/prometheus.yml
    options:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: metrics
  - name: prometheus-alerts
    files:
      - prometheus-alerts.yml=prometheus/prometheus-alerts.yml
    options:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: alerts


  # Dashboard JSON stays in source folders; content hashes trigger Grafana rollouts.
  - name: grafana-dashboard-coredns
    files:
      - coredns.json=grafana/dashboards/dns/coredns.json
    options:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: dashboard
        grafana_dashboard: "true"
  - name: grafana-dashboard-dns-overview
    files:
      - dns-overview.json=grafana/dashboards/dns/dns-overview.json
    options:
