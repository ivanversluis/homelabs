apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cdi-namespace.yaml
  # cdi-netpol.yaml intentionally NOT applied:
  # cdi is excluded from the GlobalNetworkPolicy default-deny.
  # Operator needs unrestricted access (API server, HTTPS for image imports,
  # admission webhooks, inter-component communication).
  - cdi-cr.yaml
