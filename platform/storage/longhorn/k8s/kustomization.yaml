apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Longhorn v1.12.1 manifest, vendored and commit-pinned under vendor/.
  - vendor/longhorn-v1.12.1.yaml
  # longhorn-worker StorageClass: default, reclaimPolicy: Retain
  # Ensures PVs survive PVC/namespace deletion (GitOps-safe).
  - config/longhorn-worker-sc.yaml

patchesStrategicMerge:
  - patches/default-setting.yaml
  - patches/storageclass.yaml
  - patches/manager-v1.12.1.yaml
