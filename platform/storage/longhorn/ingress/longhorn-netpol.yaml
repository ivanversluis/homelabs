# longhorn-system is excluded from the global default-deny, so these policies
# isolate only the UI and oauth2-proxy pods: Kong -> oauth2-proxy -> longhorn-ui.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-ui-allow-oauth2-proxy
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-ui
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: longhorn-oauth2-proxy
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-oauth2-proxy-allow-kong
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-oauth2-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kong
      ports:
        - protocol: TCP
          port: 4180
