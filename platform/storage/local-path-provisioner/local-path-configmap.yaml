---
# local-path-provisioner configuration.
# Volumes are created under /var/lib/k8s-storage on the node (matches the
# path actually used on k8s-worker03 since 2026-05 — do not change without
# migrating existing PV data, see debian-bookworm-dv PVC).
# Since the provisioner Deployment is pinned to k8s-worker03 (nodeSelector),
# ALL dynamically provisioned PVCs from the local-path-vms StorageClass
# will land on k8s-worker03.
#
# The directory /var/lib/k8s-storage must exist on k8s-worker03 before
# VMs can be provisioned.
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/var/lib/k8s-storage"]
        }
      ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
      - name: helper-pod
        image: docker.io/busybox:stable
        imagePullPolicy: IfNotPresent
