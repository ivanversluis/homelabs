apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homebox-oidc
  namespace: homebox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: homebox-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: apps/homebox
        property: oidc-client-id
    - secretKey: client-secret
      remoteRef:
        key: apps/homebox
        property: oidc-client-secret
