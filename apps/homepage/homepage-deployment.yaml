apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      enableServiceLinks: false
      nodeSelector:
        node.longhorn.io/create-default-disk: "true"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: copy-config
          image: busybox:1.36
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          command:
            - sh
            - -c
            - |
              set -e
              echo "Copying config files from ConfigMap to writable PVC..."
              for f in /config-src/*.yaml; do
                name=$(basename "$f")
                if [ ! -f "/app/config/$name" ]; then
                  cp "$f" "/app/config/$name"
                  echo "  Copied $name"
                else
                  echo "  Skipped $name (already exists)"
                fi
              done
              mkdir -p /app/config/logs
              echo "Done."
          volumeMounts:
            - name: config-src
              mountPath: /config-src
              readOnly: true
            - name: config-data
              mountPath: /app/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.13
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "homepage.${DOMAIN}"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: HOMEPAGE_VAR_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: homepage-oidc
                  key: client-id
            - name: HOMEPAGE_VAR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homepage-oidc
                  key: client-secret
          volumeMounts:
            - name: config-data
              mountPath: /app/config
            - name: cache
              mountPath: /app/.next/cache
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config-src
          configMap:
            name: homepage-config
        - name: config-data
          persistentVolumeClaim:
            claimName: homepage-pvc
        - name: cache
          emptyDir: {}
