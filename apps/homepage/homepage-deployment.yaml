apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      initContainers:
        - name: seed-config
          image: busybox:1.38
          command:
            - sh
            - -c
            - cp /config-source/* /app/config/
          volumeMounts:
            - name: homepage-config-source
              mountPath: /config-source
            - name: config
              mountPath: /app/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "homepage.${DOMAIN}"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: HOMEPAGE_VAR_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: homepage-oidc
                  key: client-id
            - name: HOMEPAGE_VAR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homepage-oidc
                  key: client-secret
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: cache
              mountPath: /app/.next/cache
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: homepage-config-source
          configMap:
            name: homepage-config
        - name: config
          emptyDir: {}
        - name: cache
          emptyDir: {}
