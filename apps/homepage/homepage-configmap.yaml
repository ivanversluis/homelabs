apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab Dashboard
    startUrl: /
    headerStyle: underlined
    theme: dark
    color: slate
    target: _blank
    auth:
      provider: oidc
      oidc:
        name: Authentik
        issuerURL: "https://auth.${DOMAIN}/application/o/homepage/"
        clientId: "{{HOMEPAGE_VAR_CLIENT_ID}}"
        clientSecret: "{{HOMEPAGE_VAR_CLIENT_SECRET}}"
        redirectURL: "https://home.${DOMAIN}/api/oidc/callback"
        scopes:
          - openid
          - profile
          - email

  services.yaml: |
    - AI:
        - Open WebUI:
            href: "https://ai-chat.${DOMAIN}"
            description: LLM Chat Interface
            icon: openai.png
            ping: "https://ai-chat.${DOMAIN}/health"
        - AI Gateway:
            href: "https://ai.${DOMAIN}/v1/models"
            description: Kong AI Proxy (Azure OpenAI)
            icon: kong.png

    - Development:
        - Forgejo:
            href: "https://git.${DOMAIN}"
            description: Self-hosted Git
            icon: gitea.png
        - N8N:
            href: "https://n8n.${DOMAIN}"
            description: Workflow Automation
            icon: n8n.png
        - Semaphore:
            href: "https://semaphore.${DOMAIN}"
            description: Ansible / Terraform UI
            icon: semaphore-ui.png

    - Infrastructure:
        - Headlamp:
            href: "https://k8s.${DOMAIN}"
            description: Kubernetes Dashboard
            icon: kubernetes.png
        - Authentik:
            href: "https://auth.${DOMAIN}"
            description: Identity Provider
            icon: authentik.png
        - Vault:
            href: "https://vault.${DOMAIN}"
            description: Secrets Manager
            icon: hashicorp-vault.png
        - Grafana:
            href: "https://grafana.${DOMAIN}"
            description: Observability
            icon: grafana.png
        - Portainer:
            href: "https://portainer.${DOMAIN}"
            description: Container Management
            icon: portainer.png
        - ArgoCD:
            href: "https://argocd.${DOMAIN}"
            description: GitOps Deployment
            icon: argocd.png

    - Homelab:
        - Linkding:
            href: "https://links.${DOMAIN}"
            description: Bookmark Manager
            icon: linkding.png
        - Homebox:
            href: "https://homebox.${DOMAIN}"
            description: Inventory Management
            icon: homebox.png
        - Termix:
            href: "https://terminal.${DOMAIN}"
            description: Web Terminal
            icon: terminal.png
        - Pi-hole:
            href: "https://pihole.${DOMAIN}"
            description: DNS Ad-Blocker
            icon: pi-hole.png

  widgets.yaml: |
    - greeting:
        text: "Homelab"

    - search:
        provider: duckduckgo
        target: _blank

    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: short
          hour12: false

  bookmarks.yaml: |
    []

  docker.yaml: |
    []

  kubernetes.yaml: |
    mode: default
