apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-oidc
  namespace: n8n
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: n8n-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: apps/n8n
        property: OAUTH_CLIENT_ID
    - secretKey: client-secret
      remoteRef:
        key: apps/n8n
        property: OAUTH_CLIENT_SECRET
