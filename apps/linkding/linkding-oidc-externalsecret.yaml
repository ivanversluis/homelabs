apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkding-oidc
  namespace: linkding
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: linkding-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: apps/linkding
        property: OAUTH_CLIENT_ID
    - secretKey: client-secret
      remoteRef:
        key: apps/linkding
        property: OAUTH_CLIENT_SECRET
