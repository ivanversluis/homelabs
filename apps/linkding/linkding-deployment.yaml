apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
  namespace: linkding
  labels:
    app: linkding
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      nodeSelector:
        node.longhorn.io/create-default-disk: "true"
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.45.0-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              name: http
          env:
            - name: LD_DISABLE_BACKGROUND_TASKS
              value: "False"
            # OIDC via Authentik
            - name: LD_ENABLE_OIDC
              value: "True"
            - name: OIDC_OP_AUTHORIZATION_ENDPOINT
              value: "https://auth.${DOMAIN}/application/o/authorize/"
            - name: OIDC_OP_TOKEN_ENDPOINT
              value: "https://auth.${DOMAIN}/application/o/token/"
            - name: OIDC_OP_USER_ENDPOINT
              value: "https://auth.${DOMAIN}/application/o/userinfo/"
            - name: OIDC_OP_JWKS_ENDPOINT
              value: "https://auth.${DOMAIN}/application/o/linkding/jwks/"
            - name: OIDC_RP_SCOPES
              value: "openid email profile"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: linkding-oidc
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: linkding-oidc
                  key: client-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/data
      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-pvc