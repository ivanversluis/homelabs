---
# Allow DNS resolution to CoreDNS in kube-system.
# Required because allow-same-namespace restricts egress to within the namespace.
# Once global/01-allow-dns.yaml (Calico GlobalNetworkPolicy) is enabled this
# is superseded at the Calico layer, but keeping it here makes the namespace
# policy self-contained regardless of the global rollout phase.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: linkding
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Linkding is fully isolated: only Cloudflare Tunnel may reach it.
# It needs no cross-namespace egress (no DB, no external API calls).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: linkding
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
# Cloudflare Tunnel -> linkding UI
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tunnel-ingress
  namespace: linkding
spec:
  podSelector:
    matchLabels:
      app: linkding
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
      ports:
        - protocol: TCP
          port: 9090
---
# Allow Prometheus (observability namespace) to scrape linkding for metrics.
# Safe to keep enabled even before observability policies are rolled out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: linkding
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
