apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: firewall-manager-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  
  target:
    name: postgres-credentials
    creationPolicy: Owner
  
  data:
    - secretKey: username
      remoteRef:
        key: firewall-manager/dev/postgres
        property: username
    
    - secretKey: password
      remoteRef:
        key: firewall-manager/dev/postgres
        property: password
    
    - secretKey: database
      remoteRef:
        key: firewall-manager/dev/postgres
        property: database
