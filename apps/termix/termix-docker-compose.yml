services:
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    hostname: termix
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - termix-data:/app/data
    # env_file:
    #   - .env

volumes:
  termix-data:
    driver: local

networks:
  vlan200:
    external: true
