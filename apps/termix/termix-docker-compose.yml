services:
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    hostname: termix
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /volume1/containers/termix/:/app/data
    networks:
      - vlan200
    environment:
      PORT: "3000"
    # env_file:
    #   - .env
    
networks:
  vlan200:
    external: true
