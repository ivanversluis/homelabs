apiVersion: apps/v1
kind: Deployment
metadata:
  name: termix
  namespace: termix
  labels:
    app: termix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: termix
  template:
    metadata:
      labels:
        app: termix
    spec:
      containers:
        - name: termix
          image: ghcr.io/lukegus/termix:release-2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: TZ
              value: 'Europe/Amsterdam'
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: termix-oidc
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: termix-oidc
                  key: client-secret
            - name: OIDC_ISSUER_URL
              value: "https://auth.${DOMAIN}/application/o/termix/"
            - name: OIDC_AUTHORIZATION_URL
              value: "https://auth.${DOMAIN}/application/o/authorize/"
            - name: OIDC_TOKEN_URL
              value: "https://auth.${DOMAIN}/application/o/token/"
            - name: OIDC_USERINFO_URL
              value: "https://auth.${DOMAIN}/application/o/userinfo/"
            - name: OIDC_FORCE_HTTPS
              value: "true"
            - name: OIDC_ALLOW_REGISTRATION
              value: "true"
            - name: OIDC_SCOPES
              value: "openid email profile"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: termix-data
              mountPath: /app/data
      volumes:
        - name: termix-data
          persistentVolumeClaim:
            claimName: termix-pvc