---
# Flux Kustomization: Kong Ingress rules for the identity namespace.
# Separate from the main services/identity path so ${DOMAIN} can be substituted.
# Depends on: kong (IngressClass + wildcard cert SNI registration must be ready).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-ingress
  namespace: flux-system
spec:
  interval: 10m
  path: ./services/identity/kong-ingress
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kong
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
