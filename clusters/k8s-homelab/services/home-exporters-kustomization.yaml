---
# Flux Kustomization for home telemetry exporters.
# Wave 3 classifies these exporters as shared telemetry services.
# Separate reconciliation is retained because goodwe-prometheus-exporter-networkpolicy.yaml
# requires postBuild substitution for ${GOODWE_INVERTER_CIDR}.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-exporters
  namespace: flux-system
spec:
  interval: 10m
  path: ./services/telemetry/home-exporters
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
