apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # authentik, longhorn, cloudflare-tunnel, pihole, unbound are managed exclusively
  # by dedicated Flux Kustomizations below (force: false) so a forced re-apply on
  # the root flux-system Kustomization (force: true) can no longer delete+recreate
  # their PVCs (authentik-db-pvc, pihole-pvc) and silently wipe data.
  - authentik-kustomization.yaml
  - longhorn-kustomization.yaml
  - cloudflare-tunnel-kustomization.yaml
  - pihole-kustomization.yaml
  - unbound-kustomization.yaml