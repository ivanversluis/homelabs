apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Stateful/shared services retain dedicated Flux reconciliation boundaries
  # so the force-enabled root Kustomization cannot delete and recreate PVCs.
  - authentik-kustomization.yaml
  - cloudflare-tunnel-kustomization.yaml
  - pihole-kustomization.yaml
  - unbound-kustomization.yaml
  - kong-bootstrap-kustomization.yaml
  - kong-kustomization.yaml
  - identity-ingress-kustomization.yaml
  - home-exporters-kustomization.yaml
