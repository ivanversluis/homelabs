---
# Flux Kustomization for Pi-hole DNS.
# Split out of the flat services/ aggregator (applied by the root flux-system
# Kustomization, which has force: true) so a forced re-apply can no longer
# delete+recreate pihole-pvc and silently wipe its data.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pihole
  namespace: flux-system
spec:
  interval: 10m
  path: ./services/dns/pihole/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
