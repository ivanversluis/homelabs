apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kong-routeros-bootstrap
  namespace: flux-system
spec:
  interval: 10m
  path: ./services/gateway/kong/api-gateway/routeros-upstream/bootstrap
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kong
    - name: monitoring
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: mikrotik-api-creds
      namespace: monitoring
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: mikrotik-proxy-key-auth
      namespace: monitoring
