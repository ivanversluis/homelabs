---
# Flux Kustomization for Kong Gateway (Helm + KongPlugin CRDs + Ingresses).
# Wave 3 classifies Kong as a shared runtime gateway service.
# Depends on: cert-manager-config (ClusterIssuers + wildcard cert must be ready)
# and flux-domain-vars Secret.
# The postBuild substituteFrom replaces ${DOMAIN}, ${KONG_LB_IP} in manifests.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kong
  namespace: flux-system
spec:
  interval: 10m
  path: ./services/gateway/kong
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cert-manager-config
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
