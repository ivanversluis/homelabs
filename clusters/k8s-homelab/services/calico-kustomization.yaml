---
# Flux Kustomization for the Tigera operator and Calico Installation.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: calico
  namespace: flux-system
spec:
  interval: 10m
  path: ./services/network/calico/k8s
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
