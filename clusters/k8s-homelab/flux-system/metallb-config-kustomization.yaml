apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  wait: true
  timeout: 5m
  path: ./services/lb/metallb-config/k8s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: metallb-install
