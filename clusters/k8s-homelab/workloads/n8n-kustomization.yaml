---
# Flux Kustomization for n8n workflow automation.
# n8n remains isolated from the root flux-system inventory so a forced re-apply
# cannot delete+recreate n8n-pvc / n8n-postgres-pvc and silently wipe data.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: n8n
  namespace: flux-system
spec:
  interval: 10m
  path: ./workloads/apps/n8n
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
