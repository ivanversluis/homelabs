---
# Authenticated Longhorn UI at storage.${DOMAIN} (Kong -> oauth2-proxy -> Longhorn).
# Separate from the longhorn boundary because oauth2-proxy needs ${DOMAIN} substitution and Kong.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-ingress
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  prune: true
  wait: true
  timeout: 5m
  path: ./platform/storage/longhorn/oauth2-proxy
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: longhorn
    - name: kong
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
