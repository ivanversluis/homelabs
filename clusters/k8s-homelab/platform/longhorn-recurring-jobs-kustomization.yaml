---
# RecurringJobs are validated by the Longhorn admission webhook, so they live in a
# separate boundary that only reconciles after the longhorn Kustomization is ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-recurring-jobs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  prune: true
  wait: true
  timeout: 5m
  path: ./platform/storage/longhorn/recurring-jobs
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: longhorn
