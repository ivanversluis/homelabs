---
# Flux Kustomization for the observability namespace (Prometheus/Grafana/Loki).
# Separate from the root platform path so ${DOMAIN} in Grafana OIDC env vars
# is substituted by Flux before Kubernetes applies the manifest — preventing
# Kubernetes' own env-var expansion from resolving ${DOMAIN} to empty string.
# Depends on: kong (Grafana OIDC redirect goes through Kong → Authentik).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/observability
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kong
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
