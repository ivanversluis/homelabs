apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: firewall-manager-environments
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: dev
            branch: main
            namespace: firewall-manager-dev
            replicas: "1"
            dbReplicas: "1"
          - env: staging
            branch: main
            namespace: firewall-manager-staging
            replicas: "1"
            dbReplicas: "1"
          - env: prod
            branch: main
            namespace: firewall-manager-prod
            replicas: "1"
            dbReplicas: "1"
  template:
    metadata:
      name: "firewall-manager-{{.env}}"
      annotations:
        argocd-image-updater.argoproj.io/image-list: |
          api=ghcr.io/ivanversluis/firewall-manager-api,
          webui=ghcr.io/ivanversluis/firewall-manager-webui,
          worker=ghcr.io/ivanversluis/firewall-manager-worker
        argocd-image-updater.argoproj.io/api.update-strategy: semver
        argocd-image-updater.argoproj.io/webui.update-strategy: semver
        argocd-image-updater.argoproj.io/worker.update-strategy: semver
        argocd-image-updater.argoproj.io/api.allow-tags: 'regexp:^v[0-9]+\.[0-9]+\.[0-9]+$'
        argocd-image-updater.argoproj.io/webui.allow-tags: 'regexp:^v[0-9]+\.[0-9]+\.[0-9]+$'
        argocd-image-updater.argoproj.io/worker.allow-tags: 'regexp:^v[0-9]+\.[0-9]+\.[0-9]+$'
        argocd-image-updater.argoproj.io/write-back-method: git
        argocd-image-updater.argoproj.io/git-branch: "main"
    spec:
      project: default
      source:
        repoURL: https://github.com/ivanversluis/homelabs.git
        targetRevision: main
        path: apps/firewall-manager/overlays/{{.env}}
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
