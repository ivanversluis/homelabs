---
# Flux Kustomization for Homepage dashboard.
# Depends on: kong (IngressClass + wildcard cert must be ready) and flux-domain-vars Secret.
# The postBuild substituteFrom replaces ${DOMAIN} in manifests and ConfigMap data.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/homepage
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kong
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
