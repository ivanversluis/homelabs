apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../apps/
  # Flux Kustomization CRDs for apps that use postBuild.substituteFrom
  # (homepage, homebox) — managed separately so ${DOMAIN} is substituted.
  - homepage-kustomization.yaml
  - homebox-kustomization.yaml
  # VM workloads — depends on kubevirt + cdi Flux Kustomizations
  - vms-kustomization.yaml