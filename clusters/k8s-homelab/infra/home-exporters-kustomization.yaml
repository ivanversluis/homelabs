---
# Flux Kustomization for home-exporters (daikin + goodwe prometheus exporters).
# Separate from the main infra path because goodwe-prometheus-exporter-networkpolicy.yaml
# requires postBuild substitution for ${GOODWE_INVERTER_CIDR}.
# Daikin does not need substitution but is co-located in the same namespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-exporters
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/home-exporters
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
