---
# Flux Kustomization for Kong Gateway (Helm + KongPlugin CRDs + Ingresses).
# Depends on: cert-manager (wildcard cert must exist) and flux-domain-vars Secret.
# The postBuild substituteFrom replaces ${DOMAIN}, ${KONG_LB_IP} in manifests.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kong
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/kong
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cert-manager
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
