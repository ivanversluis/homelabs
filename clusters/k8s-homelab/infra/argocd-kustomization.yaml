---
# Flux Kustomization for ArgoCD.
# Separate from the main infra path because helmrelease.yaml uses ${DOMAIN}
# in the OIDC issuer URL and server configuration.
# Depends on: kong (ArgoCD ingress + OIDC callback routes through Kong).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argocd
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/argocd
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kong
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
