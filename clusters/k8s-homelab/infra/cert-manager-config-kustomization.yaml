---
# Flux Kustomization for cert-manager ClusterIssuers + Cloudflare token ExternalSecret.
# These resources require the cert-manager webhook to be running.
# dependsOn cert-manager ensures the HelmRelease healthCheck has passed first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/cert-manager-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cert-manager
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
