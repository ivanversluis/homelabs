---
# Flux Kustomization for the AI namespace (Open WebUI + kubernetes-mcpo).
# Depends on: kong (KongPlugin/Consumer CRDs applied first) and flux-domain-vars Secret.
# The postBuild substituteFrom replaces ${DOMAIN} in manifests.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ai
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/ai
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kong
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
