apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../infra
  # Flux Kustomization CRDs for components that use postBuild.substituteFrom
  # (cert-manager, kong, ai, observability) — managed separately from the main infra path.
  - cert-manager-kustomization.yaml
  - cert-manager-config-kustomization.yaml
  - kong-kustomization.yaml
  - observability-kustomization.yaml
  - ai-kustomization.yaml
  # Identity ingress has ${DOMAIN} — needs its own postBuild Kustomization
  - identity-ingress-kustomization.yaml
  # CoreDNS split-brain DNS — managed declaratively, replaces deploy-03-coredns.sh
  - coredns-kustomization.yaml
  # KubeVirt virtualization stack (operators bootstrapped via scripts/deploy-kubevirt-local.sh)
  - kubevirt-kustomization.yaml
  - cdi-kustomization.yaml
  # home-exporters (daikin + goodwe) — postBuild needed for ${GOODWE_INVERTER_CIDR}
  - home-exporters-kustomization.yaml
  # monitoring (kps, metrics-server, gatus, mikrotik-proxy) — postBuild needed for ${DOMAIN}, ${MIKROTIK_IP}
  - monitoring-kustomization.yaml
  # ArgoCD — postBuild needed for ${DOMAIN} in HelmRelease OIDC config
  - argocd-kustomization.yaml
  # SemaphoreUI — postBuild needed for ${DOMAIN} in HelmRelease OIDC config
  - semaphoreui-kustomization.yaml