---
# Flux Kustomization for OpenClaw.
# Split out of the flat infra/ aggregator (applied by the root flux-system
# Kustomization, which has force: true) so a forced re-apply can no longer
# delete+recreate openclaw-data and silently wipe data.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/openclaw
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
