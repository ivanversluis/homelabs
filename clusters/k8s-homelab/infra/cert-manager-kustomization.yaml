---
# Flux Kustomization for cert-manager.
# Depends on: flux-substitution Secret (flux-domain-vars) being present in flux-system.
# The postBuild substituteFrom replaces ${DOMAIN} and ${ACME_EMAIL} in manifests.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/cert-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-domain-vars
