---
# Flux Kustomization for cert-manager.
# Applies namespace + HelmRepository + HelmRelease only.
# The healthChecks block ensures cert-manager pods (including the webhook)
# are Running before this Kustomization reports Ready — which allows
# cert-manager-config to proceed with ClusterIssuers.
# No postBuild needed: infra/cert-manager has no ${VAR} references.
# Variable substitution is on cert-manager-config (ClusterIssuers need ${ACME_EMAIL} / ${DOMAIN}).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/cert-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
