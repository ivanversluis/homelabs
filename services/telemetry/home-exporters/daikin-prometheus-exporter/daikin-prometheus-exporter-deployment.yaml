apiVersion: apps/v1
kind: Deployment
metadata:
  name: daikin-prometheus-exporter
  namespace: home-exporters
  labels:
    app: daikin-prometheus-exporter
    app.kubernetes.io/name: daikin-prometheus-exporter
    app.kubernetes.io/part-of: homelabs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: daikin-prometheus-exporter
  template:
    metadata:
      labels:
        app: daikin-prometheus-exporter
        app.kubernetes.io/name: daikin-prometheus-exporter
    spec:
      enableServiceLinks: false
      nodeSelector:
        node.longhorn.io/create-default-disk: "true"
      initContainers:
        - name: bootstrap-tokens
          image: ghcr.io/ivanversluis/iot-daikin-prometheus-exporter:main
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              if [ -f /data/tokens.json ]; then
                exit 0
              fi
              cp /bootstrap/tokens.json /data/tokens.json
              chmod 600 /data/tokens.json
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: token-bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: token-store
              mountPath: /data
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/ivanversluis/iot-daikin-prometheus-exporter:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: daikin-prometheus-exporter-config
            - secretRef:
                name: daikin-prometheus-exporter-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config-file
              mountPath: /config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: token-store
              mountPath: /data
      volumes:
        - name: config-file
          configMap:
            name: daikin-prometheus-exporter-config-file
        - name: token-bootstrap
          secret:
            secretName: daikin-prometheus-exporter-token-bootstrap
        - name: token-store
          persistentVolumeClaim:
            claimName: daikin-prometheus-exporter-tokens