apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weather-prometheus-exporter-location
  namespace: home-exporters
  labels:
    app.kubernetes.io/name: weather-prometheus-exporter
    app.kubernetes.io/component: location
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: weather-prometheus-exporter-location
    creationPolicy: Owner
  data:
    - secretKey: WEATHER_LATITUDE
      remoteRef:
        key: infra/home-exporters/weather-prometheus-exporter
        property: WEATHER_LATITUDE
    - secretKey: WEATHER_LONGITUDE
      remoteRef:
        key: infra/home-exporters/weather-prometheus-exporter
        property: WEATHER_LONGITUDE
