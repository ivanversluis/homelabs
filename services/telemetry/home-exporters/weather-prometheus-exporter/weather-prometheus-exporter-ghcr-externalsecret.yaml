apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weather-prometheus-exporter-ghcr
  namespace: home-exporters
  labels:
    app.kubernetes.io/name: weather-prometheus-exporter
    app.kubernetes.io/component: registry-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: weather-prometheus-exporter-ghcr
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    # Reuse the registry credentials already consumed by the DNS exporter.
    - secretKey: username
      remoteRef:
        key: infra/argocd
        property: github-registry-firewall-manager_username
    - secretKey: password
      remoteRef:
        key: infra/argocd
        property: github-registry-firewall-manager_token
