apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-prometheus-exporter
  namespace: home-exporters
  labels:
    app: weather-prometheus-exporter
    app.kubernetes.io/name: weather-prometheus-exporter
    app.kubernetes.io/part-of: homelabs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: weather-prometheus-exporter
  template:
    metadata:
      labels:
        app: weather-prometheus-exporter
        app.kubernetes.io/name: weather-prometheus-exporter
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: weather-prometheus-exporter-ghcr
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # Version tag from exporter commit 026a483 with its verified immutable GHCR digest.
          # Kubernetes pulls by digest; retain the tag for human traceability.
          image: ghcr.io/ivanversluis/weather-prometheus-exporter:sha-026a483@sha256:ebbccd049963cf99a037d0534578758a4c12b1b7a8b7f98640bad2c55e428742
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: weather-prometheus-exporter-config
            # Optional private override created out-of-band in home-exporters.
            # Put WEATHER_LATITUDE and WEATHER_LONGITUDE in this Secret.
            # Restart pod after Secret creation or rotation.
            - secretRef:
                name: weather-prometheus-exporter-location
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
