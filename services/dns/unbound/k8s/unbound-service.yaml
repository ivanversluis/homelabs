apiVersion: v1
kind: Service
metadata:
  name: unbound
  namespace: dns
  labels:
    app.kubernetes.io/name: unbound
    app.kubernetes.io/part-of: homelab-dns
spec:
  selector:
    app.kubernetes.io/name: unbound
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
  type: ClusterIP
