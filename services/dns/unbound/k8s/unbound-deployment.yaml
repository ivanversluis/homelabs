apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbound
  namespace: dns
  labels:
    app.kubernetes.io/name: unbound
    app.kubernetes.io/part-of: homelab-dns
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: unbound
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unbound
        app.kubernetes.io/part-of: homelab-dns
    spec:
      dnsPolicy: Default
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: unbound
          image: docker.io/mvance/unbound:1.22.0
          imagePullPolicy: IfNotPresent
          command: ["unbound", "-d", "-c", "/opt/unbound/etc/unbound/unbound.conf"]
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: config
              mountPath: /opt/unbound/etc/unbound/unbound.conf
              subPath: unbound.conf
            - name: socket
              mountPath: /var/run/unbound
        - name: unbound-exporter
          # Temporary: public GHCR mirror of letsencrypt/unbound_exporter v0.6.0
          # TODO: replace with ivanversluis/unbound-exporter once own image is built
          image: ghcr.io/cyb3r-jak3/unbound-exporter:0.6.0
          imagePullPolicy: IfNotPresent
          args:
            - --unbound.host=unix:///var/run/unbound/unbound.ctl
          ports:
            - name: metrics
              containerPort: 9167
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: socket
              mountPath: /var/run/unbound
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: unbound-config
        - name: socket
          emptyDir: {}
