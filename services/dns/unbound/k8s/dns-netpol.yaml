---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Unbound recursive resolver. Ingress only from Pi-hole; egress to internet:53.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: dns
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pihole-ingress
  namespace: dns
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pihole
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Unbound -> DoT upstreams ONLY (TCP/853). No plain DNS (53) allowed.
# Servers must match services/dns/unbound/k8s/unbound-configmap.yaml forward-zone.
# Edge firewall (RouterOS) should also block outbound UDP/TCP 53.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dot-upstreams
  namespace: dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    # DNS4EU unfiltered
    - to:
        - ipBlock:
            cidr: 86.54.11.100/32
        - ipBlock:
            cidr: 86.54.11.200/32
      ports:
        - protocol: TCP
          port: 853
    # Mullvad base / extended
    - to:
        - ipBlock:
            cidr: 194.242.2.4/32
        - ipBlock:
            cidr: 194.242.2.5/32
      ports:
        - protocol: TCP
          port: 853
