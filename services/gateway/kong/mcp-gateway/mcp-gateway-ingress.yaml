apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: mcp-gateway-health
  namespace: kong
plugin: request-termination
config:
  status_code: 200
  content_type: application/json
  body: '{"status":"ok","gateway":"mcp"}'
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-gateway
  namespace: kong
  annotations:
    konghq.com/plugins: mcp-gateway-health
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - mcp-gw.${DOMAIN}
      secretName: kong-tls-wildcard
  rules:
    - host: mcp-gw.${DOMAIN}
      http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: gateway-status
                port:
                  number: 80
