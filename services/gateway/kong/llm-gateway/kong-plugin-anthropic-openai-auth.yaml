# KongPlugin: inject the real Anthropic credential for the OpenAI-compatible
# pass-through route. The client-facing Kong key is authenticated first and is
# never forwarded upstream.
#
# The plugin configuration is generated by External Secrets in kong-bootstrap,
# so no Anthropic credential is committed to Git.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: anthropic-openai-auth
  namespace: kong
  annotations:
    kubernetes.io/description: "Inject Anthropic API credential for OpenAI-compatible pass-through"
plugin: request-transformer
configFrom:
  secretKeyRef:
    name: kong-anthropic-ai-proxy-config
    key: openai-compat-config
