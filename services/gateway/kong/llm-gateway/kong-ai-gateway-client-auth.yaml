---
# Internal client credential for the AI Gateway.
#
# This is NOT the Anthropic key. It authenticates Open WebUI/OpenClaw to Kong.
# The Secret itself is generated by bootstrap/kong-ai-gateway-client-key-externalsecret.yaml
# (a separate, wait:true Kustomization) so it's guaranteed to exist before the
# KongConsumer below is admitted.
apiVersion: configuration.konghq.com/v1
kind: KongConsumer
metadata:
  name: homelab-ai-clients
  namespace: kong
  annotations:
    kubernetes.io/ingress.class: kong
username: homelab-ai-clients
credentials:
  - kong-ai-gateway-client-key
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: ai-gateway-key-auth
  namespace: kong
plugin: key-auth
config:
  key_names:
    - apikey
  key_in_header: true
  hide_credentials: true
