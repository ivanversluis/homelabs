---
# Preprocesses OpenAI-compatible clients before Kong key-auth and AI Proxy:
# 1. Authorization: Bearer <client-key> -> apikey: <client-key>
# 2. normalize client-side model aliases/presets to the Claude model configured
#    in Kong AI Proxy.
#
# One pre-function does both jobs because Kong allows a single instance of a
# plugin type per Route/Service/Consumer combination.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: normalize-model-claude
  namespace: kong
plugin: pre-function
config:
  access:
    - |
      local auth = kong.request.get_header("authorization")
      if auth then
        local key = auth:match("^[Bb]earer%s+(.+)$")
        if key then
          kong.service.request.set_header("apikey", key)
          kong.service.request.clear_header("authorization")
        end
      end

      local raw = kong.request.get_raw_body()
      if raw and raw ~= "" and not raw:find('"model":"claude%-sonnet%-4%-6"') and not raw:find('"model": "claude%-sonnet%-4%-6"') then
        local normalized = raw:gsub('"model"%s*:%s*"[^"]*"', '"model":"claude-sonnet-4-6"', 1)
        if normalized ~= raw then
          kong.service.request.set_raw_body(normalized)
        end
      end
