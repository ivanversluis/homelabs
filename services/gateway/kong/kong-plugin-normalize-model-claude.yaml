---
# Rewrites any client-side model alias/preset to the Anthropic model configured
# in Kong. Open WebUI can send custom preset names; Kong AI Proxy requires the
# request model to match config.model.name.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: normalize-model-claude
  namespace: kong
plugin: pre-function
config:
  access:
    - |
      local raw = kong.request.get_raw_body()
      if raw and raw ~= "" and not raw:find('"model":"claude%-sonnet%-4%-5"') and not raw:find('"model": "claude%-sonnet%-4%-5"') then
        local normalized = raw:gsub('"model"%s*:%s*"[^"]*"', '"model":"claude-sonnet-4-5"', 1)
        if normalized ~= raw then
          kong.service.request.set_raw_body(normalized)
        end
      end
