# ExternalSecret: builds the Kong AI Proxy configuration for Anthropic from Vault.
#
# The real Anthropic API key is never exposed to Open WebUI or OpenClaw. Kong owns
# the upstream credential and injects it as x-api-key when calling Anthropic.
#
# Populate WITHOUT overwriting the existing Azure values:
#   vault kv patch secret/infra/kong \
#     anthropic-api-key='<sk-ant-...>'
#
# The model is intentionally pinned in Git for deterministic client/gateway behavior.
# Change the model in this file, the static /v1/models response, and OpenClaw together.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kong-anthropic-ai-proxy-config
  namespace: kong
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kong-anthropic-ai-proxy-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # KongPlugin configFrom expects the complete plugin configuration as JSON.
        config: |
          {
            "route_type": "llm/v1/chat",
            "auth": {
              "header_name": "x-api-key",
              "header_value": "{{ .anthropic_api_key }}"
            },
            "model": {
              "provider": "anthropic",
              "name": "claude-sonnet-4-6",
              "options": {
                "anthropic_version": "2023-06-01",
                "max_tokens": 4096
              }
            },
            "response_streaming": "allow",
            "max_request_body_size": 65536
          }
  data:
    - secretKey: anthropic_api_key
      remoteRef:
        key: infra/kong
        property: anthropic-api-key
