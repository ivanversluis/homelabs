---
# Internal client credential for the AI Gateway.
#
# This is NOT the Anthropic key. It authenticates Open WebUI/OpenClaw to Kong.
# Existing Vault property:
#   secret/infra/kong -> AI_GATEWAY_CLIENT_KEY
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kong-ai-gateway-client-key
  namespace: kong
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kong-ai-gateway-client-key
    creationPolicy: Owner
    template:
      metadata:
        labels:
          konghq.com/credential: key-auth
      data:
        key: "{{ .client_key }}"
  data:
    - secretKey: client_key
      remoteRef:
        key: infra/kong
        property: AI_GATEWAY_CLIENT_KEY
---
apiVersion: configuration.konghq.com/v1
kind: KongConsumer
metadata:
  name: homelab-ai-clients
  namespace: kong
  annotations:
    kubernetes.io/ingress.class: kong
username: homelab-ai-clients
credentials:
  - kong-ai-gateway-client-key
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: ai-gateway-key-auth
  namespace: kong
plugin: key-auth
config:
  key_names:
    - apikey
  key_in_header: true
  hide_credentials: true
