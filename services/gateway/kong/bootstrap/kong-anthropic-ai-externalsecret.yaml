# ExternalSecret: builds Kong configuration for Anthropic from Vault.
#
# The real Anthropic API key is never exposed to Open WebUI or OpenClaw. Kong owns
# the upstream credential. Two plugin configs are generated from the same Vault key:
# - config: legacy Kong AI Proxy configuration (kept for rollback)
# - openai-compat-config: request-transformer config for Anthropic's native
#   OpenAI SDK compatibility endpoint.
#
# Existing Vault property:
#   secret/infra/kong -> ANTHROPIC_API_KEY
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kong-anthropic-ai-proxy-config
  namespace: kong
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kong-anthropic-ai-proxy-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Legacy AI Proxy config retained for rollback while the compatibility
        # route is validated independently.
        config: |
          {
            "route_type": "llm/v1/chat",
            "auth": {
              "header_name": "x-api-key",
              "header_value": "{{ .anthropic_api_key }}"
            },
            "model": {
              "provider": "anthropic",
              "name": "claude-sonnet-4-6",
              "options": {
                "anthropic_version": "2023-06-01",
                "max_tokens": 4096
              }
            },
            "response_streaming": "allow",
            "max_request_body_size": 65536
          }

        # Anthropic exposes an OpenAI SDK compatibility surface at /v1.
        # The incoming homelab client credential is removed by normalize-model-claude
        # and key-auth before this plugin injects the real upstream credential.
        openai-compat-config: |
          {
            "add": {
              "headers": [
                "Authorization:Bearer {{ .anthropic_api_key }}",
                "anthropic-version:2023-06-01"
              ]
            }
          }
  data:
    - secretKey: anthropic_api_key
      remoteRef:
        key: infra/kong
        property: ANTHROPIC_API_KEY
