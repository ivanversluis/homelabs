# Internal client credential for the AI Gateway.
#
# This is NOT the Anthropic key. It authenticates Open WebUI/OpenClaw to Kong.
# Existing Vault property:
#   secret/infra/kong -> AI_GATEWAY_CLIENT_KEY
#
# Lives in the bootstrap Kustomization: KongConsumer/homelab-ai-clients (in the
# main kong Kustomization) references this Secret by name, and Kong's admission
# webhook rejects the Consumer if the Secret doesn't already exist. The bootstrap
# Kustomization must reach Ready (wait: true) before the main kong Kustomization applies.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kong-ai-gateway-client-key
  namespace: kong
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kong-ai-gateway-client-key
    creationPolicy: Owner
    template:
      metadata:
        labels:
          konghq.com/credential: key-auth
      data:
        key: "{{ .client_key }}"
  data:
    - secretKey: client_key
      remoteRef:
        key: infra/kong
        property: AI_GATEWAY_CLIENT_KEY
