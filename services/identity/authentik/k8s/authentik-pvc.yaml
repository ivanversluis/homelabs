apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  # Pinned to the real data volume so a force-applied recreate of this PVC can't silently rebind to a fresh empty PV.
  volumeName: pvc-b32f1521-38aa-42dd-b934-c7cc47096c48
  resources:
    requests:
      storage: 500Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-media-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 200Mi
