apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authentik-server
  template:
    metadata:
      labels:
        app: authentik-server
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        node.longhorn.io/create-default-disk: "true"
      containers:
        - name: authentik-server
          image: ghcr.io/goauthentik/server:2026.8.1
          args: ["server"]
          envFrom:
            - configMapRef:
                name: authentik-config
          env:
            - name: AUTHENTIK_POSTGRESQL__USER
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: PG_USER
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: PG_PASSWORD
            - name: AUTHENTIK_POSTGRESQL__NAME
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: PG_DB
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: AUTHENTIK_SECRET_KEY
            - name: AUTHENTIK_HOST_BROWSER
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: AUTHENTIK_HOST_BROWSER
          ports:
            - containerPort: 9000
              name: http
            - containerPort: 9443
              name: https
          volumeMounts:
            - name: authentik-media
              mountPath: /media
              subPath: media
            - name: authentik-media
              mountPath: /templates
              subPath: templates
      volumes:
        - name: authentik-media
          persistentVolumeClaim:
            claimName: authentik-media-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authentik-worker
  template:
    metadata:
      labels:
        app: authentik-worker
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        node.longhorn.io/create-default-disk: "true"
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: authentik-server
              topologyKey: kubernetes.io/hostname
      containers:
        - name: authentik-worker
          image: ghcr.io/goauthentik/server:2026.8.1
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: authentik-config
          env:
            - name: AUTHENTIK_POSTGRESQL__USER
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: PG_USER
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: PG_PASSWORD
            - name: AUTHENTIK_POSTGRESQL__NAME
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: PG_DB
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: AUTHENTIK_SECRET_KEY
            - name: AUTHENTIK_HOST_BROWSER
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: AUTHENTIK_HOST_BROWSER
          volumeMounts:
            - name: authentik-media
              mountPath: /media
              subPath: media
            - name: authentik-media
              mountPath: /templates
              subPath: templates
      volumes:
        - name: authentik-media
          persistentVolumeClaim:
            claimName: authentik-media-pvc
